    note: note || ('转给 ' + friendName),
    status: 'pending'
});

    var cardMsgId = pushHongbaoMessage(friendId, 'me', '', {
        isHongbaoCard: true,
        hongbaoId: id
    });
    var l = getHongbaoList();
    var target = l.find(function(x) { return x.id === id; });
    if (target) target.cardMsgId = cardMsgId;
    saveHongbaoList(l);

    // 5~15 秒后好友自动处理
    scheduleFriendReceiveHongbao(id);

    showToast('转账已发出');
    return true;
}

// 我收红包/转账（对方给我的）
function acceptHongbao(id) {
    var list = getHongbaoList();
    var hb = list.find(function(x) { return x.id === id; });
    if (!hb) return false;
    if (hb.status !== 'pending') {
        showToast('该红包/转账已处理');
        return false;
    }
    if (hb.to !== 'me') return false;

    var friendId = hb.from;
    var friendName = getFriendSpecialName(friendId);

    hb.status = 'accepted';
    hb.acceptedAt = Date.now();
    saveHongbaoList(list);

    // 我的账户：收入
    addFlow('my', {
    amount: hb.amount,
    direction: 'income',
    category: hb.type === 'redpacket' ? '红包' : '转账',
    subCategory: friendName + '给我的' + (hb.type === 'redpacket' ? '红包' : '转账'),
    fromAccount: 'friend:' + friendId,
    toAccount: 'my',
    relatedFriendId: friendId,
    relatedHongbaoId: id,
    note: '来自 ' + friendName,
    status: 'done'
});

    // 好友账户：支出（done）
    updateFriendFlowStatusByHongbao(friendId, id, 'done');

    // 发拍一拍或结果卡片
    if (hb.type === 'redpacket') {
        pushPatMessage(friendId, 'me', '你领取了 ' + friendName + ' 的红包');
    } else {
        pushHongbaoResultCard(friendId, id, 'accepted');
    }

    showToast('已收款');
    return true;
}

// 我退回红包/转账
function rejectHongbao(id) {
    var list = getHongbaoList();
    var hb = list.find(function(x) { return x.id === id; });
    if (!hb) return false;
    if (hb.status !== 'pending') {
        showToast('该红包/转账已处理');
        return false;
    }
    if (hb.to !== 'me') return false;

    var friendId = hb.from;
    var friendName = getFriendSpecialName(friendId);

    hb.status = hb.type === 'redpacket' ? 'expired' : 'rejected';
    hb.rejectedAt = Date.now();
    saveHongbaoList(list);

    // 我这边流水改成 refunded
    updateMyFlowStatusByHongbao(id, 'refunded');

    // 好友余额加回来
    var balance = getAccountBalance('friend:' + friendId);
    setAccountBalance('friend:' + friendId, balance + hb.amount);

    // 好友账户：支出改 refunded
    updateFriendFlowStatusByHongbao(friendId, id, 'refunded');

    // 发拍一拍（红包）或结果卡片（转账）
    if (hb.type === 'redpacket') {
        pushPatMessage(friendId, 'me', '你未领取 ' + friendName + ' 的红包，已过期');
    } else {
        pushHongbaoResultCard(friendId, id, 'rejected');
    }

    showToast(hb.type === 'redpacket' ? '已退回' : '已拒绝');
    return true;
}

// 好友自动决定收/拒/过期（后台定时调用）
function handleFriendReceiveHongbao(id) {
    var list = getHongbaoList();
    var hb = list.find(function(x) { return x.id === id; });
    if (!hb) return false;
    if (hb.status !== 'pending') return false;
    if (hb.from !== 'me') return false;

    var friendId = hb.to;
    var friendName = getFriendSpecialName(friendId);

    if (hb.type === 'redpacket') {
    // 红包 50% 收 50% 不收
    var roll = Math.random();
    if (roll < 0.5) {
            // 好友收
            hb.status = 'accepted';
            hb.acceptedAt = Date.now();
            saveHongbaoList(list);

            // 我账户流水：改成 done（钱已经扣了，只是状态变）
            updateMyFlowStatusByHongbao(id, 'done');

            // 好友账户：收入
            addFlow('friend:' + friendId, {
                amount: hb.amount,
                direction: 'income',
                category: '红包',
                subCategory: '我给' + friendName + '的红包',
                fromAccount: 'me',
                toAccount: 'friend:' + friendId,
                relatedFriendId: friendId,
                relatedHongbaoId: id,
                note: '来自我的红包',
                status: 'done'
            });

            // 发拍一拍
            pushPatMessage(friendId, friendId, friendName + ' 领取了你的红包');
            showToast(friendName + ' 领取了你的红包');
        }
        // 不收就等 24h 过期，不处理
    } else {
        // 转账 33% 收 33% 拒 34% 过期
        var roll2 = Math.random();
        if (roll2 < 0.33) {
            // 收
            hb.status = 'accepted';
            hb.acceptedAt = Date.now();
            saveHongbaoList(list);

            updateMyFlowStatusByHongbao(id, 'done');

            addFlow('friend:' + friendId, {
                amount: hb.amount,
                direction: 'income',
                category: '转账',
                subCategory: '我给' + friendName + '的转账',
                fromAccount: 'me',
                toAccount: 'friend:' + friendId,
                relatedFriendId: friendId,
                relatedHongbaoId: id,
                note: '来自我的转账',
                status: 'done'
            });

            pushHongbaoResultCard(friendId, id, 'accepted');
            showToast(friendName + ' 已收款');
        } else if (roll2 < 0.66) {
            // 拒
            hb.status = 'rejected';
            hb.rejectedAt = Date.now();
            saveHongbaoList(list);

            // 我的余额加回来
            var myBalance = getAccountBalance('my');
            setAccountBalance('my', myBalance + hb.amount);

            updateMyFlowStatusByHongbao(id, 'refunded');

            pushHongbaoResultCard(friendId, id, 'rejected');
            showToast(friendName + ' 已拒绝');
        }
        // 34% 过期不处理
    }
    return true;
}

// 好友收到红包/转账后，5~15 秒自动处理
function scheduleFriendReceiveHongbao(id) {
    var delay = (5 + Math.random() * 10) * 1000;
    setTimeout(function() {
        var ok = handleFriendReceiveHongbao(id);
        if (ok) {
            if (currentChatId) {
                renderChatMessages();
            }
            renderMessages();
        }
    }, delay);
}

// 24h 过期检查
function checkHongbaoExpire() {
    var list = getHongbaoList();
    if (list.length === 0) return;
    var now = Date.now();
    var changed = false;

    for (var i = 0; i < list.length; i++) {
        var hb = list[i];
        if (hb.status !== 'pending') continue;
        if (now < hb.expireAt) continue;

        // 过期
        if (hb.from === 'me') {
            // 我发出去的过期
            var friendId = hb.to;
            var friendName = getFriendSpecialName(friendId);
            hb.status = hb.type === 'redpacket' ? 'expired' : 'expired';

            // 我的余额加回来
            var myBalance = getAccountBalance('my');
            setAccountBalance('my', myBalance + hb.amount);
            updateMyFlowStatusByHongbao(hb.id, 'refunded');

            // 好友账户：收入流水改 refunded
            updateFriendFlowStatusByHongbao(friendId, hb.id, 'refunded');

            if (hb.type === 'redpacket') {
                pushPatMessage(friendId, friendId, friendName + ' 未领取红包，已过期');
            } else {
                pushHongbaoResultCard(friendId, hb.id, 'expired');
            }
        } else {
            // 别人给我的过期
            var fromId = hb.from;
            var fromName = getFriendSpecialName(fromId);
            hb.status = 'expired';

            // 我的流水改 refunded
            updateMyFlowStatusByHongbao(hb.id, 'refunded');

            // 好友余额加回来
            var b = getAccountBalance('friend:' + fromId);
            setAccountBalance('friend:' + fromId, b + hb.amount);
            updateFriendFlowStatusByHongbao(fromId, hb.id, 'refunded');

            if (hb.type === 'redpacket') {
                pushPatMessage(fromId, 'me', '你未领取 ' + fromName + ' 的红包，已过期');
            } else {
                pushHongbaoResultCard(fromId, hb.id, 'expired');
            }
        }
        changed = true;
    }

    if (changed) {
        saveHongbaoList(list);
        renderAll();
        if (currentChatId) {
            renderChatMessages();
        }
        var _accTabContent = document.getElementById('accountTabContent');
        if (_accTabContent && window._accountCurrentTab) {
            _accTabContent.innerHTML = renderAccountTabContent(window._currentAccountId || 'my', window._accountCurrentTab);
        }
    }
}

// 根据 hongbaoId 更新我账户的对应流水状态
function updateMyFlowStatusByHongbao(hongbaoId, newStatus) {
    var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
    if (!wallet.flows) return;
    var changed = false;
    for (var i = 0; i < wallet.flows.length; i++) {
        if (wallet.flows[i].relatedHongbaoId === hongbaoId) {
            wallet.flows[i].status = newStatus;
            changed = true;
        }
    }
    if (changed) DataHub.set('wallet', wallet);
}

// 根据 hongbaoId 更新好友账户的对应流水状态
function updateFriendFlowStatusByHongbao(friendId, hongbaoId, newStatus) {
    var friends = DataHub.get('friends', []);
    var f = friends.find(function(x) { return x.id === friendId; });
    if (!f) return;
    if (!f.flows) f.flows = [];
    var changed = false;
    for (var i = 0; i < f.flows.length; i++) {
        if (f.flows[i].relatedHongbaoId === hongbaoId) {
            f.flows[i].status = newStatus;
            changed = true;
        }
    }
    if (changed) DataHub.set('friends', friends);
}

// 发一张转账结果卡片到聊天页
function pushHongbaoResultCard(friendId, hongbaoId, resultType) {
    var hb = findHongbao(hongbaoId);
    if (!hb) return;
    var text = '';
    if (hb.from === 'me') {
        // 我给好友，好友收/拒/过期，结果由好友发出
        if (resultType === 'accepted') text = '已收款';
        else if (resultType === 'rejected') text = '已退还';
        else if (resultType === 'expired') text = '已过期';
        pushHongbaoMessage(friendId, friendId, text, {
            isHongbaoResult: true,
            hongbaoId: hongbaoId,
            resultType: resultType
        });
    } else {
        // 好友给我，我收/拒/过期，结果由我发出
        if (resultType === 'accepted') text = '已收款';
        else if (resultType === 'rejected') text = '已退还';
        else if (resultType === 'expired') text = '已过期';
        pushHongbaoMessage(friendId, 'me', text, {
            isHongbaoResult: true,
            hongbaoId: hongbaoId,
            resultType: resultType
        });
    }
}

// 好友随机发红包/转账给我（聊天时 1% 概率触发）
function tryFriendSendHongbao(chatId) {
    if (!chatId) return;
    if (Math.random() >= 0.01) return;

    var friend = getFriendObj(chatId);
    if (!friend) return;
    var friendBalance = friend.balance || 0;
    if (friendBalance < 1) return;

    // 随机金额（1 ~ min(好友余额, 200) 之间）
    var maxAmt = Math.min(friendBalance, 200);
    var amount = Math.round((1 + Math.random() * (maxAmt - 1)) * 100) / 100;
    if (amount < 0.01) return;

    var isRedpacket = Math.random() < 0.5;
    var id = 'hb' + Date.now() + Math.random().toString(36).substr(2, 4);
    var now = Date.now();
    var expireAt = now + 24 * 60 * 60 * 1000;
    var friendName = friend.name || '好友';

    var list = getHongbaoList();
    list.push({
        id: id,
        type: isRedpacket ? 'redpacket' : 'transfer',
        from: chatId,
        to: 'me',
        amount: amount,
        note: isRedpacket ? '恭喜发财' : '转账',
        status: 'pending',
        createdAt: now,
        expireAt: expireAt,
        acceptedAt: null,
        rejectedAt: null,
        cardMsgId: null,
        resultMsgId: null
    });
    saveHongbaoList(list);

    // 好友账户：支出（pending）
    addFlow('friend:' + chatId, {
    amount: amount,
    direction: 'expense',
    category: isRedpacket ? '红包' : '转账',
    subCategory: friendName + '给我的' + (isRedpacket ? '红包' : '转账'),
    fromAccount: 'friend:' + chatId,
    toAccount: 'me',
    relatedFriendId: chatId,
    relatedHongbaoId: id,
    note: (isRedpacket ? '给 ' : '转给 ') + '我',
    status: 'pending'
});

    // 发卡片
    var cardMsgId = pushHongbaoMessage(chatId, chatId, '', {
        isHongbaoCard: true,
        hongbaoId: id
    });
    var l = getHongbaoList();
    var target = l.find(function(x) { return x.id === id; });
    if (target) target.cardMsgId = cardMsgId;
    saveHongbaoList(l);

    showToast(friendName + ' 给你发了一个' + (isRedpacket ? '红包' : '转账'));
}

function initAccountSystem() {
    // 我的钱包
    var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
    if (!wallet.flows) wallet.flows = [];
    if (!wallet.purchasedItems) wallet.purchasedItems = [];
    if (!wallet.monthlyStats) wallet.monthlyStats = { month: '', mostCollected: '', mostBought: '', mostBoughtForMe: '', diaryTriggerProduct: '' };
    DataHub.set('wallet', wallet);

    // 每个好友
    var friends = DataHub.get('friends', []);
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        if (!f.flows) f.flows = [];
        if (!f.purchasedItems) f.purchasedItems = [];
        if (!f.monthlyStats) f.monthlyStats = { month: '', mostCollected: '', mostBought: '', mostBoughtForMe: '', diaryTriggerProduct: '' };
        if (!f.couple) f.couple = {};
        if (!f.couple.piggy) f.couple.piggy = { balance: 0, flows: [] };
        if (!f.couple.piggy.flows) f.couple.piggy.flows = [];
    }
    DataHub.set('friends', friends);

    // 商场
var mall = DataHub.get('mall', null);
if (!mall) {
    mall = { products: [], categories: [{ name: '默认', exclusiveFriendId: '' }] };
    DataHub.set('mall', mall);
} else {
    if (!mall.products) mall.products = [];
    if (!mall.categories) mall.categories = [];
    var hasDefault = mall.categories.some(function(c) { return c.name === '默认'; });
    if (!hasDefault) {
        mall.categories.unshift({ name: '默认', exclusiveFriendId: '' });
    }
    DataHub.set('mall', mall);
}

    // 支付礼物请求
    var payRequests = DataHub.get('payRequests', null);
    if (!payRequests) {
        DataHub.set('payRequests', []);
    }

    // 月度统计标记
    var lastMonthlyStatsMonth = DataHub.get('lastMonthlyStatsMonth', null);

        var now = new Date();
        DataHub.set('lastMonthlyStatsMonth', now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0'));

async function init() {
    await getDB();
    const data = await loadData();
    if (data) {
        DataHub.setAll(data);
    } else {
        var fresh = JSON.parse(JSON.stringify(defaultData));
        if (!fresh.groups.includes('未分组')) {
            fresh.groups.push('未分组');
        }
        DataHub.setAll(fresh);
    }

    var current = DataHub.getAll();
    for (let key in defaultData) {
        if (!(key in current)) {
            current[key] = defaultData[key];
        }
        if (key === 'wallet' && !current[key].flows) current[key].flows = [];
        if (key === 'settings') {
            for (let sk in defaultData.settings) {
                if (!(sk in current[key])) current[key][sk] = defaultData.settings[sk];
            }
        }
    }

    var groups = DataHub.get('groups', []);
if (!groups.includes('未分组')) {
    groups.push('未分组');
    DataHub.set('groups', groups);
}

var firstOpenDate = DataHub.get('firstOpenDate', null);
if (!firstOpenDate) {
    var now0 = new Date();
    firstOpenDate = now0.getFullYear() + '.' + String(now0.getMonth()+1).padStart(2,'0') + '.' + String(now0.getDate()).padStart(2,'0');
    DataHub.set('firstOpenDate', firstOpenDate);
}

var dict = DataHub.get('dictionary', null);
if (!dict) {
    dict = JSON.parse(JSON.stringify(defaultData.dictionary));
    DataHub.set('dictionary', dict);
} else {
    if (!dict.groups) dict.groups = { word: ['默认'] };
    if (!dict.groups.word) dict.groups.word = ['默认'];
    if (!dict.items) dict.items = [];
    DataHub.set('dictionary', dict);
}

    var friends = DataHub.get('friends', []);
for (var fi = 0; fi < friends.length; fi++) {
    var f = friends[fi];
    if (!f.privateAlbum) f.privateAlbum = [];
    if (!f.settings) f.settings = null;
    if (!f.storage) f.storage = null;
    if (!f.couple) {
        f.couple = { enabled: false, info: { name: '', birthday: '', height: '', nickname: '', startDate: '' }, statusCalendar: {} };
    } else {
        if (!f.couple.info) f.couple.info = { name: '', birthday: '', height: '', nickname: '', startDate: '' };
        if (!f.couple.statusCalendar) f.couple.statusCalendar = {};
    }
}
DataHub.set('friends', friends);

    var chatrooms = DataHub.get('chatrooms', []);
    for (var ci = 0; ci < chatrooms.length; ci++) {
        var c = chatrooms[ci];
        if (!c.settings) c.settings = null;
        if (!c.storage) c.storage = null;
    }
    DataHub.set('chatrooms', chatrooms);

    if (!DataHub.get('votes', null)) {
    DataHub.set('votes', []);
}

initAccountSystem();
DataHub.set('pendingTransfers', []);
var _walletClean = DataHub.get('wallet', { balance: 0, flows: [] });
if (_walletClean && _walletClean.monthlyStats) {
    _walletClean.monthlyStats.diaryTriggerProduct = '';
    DataHub.set('wallet', _walletClean);
}
startFriendAutoShoppingChecker();
startFriendPayRequestChecker();
checkHongbaoExpire();
setInterval(function() {
    checkHongbaoExpire();
}, 5000);
startRandomDeleteChecker();
startShoppingDiaryReplyScheduler();
startMonthlyStatsChecker();

    function initFriendAI() {
    var friends = DataHub.get('friends', []);
    friends.forEach(function(friend) {
        if (!friend.diary) friend.diary = [];
        for (var i = 0; i < friend.diary.length; i++) {
            var d = friend.diary[i];
            if (!d) continue;
            if (!d.date) {
                d.date = getDiaryDateFromTime(d.time) || getTodayDateStr();
            }
            if (!d.replies) d.replies = [];
            if (d.content === undefined) d.content = '';
        }
        if (Math.random() * 100 <= 30) {
            generateMomentForFriend(friend);
        }
    });
    DataHub.set('friends', friends);
}
    
    function generateMomentsOnAppUse() {
    var friends = DataHub.get('friends', []);
    friends.forEach(function(friend) {
        if (Math.random() * 100 <= 30) {
            generateMomentForFriendById(friend.id);
        }
    });
}

    function generateMomentForFriend(friend) {
    generateMomentForFriendById(friend.id);
}
