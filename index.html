let appData = JSON.parse(JSON.stringify(defaultData));

function getDB() {
    if (dbOpenPromise) return dbOpenPromise;
    dbOpenPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
        request.onsuccess = (e) => {
            db = e.target.result;
            resolve(db);
        };
        request.onerror = (e) => {
            console.error('数据库打开失败:', e.target.error);
            reject(e.target.error);
        };
    });
    return dbOpenPromise;
}

async function loadData() {
    try {
        const database = await getDB();
        const tx = database.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        return new Promise((resolve) => {
            const getReq = store.get('mainData');
            getReq.onsuccess = () => {
                if (getReq.result) {
                    const data = getReq.result.data;
                    for (let key in defaultData) {
                        if (!(key in data)) data[key] = defaultData[key];
                        if (key === 'wallet' && !data[key].flows) data[key].flows = [];
                        if (key === 'settings') {
                            for (let sk in defaultData.settings) {
                                if (!(sk in data[key])) data[key][sk] = defaultData.settings[sk];
                            }
                        }
                    }
                    resolve(data);
                } else {
                    resolve(null);
                }
            };
            getReq.onerror = () => resolve(null);
        });
    } catch (e) {
        console.error('loadData 错误:', e);
        return null;
    }
}

async function saveData(data) {
    try {
        const database = await getDB();
        return new Promise((resolve, reject) => {
            const tx = database.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            const putReq = store.put({ id: 'mainData', data: data });

            putReq.onsuccess = () => {
                console.log('数据已保存 (put 成功)');
            };

            tx.oncomplete = function() {
                console.log('数据已保存 (事务完成)');
                resolve();
            };

            tx.onerror = function(e) {
                console.error('保存失败 (事务错误):', e.target.error);
                reject(e.target.error);
            };
        });
    } catch (e) {
        console.error('saveData 异常:', e);
        throw e;
    }
}

// ====== DataHub 统一数据接口 ======
const DataHub = {
    set: function(key, value) {
        if (key === 'lexiconData') {
            appData.lexiconData = value;
        } else {
            appData[key] = value;
        }
        saveData(appData).catch(err => {
            console.error('DataHub.set 保存失败:', err);
        });
    },
    get: function(key, defaultValue) {
        if (key === 'lexiconData') {
            return appData.lexiconData || defaultValue;
        }
        return (key in appData) ? appData[key] : defaultValue;
    },
    delete: function(key) {
        if (key === 'lexiconData') {
            delete appData.lexiconData;
        } else {
            delete appData[key];
        }
        saveData(appData).catch(err => {
            console.error('DataHub.delete 保存失败:', err);
        });
    },
    getAll: function() {
        return appData;
    },
    setAll: function(data) {
        appData = data;
        saveData(appData).catch(err => {
            console.error('DataHub.setAll 保存失败:', err);
        });
    }
};
function getInitials(name) {
    return name ? name.charAt(0).toUpperCase() : '?';
}

function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.remove('show'), 1500);
}

function getChat(id) {
    if (!id) return null;
    var friends = DataHub.get('friends', []);
    var f = friends.find(function(f) { return f.id === id; });
    if (f) return f;
    var chatrooms = DataHub.get('chatrooms', []);
    var r = chatrooms.find(function(c) { return c.id === id; });
    return r || null;
}

function updateChatTopAvatar(chatId) {
    var avatarEl = document.getElementById('chatTopAvatar');
    if (!avatarEl || !chatId) return;

    avatarEl.innerHTML = '';

    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });

    if (friend) {
        if (friend.avatar && friend.avatar.startsWith('data:image')) {
            avatarEl.innerHTML = '<img src="' + friend.avatar + '" style="width:100%;height:100%;object-fit:cover;">';

var autoStartTimer = null;
var lastAutoTriggerTime = 0;

function stopAutoStartTimer() {
    if (autoStartTimer) {
        clearInterval(autoStartTimer);
        autoStartTimer = null;
    }
}

function startAutoStartTimer() {
    stopAutoStartTimer();
    lastAutoTriggerTime = 0;
    autoStartTimer = setInterval(function() {
        var chatPage = document.getElementById('chatPage');
        if (!chatPage || !chatPage.classList.contains('active')) return;
        if (!currentChatId) return;

        var msgs = DataHub.get('messages', []).filter(function(m) { return m.chatId === currentChatId; });
        if (msgs.length === 0) return;
        var lastMsg = msgs[msgs.length - 1];
        if (!lastMsg) return;

        var lastTime = lastMsg.timestamp || 0;
        if (!lastTime) return;

        var now = Date.now();
        if (now - lastTime < 300000) return;
        if (now - lastAutoTriggerTime < 300000) return;

        lastAutoTriggerTime = now;

        var allFriends = DataHub.get('friends', []);
        var friend = allFriends.find(function(f) { return f.id === currentChatId; });

        if (friend) {
            resetReplyProbability(currentChatId);
            var latestFriends = DataHub.get('friends', []);
            var latestFriend = latestFriends.find(function(f) { return f.id === currentChatId; });
            if (latestFriend) {
                if (!latestFriend.replyState) latestFriend.replyState = {};
                latestFriend.replyState.chainProbability = 100;
                DataHub.set('friends', latestFriends);
            }
            handleFriendReply(currentChatId, lastMsg);
        } else {
            var allRooms = DataHub.get('chatrooms', []);
            var room = allRooms.find(function(r) { return r.id === currentChatId; });
            if (room) {
                handleChatroomReply(currentChatId, lastMsg);
            }
        }
    }, 300000);
}

var chatSessionTimer = {
    chatId: null,
    startAt: 0,
    interval: null
};

function startChatSessionTimer(chatId) {
    stopChatSessionTimer();
    chatSessionTimer.chatId = chatId;
    chatSessionTimer.startAt = Date.now();
    chatSessionTimer.interval = setInterval(function() {
        updateChatAcceleration(chatId);
    }, 60000);
}

function stopChatSessionTimer() {
    if (chatSessionTimer.interval) {
        clearInterval(chatSessionTimer.interval);
        chatSessionTimer.interval = null;
    }
    if (chatSessionTimer.chatId) {
        updateChatAcceleration(chatSessionTimer.chatId);
    }
    chatSessionTimer.chatId = null;
    chatSessionTimer.startAt = 0;
}

function updateChatAcceleration(chatId) {
    if (!chatId) return;
    if (!chatSessionTimer.startAt) return;
    var elapsedHours = (Date.now() - chatSessionTimer.startAt) / 3600000;
    var multiplier = 1;
    if (elapsedHours >= 1) {
        multiplier = 1 + Math.floor(elapsedHours) * 0.5;
        if (multiplier > 5) multiplier = 5;
    }
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    friend.chatAcceleration = multiplier;
    friend.chatAccelerationUpdatedAt = Date.now();
    DataHub.set('friends', friends);
}

function getFriendAcceleration(chatId) {
    if (chatSessionTimer && chatSessionTimer.chatId === chatId && chatSessionTimer.startAt) {
        var elapsedHours = (Date.now() - chatSessionTimer.startAt) / 3600000;
        if (elapsedHours >= 1) {
            var m = 1 + Math.floor(elapsedHours) * 0.5;
            if (m > 5) m = 5;
            return m;
        }
    }
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend) return 1;
    if (friend.chatAcceleration && friend.chatAccelerationUpdatedAt) {
        var elapsed = (Date.now() - friend.chatAccelerationUpdatedAt) / 3600000;
        if (elapsed < 0.5) {
            return friend.chatAcceleration;
        }
    }
    return 1;
}

// ====== 聊天未读圆圈（查看历史时不跳转） ======
var chatViewState = {
    isNearBottom: true,
    unreadWhileReading: 0
};

function isChatNearBottom() {
    var container = document.getElementById('chatMessages');
    if (!container) return true;
    var distance = container.scrollHeight - container.scrollTop - container.clientHeight;
    return distance <= 50;
}

function showChatUnreadBubble(count) {
    var bubble = document.getElementById('chatUnreadBubble');
    if (!bubble) return;
    if (count > 0) {
        bubble.textContent = count > 99 ? '99+' : String(count);
        bubble.classList.add('show');
    } else {
        bubble.classList.remove('show');
    }
}

// ====== 退出期间积累的未读：右下角文字提示 ======
var chatUnreadTextState = {
    chatId: null,
    firstUnreadMsgId: null,
    count: 0
};

function showChatUnreadText(chatId) {
    var el = document.getElementById('chatUnreadText');
    if (!el) return;

    var msgs = DataHub.get('messages', []);
    var unreadList = [];
    for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].chatId === chatId && msgs[i].unread > 0) {
            unreadList.push(msgs[i]);
        }
    }

    if (unreadList.length < 2) {
        el.classList.remove('show');
        chatUnreadTextState.chatId = null;
        chatUnreadTextState.firstUnreadMsgId = null;
        chatUnreadTextState.count = 0;
        return;
    }

    unreadList.sort(function(a, b) {
        var ta = a.timestamp || 0;
        var tb = b.timestamp || 0;
        return ta - tb;
    });

    chatUnreadTextState.chatId = chatId;
    chatUnreadTextState.firstUnreadMsgId = unreadList[0].id;
    chatUnreadTextState.count = unreadList.length;

    el.textContent = unreadList.length + '条消息未读↑';
    el.classList.add('show');
}

function hideChatUnreadText() {
    var el = document.getElementById('chatUnreadText');
    if (el) el.classList.remove('show');
    chatUnreadTextState.chatId = null;
    chatUnreadTextState.firstUnreadMsgId = null;
    chatUnreadTextState.count = 0;
}

function jumpChatToFirstUnread() {
    if (!chatUnreadTextState.firstUnreadMsgId) return;
    var container = document.getElementById('chatMessages');
    if (!container) return;
    var row = container.querySelector('[data-msgid="' + chatUnreadTextState.firstUnreadMsgId + '"]');
    if (row) {
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    } else {
        container.scrollTop = 0;
    }
    hideChatUnreadText();
}

function clearChatUnreadBubble() {
    chatViewState.unreadWhileReading = 0;
    showChatUnreadBubble(0);
}

function jumpChatToBottom() {
    var container = document.getElementById('chatMessages');
    if (!container) return;
    chatViewState.isNearBottom = true;
    clearChatUnreadBubble();
    function doScroll() {
        var c = document.getElementById('chatMessages');
        if (!c) return;
        c.scrollTop = c.scrollHeight;
    }
    doScroll();
    requestAnimationFrame(function() {
        doScroll();
        requestAnimationFrame(function() {
            doScroll();
        });
    });
    setTimeout(doScroll, 50);
    setTimeout(doScroll, 150);
    setTimeout(doScroll, 300);
}

function bindChatScrollListener() {
    var container = document.getElementById('chatMessages');
    if (!container) return;
    container.onscroll = function() {
        var nearBottom = isChatNearBottom();
        chatViewState.isNearBottom = nearBottom;
        if (nearBottom) {
            clearChatUnreadBubble();
        }
    };
    container.onclick = function(e) {
        if (document.getElementById('chatBottomPanel') && document.getElementById('chatBottomPanel').style.display === 'flex') {
            if (!e.target.closest('#chatBottomPanel')) {
                closeChatBottomPanel();
            }
        }
    };
}

function sendVote() {
    var titleInput = document.getElementById('voteTitleInput');
    var optionInputs = document.querySelectorAll('.vote-option-input');
    var title = titleInput ? titleInput.value.trim() : '';
    if (!title) {
        showToast('请输入投票标题');
        return;
    }
    var options = [];
    for (var i = 0; i < optionInputs.length; i++) {
        var val = optionInputs[i].value.trim();
        if (val) options.push(val);
    }
    if (options.length < 2) {
        showToast('至少需要2个选项');
        return;
    }

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var votes = {};
    for (var j = 0; j < options.length; j++) {
        votes[options[j]] = 0;
    }

    var voteData = {
        id: 'v' + genId(),
        title: title,
        options: options,
        votes: votes,
        voters: [],
        creator: 'me',
        time: time
    };

    var allVotes = DataHub.get('votes', []);
    allVotes.push(voteData);
    DataHub.set('votes', allVotes);

    var msgText = '投票：' + title + '\n';
    for (var k = 0; k < options.length; k++) {
        msgText += (k + 1) + '. ' + options[k] + ' (0票)\n';
    }
    msgText += '\n点击选项投票';

    var msgs = DataHub.get('messages', []);
    msgs.push({
        id: 'm' + genId(),
        chatId: currentChatId,
        from: 'me',
        text: msgText,
        time: time,
        unread: 0,
        isVote: true,
        voteId: voteData.id
    });
    DataHub.set('messages', msgs);

    closeModal();
    renderChatMessages();
    renderMessages();
    showToast('投票已发布');
}

function handleVoteClick(voteId, optionIndex) {
    var allVotes = DataHub.get('votes', []);
    var vote = allVotes.find(function(v) { return v.id === voteId; });
    if (!vote) {
        showToast('投票已失效');
        return;
    }

    var myId = 'me';
    if (vote.voters && vote.voters.indexOf(myId) !== -1) {
        showToast('你已经投过票了');
        return;
    }

    var optionKeys = Object.keys(vote.votes);
    if (optionIndex < 0 || optionIndex >= optionKeys.length) return;
    var selectedOption = optionKeys[optionIndex];
    vote.votes[selectedOption] = (vote.votes[selectedOption] || 0) + 1;
    if (!vote.voters) vote.voters = [];
    vote.voters.push(myId);
    DataHub.set('votes', allVotes);

    var msgs = DataHub.get('messages', []);
    var targetMsg = msgs.find(function(m) { return m.voteId === voteId; });
    if (targetMsg) {
        var newText = '投票：' + vote.title + '\n';
        for (var i = 0; i < vote.options.length; i++) {
            var opt = vote.options[i];
            var count = vote.votes[opt] || 0;
            newText += (i + 1) + '. ' + opt + ' (' + count + '票)\n';
        }
        newText += '\n点击选项投票';
        targetMsg.text = newText;
        DataHub.set('messages', msgs);
    }

    renderChatMessages();
    renderMessages();
    showToast('投票成功');
}

// ====== 按内置规则猜词性（返回数组） ======
function guessPos(word) {
    if (!word) return [];
    var w = word.trim();
    if (!w) return [];

    var result = [];
    function add(pos) {
        if (result.indexOf(pos) === -1) result.push(pos);
    }

    // 代词
    if (['我','你','他','她','它','我们','你们','他们','她们','它们','大家','咱们','这','那','谁','自己','别人','什么','怎么','哪里','这儿','那儿'].indexOf(w) !== -1) add('代词');

    // 动词
    if (['说','看','听','想','去','来','走','跑','吃','喝','玩','学','学习','工作','做','干','拿','给','送','买','卖','写','读','唱','跳','笑','哭','喜欢','爱','恨','觉得','认为','发现','知道','明白','懂','要','会','能','可以','应该','需要','希望','打算','开始','结束','帮助','告诉','问','回答','是','有','在','到','着','过','起来','下去','出来','进去'].indexOf(w) !== -1) add('动词');

    // 副词
    if (['很','都','也','就','不','没','太','最','更','还','再','已经','马上','立刻','刚','才','一直','总是','经常','偶尔','忽然','突然','终于','当然','也许','大概','可能','一定','必须','又','再','只','仅仅','几乎','差不多','正在','将要','曾经'].indexOf(w) !== -1) add('副词');

    // 形容词
    if (['好','坏','大','小','多','少','高','矮','长','短','快','慢','新','旧','冷','热','开心','难过','高兴','伤心','漂亮','好看','丑','聪明','笨','勤快','懒','安静','热闹','干净','脏','甜','酸','苦','辣','咸','轻','重','远','近','深','浅','亮','暗','美','香'].indexOf(w) !== -1) add('形容词');

    // 数词
    if (['一','二','三','四','五','六','七','八','九','十','百','千','万','亿','零','两','半','几','第一','第二','第三'].indexOf(w) !== -1) add('数词');

    // 量词
    if (['个','只','条','张','本','把','支','件','双','对','群','堆','块','片','滴','粒','棵','朵','座','间','辆','艘','架','台','部','篇','首','幅','封','页','层','排','串','束','杯','碗','盘','瓶','袋','包','盒','箱','位','名','次','回','遍','趟','顿','场','阵','番'].indexOf(w) !== -1) add('量词');

    // 区别词
    if (['男','女','正','副','金','银','单','双','彩色','黑白','中式','西式','急性','慢性','大型','小型','微型','高级','低级','初级','中级'].indexOf(w) !== -1) add('区别词');

    // 名词（时间、地点、事物）
    if (['今天','明天','昨天','现在','刚才','以后','以前','将来','早上','中午','晚上','每天','天天','时候','地方','东西','事情','朋友','家人','老师','同学','天气','心情','雨','雪','风','太阳','月亮','花','草','树','猫','狗','鸟','鱼','水','火','山','河','海','天','地','日','月','年','心','话','问题','答案','故事','歌','电影','游戏','手机','电脑','衣服','鞋','帽子','桌子','椅子','床','灯','饭','觉','书','家','门','班','学','校','路','车','船','飞机','钱','人','事'].indexOf(w) !== -1) add('名词');

    // 介词
    if (['在','从','到','向','往','朝','对','对于','关于','把','被','让','叫','给','为','为了','因为','由于','除了','按照','根据','通过','沿着','顺着','随着','比','跟','和','同','与'].indexOf(w) !== -1) add('介词');

    // 连词
    if (['和','跟','与','及','以及','或','或者','还是','而','而且','并','并且','但','但是','可是','然而','不过','因为','所以','因此','如果','假如','要是','虽然','尽管','即使','无论','不管','只要','只有','除非','既','又','一边','一面'].indexOf(w) !== -1) add('连词');

    // 助词
    if (['的','地','得','着','了','过','所','似的','一样','一般','等','等等','之','来着'].indexOf(w) !== -1) add('助词');

    // 语气词
    if (['啊','呀','吧','呢','吗','嘛','哦','噢','嗯','哈','哇','哎','唉','喂','嘿','哼','咦','咳','罢了','而已','啦','喽','哟'].indexOf(w) !== -1) add('语气词');

    // 叹词
    if (['唉','哎呀','哎哟','啊','哦','噢','嗯','哼','呸','嘘','嘿','哈','哇','咦','喂'].indexOf(w) !== -1) add('叹词');

    // 拟声词
    if (['哗','轰','砰','啪','咚','叮','当','哐','唰','滴答','咕噜','咔嚓','噼里啪啦','叮当'].indexOf(w) !== -1) add('拟声词');

    // 叠词
    if (/^(.)\1$/.test(w)) add('形容词');

    // 后缀判断
    if (w.endsWith('地')) add('副词');
    if (w.endsWith('的')) add('助词');
    if (w.endsWith('得')) add('助词');
    if (w.endsWith('吗') || w.endsWith('吧') || w.endsWith('呢') || w.endsWith('啊')) add('语气词');

    // 两字动词后缀
    if (w.length === 2 && (w.endsWith('动') || w.endsWith('作') || w.endsWith('谈') || w.endsWith('聊') || w.endsWith('议'))) add('动词');

    // 什么都没猜出来，按字形特征细分，不直接归其他
    if (result.length === 0) {
        // 叠字后缀：XX头、XX子、XX儿、XX们、XX者、XX家 → 名词
        if (w.length >= 2 && (w.endsWith('头') || w.endsWith('子') || w.endsWith('儿') || w.endsWith('们') || w.endsWith('者') || w.endsWith('家') || w.endsWith('员') || w.endsWith('长') || w.endsWith('师') || w.endsWith('生') || w.endsWith('性') || w.endsWith('度') || w.endsWith('力') || w.endsWith('感'))) add('名词');
        // XX化、XX起来、XX下去 → 动词
        else if (w.length >= 2 && (w.endsWith('化') || w.endsWith('起来') || w.endsWith('下去') || w.endsWith('出来') || w.endsWith('进去'))) add('动词');
        // XX然 → 副词或形容词
        else if (w.endsWith('然')) add('副词');
        // XX于 → 介词
        else if (w.endsWith('于')) add('介词');
        // XX着、XX了、XX过 → 助词
        else if (w.endsWith('着') || w.endsWith('了') || w.endsWith('过')) add('助词');
        // XX很、XX极、XX死、XX透 → 副词
        else if (w.endsWith('很') || w.endsWith('极') || w.endsWith('死') || w.endsWith('透')) add('副词');
        // 三字以上，无明显特征 → 名词（多数固定说法是名词性）
        else if (w.length >= 3) add('名词');
        // 两字，无明显特征 → 动词（中文两字词里动词占比高）
        else if (w.length === 2) add('动词');
        // 单字，无明显特征 → 名词
        else add('名词');
    }

    return result;
}

window.guessPos = guessPos;

// ====== 词典拼句：按词性取词，再按句子成分组合 ======
function generateDictionarySentence() {
    var data = getDictionaryData();
    var items = data.items || [];
    if (items.length === 0) return null;

    var 主语词 = [], 谓语词 = [], 宾语词 = [], 定语词 = [], 状语词 = [], 补语词 = [];
    var 独立词 = [], 语气词 = [], 介词词 = [], 连词词 = [], 助词词 = [];

    items.forEach(function(item) {
        var w = item.content || '';
        if (!w) return;
        var posArr = getPosArray(item);
        if (posArr.length === 0) {
            posArr = guessPos(w);
        }
        posArr.forEach(function(pos) {
            var comps = POS_TO_COMPONENTS[pos] || [];
            comps.forEach(function(comp) {
                if (comp === '主语') 主语词.push(w);
                else if (comp === '谓语') 谓语词.push(w);
                else if (comp === '宾语') 宾语词.push(w);
                else if (comp === '定语') 定语词.push(w);
                else if (comp === '状语') 状语词.push(w);
                else if (comp === '补语') 补语词.push(w);
                else if (comp === '独立') 独立词.push(w);
                else if (comp === '介词位') 介词词.push(w);
                else if (comp === '连词位') 连词词.push(w);
                else if (comp === '助词位') 助词词.push(w);
                else if (comp === '语气位') 语气词.push(w);
            });
        });
    });

    var all = items.map(function(it) { return it.content; }).filter(function(w) { return w; });
    if (all.length === 0) return null;

    function pick(arr) {
        if (arr.length > 0) return arr[Math.floor(Math.random() * arr.length)];
        return all[Math.floor(Math.random() * all.length)];
    }

    var 模板 = [
    function() { return pick(独立词) + ' ' + pick(主语词) + ' ' + pick(谓语词) + ' ' + pick(宾语词) + ' ' + pick(语气词); },
    function() { return pick(主语词) + ' ' + pick(谓语词); },
    function() { return pick(主语词) + ' ' + pick(谓语词) + ' ' + pick(宾语词); },
    function() { return pick(状语词) + ' ' + pick(主语词) + ' ' + pick(谓语词); },
    function() { return pick(状语词) + ' ' + pick(主语词) + ' ' + pick(谓语词) + ' ' + pick(宾语词); },
    function() { return pick(主语词) + ' ' + pick(谓语词) + ' ' + pick(定语词) + ' ' + pick(宾语词); },
    function() { return pick(定语词) + ' ' + pick(主语词) + ' ' + pick(谓语词) + ' ' + pick(宾语词); },
    function() { return pick(状语词) + ' ' + pick(主语词) + ' ' + pick(定语词) + ' ' + pick(宾语词); },

function generateReplyContent(chatId) {
    var lexiconEmpty = isLexiconEmpty(chatId);
    var dictEmpty = isDictionaryEmpty();

    if (lexiconEmpty && dictEmpty) {
        return [{ text: '', isPat: false, skip: true }];
    }

    var settings = DataHub.get('settings', {});
    var dictEnabled = (settings.dictionaryEnabled !== undefined) ? settings.dictionaryEnabled : true;
    var dictProb = (settings.dictionaryProbability !== undefined) ? settings.dictionaryProbability : 50;

    var useDictionary = false;
    if (lexiconEmpty) {
        useDictionary = dictEnabled;
    } else if (dictEmpty) {
        useDictionary = false;
    } else if (!dictEnabled) {
        useDictionary = false;
    } else {
        useDictionary = Math.random() * 100 < dictProb;
    }

    if (useDictionary) {
        var sentence = generateDictionarySentence();
        if (!sentence) {
            return [{ text: '', isPat: false, skip: true }];
        }
        var quoteObj = pickQuoteTarget(chatId);
        return [{ text: sentence, isPat: false, quote: quoteObj }];
    }

    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return [{ text: '嗯嗯', isPat: false }];

    var patItems = [];
    var normalItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'pat') {
                patItems.push(item.content);
            } else if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                normalItems.push({ kind: 'text', content: item.content });
            } else if (item.type === 'emoji_pack' && item.images && item.images.length > 0) {
                normalItems.push({ kind: 'image', content: item.images[0] });
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'pat') {
                if (item.locked === true) return;
                patItems.push(item.content);
            } else if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                normalItems.push({ kind: 'text', content: item.content });
            } else if (item.type === 'emoji_pack' && item.images && item.images.length > 0) {
                normalItems.push({ kind: 'image', content: item.images[0] });
            }
        });
    }

    var settings = DataHub.get('settings', {});
    var patProb = (friend.chatSettings && friend.chatSettings.patProbability !== undefined) ? friend.chatSettings.patProbability : ((settings.globalPatProbability !== undefined) ? settings.globalPatProbability : 2);

    if (patItems.length === 0 && Math.random() * 100 <= patProb) {
        return [{ text: '', isPat: false, skip: true }];
    }
    if (patItems.length > 0 && Math.random() * 100 <= patProb) {
        var patText = patItems[Math.floor(Math.random() * patItems.length)];
        var identifier = (friend.chatSettings && friend.chatSettings.patIdentifier) ? friend.chatSettings.patIdentifier : (settings.globalPatOtherIdentifier || '💕');
        var raw = identifier + ' ' + patText + ' ' + identifier;
        var displayText = '';
        for (var pi = 0; pi < raw.length; pi += 16) {
            if (pi > 0) displayText += '\n';
            displayText += raw.substring(pi, pi + 16);
        }
        return [{ text: displayText, isPat: true }];
    }

    var albumPick = pickAlbumImageToSend(chatId);

if (albumPick) {
    var albumText = albumPick.text || '';
    var albumImgBubble = '<img src="' + albumPick.imageData + '" style="max-width:64px;max-height:64px;border-radius:8px;display:inline-block;">';
    if (albumText) {
        return [{ text: albumText + ' ' + albumImgBubble, isPat: false, isImage: true, imageData: albumPick.imageData }];
    }
    return [{ text: albumImgBubble, isPat: false, isImage: true, imageData: albumPick.imageData }];
}

if (normalItems.length === 0) return [{ text: '嗯嗯', isPat: false }];

var count = Math.floor(Math.random() * 3) + 1;
    var shuffled = normalItems.slice().sort(function() { return Math.random() - 0.5; });
    var selected = [];
    for (var i = 0; i < Math.min(count, shuffled.length); i++) {
        selected.push(shuffled[i]);
    }

    var selectedTexts = selected.filter(function(s) { return s.kind === 'text'; });
    var selectedImages = selected.filter(function(s) { return s.kind === 'image'; });

    var quoteObj = pickQuoteTarget(chatId);
    var specialText = null;
    if (quoteObj && quoteObj.isSpecialQuote) {
        var myProfile = DataHub.get('myProfile', { nickname: '我' });
        var specialName = myProfile.specialQuoteName || myProfile.nickname || '我';
        specialText = specialName + '，想要这句字卡';
    }

    function buildTextPart() {
        if (specialText) return specialText;
        if (selectedTexts.length === 0) return '';
        var arr = selectedTexts.map(function(s) { return s.content; });
        var t = arr.join(' ');
return t;
    }

    if (selectedImages.length === 0) {
        var onlyText = buildTextPart();
        var r1 = { text: onlyText || '嗯嗯', isPat: false, quote: quoteObj };
        return [r1];
    }

    if (selectedTexts.length === 0) {
        var arrImg = [];
        for (var ii = 0; ii < selectedImages.length; ii++) {
            arrImg.push({
                text: '<img src="' + selectedImages[ii].content + '" style="max-width:64px;max-height:64px;border-radius:8px;display:inline-block;">',
                isPat: false,
                isImage: true,
                imageData: selectedImages[ii].content
            });
        }
        if (arrImg.length > 0) arrImg[arrImg.length - 1].quote = quoteObj;
        return arrImg;
    }

    var imgData = selectedImages[0].content;
    var textPart = buildTextPart();
    var imgBubble = '<img src="' + imgData + '" style="max-width:64px;max-height:64px;border-radius:8px;display:inline-block;">';

    var mode = Math.floor(Math.random() * 4);

    if (mode === 0) {
        return [{ text: textPart + ' ' + imgBubble, isPat: false, quote: quoteObj }];
    } else if (mode === 1) {
        return [{ text: imgBubble + ' ' + textPart, isPat: false, quote: quoteObj }];
    } else if (mode === 2) {
        return [
            { text: textPart, isPat: false, quote: quoteObj },
            { text: imgBubble, isPat: false, isImage: true, imageData: imgData }
        ];
    } else {
        return [
            { text: imgBubble, isPat: false, isImage: true, imageData: imgData, quote: quoteObj },
            { text: textPart, isPat: false }
        ];
    }
}

function getFriendReplyDelayMs(type) {
    var settings = DataHub.get('settings', {});
    var minTime, maxTime;
    if (type === 'chain') {
        minTime = parseInt(settings.chainReplyTimeMin);
        maxTime = parseInt(settings.chainReplyTimeMax);
        if (isNaN(minTime) || minTime < 0) minTime = 5;
        if (isNaN(maxTime) || maxTime < minTime) maxTime = 90;
    } else {
        minTime = parseInt(settings.replyTimeMin);
        maxTime = parseInt(settings.replyTimeMax);
        if (isNaN(minTime) || minTime < 0) minTime = 0;
        if (isNaN(maxTime) || maxTime < minTime) maxTime = 120;
    }
    var seconds = Math.floor(Math.random() * (maxTime - minTime + 1)) + minTime;
    return seconds * 1000;
}

function sendImageMessage(file) {
    if (!currentChatId) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        const imageData = e.target.result;
        const now = new Date();
        const time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

        var msgText = '<img src="' + imageData + '" style="max-width:200px;max-height:200px;border-radius:8px;display:block;">';
        var msgData = DataHub.get('messages', []);
        msgData.push({
            id: 'm' + genId(),
            chatId: currentChatId,
            from: 'me',
            text: msgText,
            time: time,
            unread: 0,
            isImage: true,
            imageData: imageData
        });
        DataHub.set('messages', msgData);

        if (Math.random() * 100 <= 1) {
            var allFriends = DataHub.get('friends', []);
            var targetFriend = allFriends.find(function(f) { return f.id === currentChatId; });
            if (targetFriend) {
                if (!targetFriend.privateAlbum) targetFriend.privateAlbum = [];
                targetFriend.privateAlbum.push({
                    imageData: imageData,
                    time: time,
                    from: 'me'
                });
                DataHub.set('friends', allFriends);
                setTimeout(function() {
                    showToast(targetFriend.name + ' 收藏了这张图片');
                }, 500);
            }
        }

        if (Math.random() * 10000 <= 1) {
            setTimeout(function() {
                var myFriends = DataHub.get('friends', []);
                var me = myFriends.find(function(f) { return f.id === currentChatId; });
                if (me && me.privateAlbum && me.privateAlbum.length > 0) {
                    var randomIndex = Math.floor(Math.random() * me.privateAlbum.length);
                    var randomImage = me.privateAlbum[randomIndex];
                    if (randomImage && randomImage.imageData) {
                        var now2 = new Date();
                        var time2 = now2.getFullYear() + '.' + String(now2.getMonth()+1).padStart(2,'0') + '.' + String(now2.getDate()).padStart(2,'0') + ' ' + String(now2.getHours()).padStart(2,'0') + ':' + String(now2.getMinutes()).padStart(2,'0') + ':' + String(now2.getSeconds()).padStart(2,'0');
                        var msgs = DataHub.get('messages', []);
                        msgs.push({
                            id: 'm' + genId(),
                            chatId: currentChatId,
                            from: currentChatId,
                            text: '<img src="' + randomImage.imageData + '" style="max-width:200px;max-height:200px;border-radius:8px;display:block;">',
                            time: time2,
                            unread: 1,
                            isImage: true,
                            imageData: randomImage.imageData
                        });
                        DataHub.set('messages', msgs);
                        renderChatMessages();
                        renderMessages();
                        showToast('对方从私人相册发来一张图片');
                    }
                }
            }, 1000);
        }

        tryFriendCollectImage(currentChatId, imageData, time);

        renderChatMessages();
        renderMessages();
        showToast('图片已发送');
    };
    reader.readAsDataURL(file);
}

// ====== 好友收藏图片判定 ======
function tryFriendCollectImage(chatId, imageData, time) {
    var friends = DataHub.get('friends', []);
    var chat = getChat(chatId);

    var targetFriends = [];

    if (chat && chat.members) {
        chat.members.forEach(function(memberId) {
            var f = friends.find(function(x) { return x.id === memberId; });
            if (f) targetFriends.push(f);
        });
    } else {
        var f = friends.find(function(x) { return x.id === chatId; });
        if (f) targetFriends.push(f);
    }

    if (targetFriends.length === 0) return;

    var settings = DataHub.get('settings', {});
    var collectProb = (settings.albumCollectProbability !== undefined) ? settings.albumCollectProbability : 1;

    targetFriends.forEach(function(friend) {
        if (Math.random() * 100 > collectProb) return;

        if (!friend.privateAlbum) friend.privateAlbum = [];

        var albumItem = {
            id: 'pa' + genId(),
            imageData: imageData,
            time: time,
            from: 'me',
            status: 'normal',
            messages: [],
            deleteRequest: null,
            unread: false
        };

        var hasMessage = Math.random() * 100 <= 50;
        if (hasMessage) {
            var msg = generateAlbumFriendMessage(friend);
            if (msg) {
                albumItem.messages.push({
                    id: 'am' + genId(),
                    from: 'friend',
                    text: msg,
                    time: time,
                    unread: true
                });
                albumItem.unread = true;
            }
        }

        friend.privateAlbum.push(albumItem);
    });

    DataHub.set('friends', friends);
}

// ====== 生成好友相册留言 ======
function generateAlbumFriendMessage(friend) {
    var allItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                allItems.push(item.content);
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                allItems.push(item.content);
            }
        });
    }
    if (allItems.length === 0) {
        var dictData = getDictionaryData();
        if (dictData && dictData.items && dictData.items.length > 0) {
            var sentence = generateDictionarySentence();
            if (sentence) return sentence;
        }
        return '';
    }
    var count = Math.floor(Math.random() * 2) + 1;
    var selected = [];
    for (var i = 0; i < count; i++) {
        selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
    }
    return selected.join(' ');
}

function formatCallDuration(seconds) {
    var h = Math.floor(seconds / 3600);
    var m = Math.floor((seconds % 3600) / 60);
    var s = seconds % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function getVideoCallChatName(chatId) {
    var chat = getChat(chatId);
    return chat ? (chat.name || '好友') : '好友';
}

function getVideoCallChatAvatar(chatId) {
    var chat = getChat(chatId);
    if (!chat) return '';
    return chat.avatar || '';
}

function buildVideoCallRecordText(chatId, type) {
    var name = getVideoCallChatName(chatId);
    if (type === 'connected') {
        return '和 ' + name + ' 通话时长 ' + formatCallDuration(videoCallState.currentDuration || 0);
    } else if (type === 'friendRejected') {
        return name + ' 已拒绝你的视频通话';
    } else if (type === 'friendNoAnswer') {
        return name + ' 无应答';
    } else if (type === 'meCancelled') {
        return '已和 ' + name + ' 的视频通话';
    } else if (type === 'meRejected') {
        return '已拒绝 ' + name + ' 的视频通话';
    } else if (type === 'meNoAnswer') {
        return '未接听 ' + name + ' 的视频通话';
    } else if (type === 'interrupted') {
        return '和 ' + name + ' 通话意外中断 ' + formatCallDuration(videoCallState.currentDuration || 0);
    }
    return '视频通话';
}

function bindVideoCallRectDrag() {
    var el = document.getElementById('videoCallRect');
    if (!el) return;
    var startX = 0, startY = 0, startLeft = 0, startTop = 0, moved = false;

    function onStart(e) {
        var p = e.touches ? e.touches[0] : e;
        startX = p.clientX;
        startY = p.clientY;
        startLeft = el.offsetLeft;
        startTop = el.offsetTop;
        moved = false;
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
    }
    function onMove(e) {
        var p = e.touches ? e.touches[0] : e;
        var dx = p.clientX - startX;
        var dy = p.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        var newLeft = startLeft + dx;
        var newTop = startTop + dy;
        var maxLeft = window.innerWidth - el.offsetWidth;
        var maxTop = window.innerHeight - el.offsetHeight;
        newLeft = Math.max(0, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));
        el.style.left = newLeft + 'px';
        el.style.top = newTop + 'px';
        if (e.cancelable) e.preventDefault();
    }
    function onEnd() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        if (!moved) {
            expandVideoCallRect();
            return;
        }
        videoCallState.rectX = el.offsetLeft;
        videoCallState.rectY = el.offsetTop;
    }
    el.addEventListener('mousedown', onStart);
    el.addEventListener('touchstart', onStart, { passive: true });
}

function startVideoCallTimers() {
    stopVideoCallTimers();
    var s = videoCallState;

    if (s.status === 'incoming') {
        s.ringTimeout = setTimeout(function() {
            if (videoCallState.active && videoCallState.status === 'incoming') {
                endVideoCall('meNoAnswer');
            }
        }, 60000);
    }

    if (s.status === 'calling') {
    var roll = Math.random();
    var delay = Math.floor(Math.random() * 2000) + 1000;
    if (roll < 0.33) {
        s.friendResponseTimeout = setTimeout(function() {
            if (videoCallState.active && videoCallState.status === 'calling') {
                insertVideoCallMessage(videoCallState.chatId, videoCallState.friendName + ' 已接听', 1);
                connectVideoCall();
            }
        }, delay);
    } else if (roll < 0.66) {
        s.friendResponseTimeout = setTimeout(function() {
            if (videoCallState.active && videoCallState.status === 'calling') {
                endVideoCall('friendRejected');
            }
        }, delay);
    } else {
        s.friendResponseTimeout = setTimeout(function() {
            if (videoCallState.active && videoCallState.status === 'calling') {
                endVideoCall('friendNoAnswer');
            }
        }, 15000);
    }
}
}

function stopVideoCallTimers() {
    var s = videoCallState;
    if (s.ringTimeout) { clearTimeout(s.ringTimeout); s.ringTimeout = null; }
    if (s.friendResponseTimeout) { clearTimeout(s.friendResponseTimeout); s.friendResponseTimeout = null; }
    if (s.timerInterval) { clearInterval(s.timerInterval); s.timerInterval = null; }
    if (s.halfHourInterval) { clearInterval(s.halfHourInterval); s.halfHourInterval = null; }
}

function connectVideoCall() {
    var s = videoCallState;
    if (!s.active) return;
    s.status = 'connected';
    s.startTime = Date.now();
    s.currentDuration = 0;
    renderVideoCallPage();
    s.timerInterval = setInterval(function() {
    if (videoCallState.active && videoCallState.status === 'connected') {
        videoCallState.currentDuration = Math.floor((Date.now() - videoCallState.startTime) / 1000);
        var fullEl = document.querySelector('#videoCallFull div:nth-child(4)');
        if (fullEl) fullEl.textContent = formatCallDuration(videoCallState.currentDuration);
        var rectEl = document.getElementById('videoCallRect');
        if (rectEl) {
            var rectTime = rectEl.querySelector('.rect-time');
            if (rectTime) rectTime.textContent = formatCallDuration(videoCallState.currentDuration);
        }
    }
}, 1000);
    s.halfHourInterval = setInterval(function() {
    if (videoCallState.active && videoCallState.status === 'connected') {
        if (Math.random() < 0.5) {
            friendHangupVideoCall();
        }
    }
}, 1800000);
}

function acceptVideoCall() {
    var s = videoCallState;
    if (!s.active || s.status !== 'incoming') return;
    if (s.ringTimeout) { clearTimeout(s.ringTimeout); s.ringTimeout = null; }
    s.role = 'receiver';
    s.status = 'waiting_friend';
    insertVideoCallMessage(s.chatId, '已接听 ' + s.friendName + ' 的视频通话', 0);
    renderVideoCallPage();

    var roll = Math.random();
    var delay = Math.floor(Math.random() * 3000) + 1000;
    s.friendResponseTimeout = setTimeout(function() {
        if (!videoCallState.active || videoCallState.status !== 'waiting_friend') return;
if (roll < 0.33) {
            insertVideoCallMessage(s.chatId, videoCallState.friendName + ' 已接听', 1);
            connectVideoCall();
        } else if (roll < 0.66) {
            endVideoCall('friendRejected');
        } else {
            endVideoCall('friendNoAnswer');
        }
    }, delay);
}

function rejectVideoCall() {
    if (!videoCallState.active) return;
    endVideoCall('meRejected');
}

function cancelVideoCall() {
    if (!videoCallState.active) return;
    endVideoCall('meCancelled');
}

function hangupVideoCall() {
    if (!videoCallState.active) return;
    endVideoCall('connected');
}

function endVideoCall(reason) {
    var s = videoCallState;
    if (!s.active) return;
    stopVideoCallTimers();
    var duration = s.currentDuration || 0;
    var chatId = s.chatId;
    var name = s.friendName || getVideoCallChatName(chatId);
    var text = '';
    var unread = 0;

if (reason === 'connected') {
    text = '和 ' + name + ' 通话时长 ' + formatCallDuration(duration);
    unread = 0;
} else if (reason === 'friendRejected') {
    text = name + ' 已拒绝';
    unread = 1;
} else if (reason === 'friendNoAnswer') {
    text = name + ' 无应答';
    unread = 1;
} else if (reason === 'friendHangup') {
    text = name + '突然有事，已挂断视频 ' + formatCallDuration(duration);
    unread = 1;
} else if (reason === 'meCancelled') {
    text = '已取消和 ' + name + ' 的视频通话';
    unread = 0;
} else if (reason === 'meRejected') {
    text = '已拒绝 ' + name + ' 的视频通话';
    unread = 0;
} else if (reason === 'meNoAnswer') {
    text = '未接听 ' + name + ' 的视频通话';
    unread = 0;
} else if (reason === 'interrupted') {
    text = '和 ' + name + ' 通话意外中断 ' + formatCallDuration(duration);
    unread = 0;
}

    insertVideoCallMessage(chatId, text, unread);

    s.active = false;
    s.chatId = null;
    s.status = 'idle';
    s.minimized = false;
    s.currentDuration = 0;

    var container = document.getElementById('videoCallContainer');
    if (container) container.innerHTML = '';
}

function startVideoCallToCurrentChat() {
    if (!currentChatId) {
        showToast('请先进入聊天');
        return;
    }
    var chat = getChat(currentChatId);
    if (!chat) {
        showToast('该会话不存在');
        return;
    }
    var friends = DataHub.get('friends', []);
    var isFriend = friends.some(function(f) { return f.id === currentChatId; });
    if (!isFriend) {
        showToast('群聊暂不支持视频通话');
        return;
    }
    startVideoCallToFriend(currentChatId);
}

    var name = getVideoCallChatName(chatId);

function triggerIncomingVideoCall(chatId) {

function checkVideoCallInterrupt() {

    var duration = videoCallState.currentDuration || 0;
    var chatId = videoCallState.chatId;
    var name = videoCallState.friendName || getVideoCallChatName(chatId);

function getEmojiPanelData() {
    if (emojiPanelState.lib === 'my') {
        var d = DataHub.get('myLexicon', null);
        if (!d) {
            d = { groups: { emoji_pack: ['默认'], pat: ['默认'], yanwenzi: ['默认'], emoji: ['默认'] }, items: [] };
            DataHub.set('myLexicon', d);
        }
        if (!d.groups) d.groups = { emoji_pack: ['默认'], pat: ['默认'], yanwenzi: ['默认'], emoji: ['默认'] };
        return d;
    } else if (emojiPanelState.lib === 'public') {
        return getLexiconData();
    } else {
        var allFriends = DataHub.get('friends', []);
        var friend = allFriends.find(function(f) { return f.id === currentChatId; });
        if (!friend) return { groups: { emoji_pack: ['默认'], pat: ['默认'], yanwenzi: ['默认'], emoji: ['默认'] }, items: [] };
        if (!friend.privateLexicon) {
            friend.privateLexicon = { groups: { emoji_pack: ['默认'], pat: ['默认'], yanwenzi: ['默认'], emoji: ['默认'] }, items: [] };
            DataHub.set('friends', allFriends);
        }
        if (!friend.privateLexicon.groups) friend.privateLexicon.groups = { emoji_pack: ['默认'], pat: ['默认'], yanwenzi: ['默认'], emoji: ['默认'] };
        return friend.privateLexicon;
    }
}

function saveEmojiPanelData(data) {
    if (emojiPanelState.lib === 'my') {
        DataHub.set('myLexicon', data);
    } else if (emojiPanelState.lib === 'public') {
        saveLexiconData(data);
    } else {
        var allFriends = DataHub.get('friends', []);
        var friend = allFriends.find(function(f) { return f.id === currentChatId; });
        if (!friend) return;
        friend.privateLexicon = data;
        DataHub.set('friends', allFriends);
    }
}

function renderEmojiPanelContent() {
    var container = document.getElementById('emojiContent');
    if (!container) return;
    var data = getEmojiPanelData();
    var type = emojiPanelState.type;
    var keyword = emojiPanelState.searchKeyword.trim().toLowerCase();
    var items = data.items.filter(function(item) { return item.type === type; });
    if (emojiPanelState.lib === 'my' && keyword) {
        items = items.filter(function(item) {
            return (item.content && item.content.toLowerCase().includes(keyword));
        });
    }
    items.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    var html = '';

    if (emojiPanelState.lib === 'my') {
    if (type === 'emoji_pack') {
    html += '<div class="emoji-add-row" style="justify-content:center;"><button onclick="uploadMyEmojiPack()" style="padding:4px 14px;background:#ffffff;border:1px solid #d4e4d6;border-radius:20px;font-size:10px;color:#888888;cursor:pointer;">相册上传图片</button></div>';
} else {
        html += '<div class="emoji-add-row">' +
            '<input type="text" id="emojiSearchInput" placeholder="搜索..." value="' + emojiPanelState.searchKeyword + '" oninput="searchEmojiPanel(this.value)">' +
            '<button onclick="showMyEmojiAddMenu()">添加</button>' +
        '</div>';
    }
}

    if (emojiPanelState.selectMode) {
        html += '<div style="display:flex;gap:8px;align-items:center;padding:4px 0 8px;font-size:13px;">' +
            '<button class="btn-icon" onclick="exitEmojiPanelSelect()" style="padding:5px 12px;">取消</button>' +
            '<button class="btn-icon" id="emojiSelectAllBtn" onclick="toggleEmojiPanelSelectAll()" style="padding:5px 12px;">全选</button>' +
            '<span style="flex:1;color:#888888;">已选 ' + emojiPanelState.selectedIds.size + ' 项</span>' +
            '<button class="btn-primary" onclick="deleteEmojiPanelSelected()" style="padding:5px 14px;background:#e8a0a0;color:#ffffff;">删除</button>' +
        '</div>';
    }

    if (items.length === 0) {
        html += '<div style="text-align:center;color:#999999;padding:20px 0;font-size:13px;">暂无词条</div>';
    } else if (type === 'emoji_pack') {
        items.forEach(function(item) {
            var img = (item.images && item.images[0]) ? item.images[0] : '';
            var check = emojiPanelState.selectMode ? '<input type="checkbox" class="emoji-check" data-id="' + item.id + '" ' + (emojiPanelState.selectedIds.has(item.id) ? 'checked' : '') + '>' : '';
            html += '<div class="emoji-item' + (emojiPanelState.selectMode ? ' selecting' : '') + '" data-id="' + item.id + '">' +
                (check ? '<div>' + check + '</div>' : '') +
                (img ? '<img src="' + img + '">' : '') +
            '</div>';
        });
    } else {
        items.forEach(function(item) {
            var check = emojiPanelState.selectMode ? '<input type="checkbox" class="emoji-check" data-id="' + item.id + '" ' + (emojiPanelState.selectedIds.has(item.id) ? 'checked' : '') + '>' : '';
            html += '<div class="emoji-item' + (emojiPanelState.selectMode ? ' selecting' : '') + '" data-id="' + item.id + '" style="display:flex;align-items:center;width:100%;flex-direction:row;">' +
                check +
                '<span class="emoji-text" style="flex:1;">' + (item.content || '') + '</span>' +
            '</div>';
        });
    }

    container.innerHTML = html;
    bindEmojiPanelItems();
}

function bindEmojiPanelItems() {
    var container = document.getElementById('emojiContent');
    if (!container) return;
    container.querySelectorAll('.emoji-item').forEach(function(el) {
        var id = el.dataset.id;
        var data = getEmojiPanelData();
        var item = data.items.find(function(it) { return it.id === id; });
        if (!item) return;
        if (emojiPanelState.selectMode) {
            var cb = el.querySelector('.emoji-check');
            if (cb) {
                cb.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (this.checked) emojiPanelState.selectedIds.add(id);
                    else emojiPanelState.selectedIds.delete(id);
                    renderEmojiPanelContent();
                });
            }
            el.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    var c = this.querySelector('.emoji-check');
                    if (c) { c.checked = !c.checked; c.dispatchEvent(new Event('change')); }
                }
            });
        } else {
            var pressTimer = null;
            function startPress() {
                pressTimer = setTimeout(function() { enterEmojiPanelSelect(); }, 600);
            }
            function cancelPress() { clearTimeout(pressTimer); }
            el.addEventListener('touchstart', startPress);
            el.addEventListener('touchend', cancelPress);
            el.addEventListener('touchmove', cancelPress);
            el.addEventListener('mousedown', startPress);
            el.addEventListener('mouseup', cancelPress);
            el.addEventListener('mouseleave', cancelPress);
            el.addEventListener('click', function(e) {
                if (emojiPanelState.selectMode) return;
                if (e.target.tagName === 'INPUT') return;
                handleEmojiItemClick(item);
            });
        }
    });
}

function handleEmojiItemClick(item) {
    if (!currentChatId) return;
    var input = document.getElementById('chatInput');
    var text = input ? input.value : '';
    var content = '';
    if (item.type === 'emoji_pack') {
    var img = (item.images && item.images[0]) ? item.images[0] : '';
    if (!img) return;
    content = '<img src="' + img + '" style="max-width:64px;max-height:64px;border-radius:8px;display:inline-block;">';
} else {
        content = item.content || '';
    }
    if (!content) return;

        if (text.trim()) {
            showToast('拍一拍只能单独发送');

        sendPatFromPanel(item);
        return;
    }

    if (text.trim()) {
        var input2 = document.getElementById('chatInput');
        if (input2) input2.value = '';
        sendEmojiContentToChat(item, text.trim());
    } else {
        sendEmojiContentToChat(item, '');

}

function sendPatFromPanel(item) {
    var msgs = DataHub.get('messages', []);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    var settings = DataHub.get('settings', {});
    var identifier = settings.globalPatIdentifier || '❤️';
    var raw = identifier + ' ' + (item.content || '') + ' ' + identifier;
    var displayText = '';
    for (var i = 0; i < raw.length; i += 16) {
        if (i > 0) displayText += '\n';
        displayText += raw.substring(i, i + 16);
    }
    msgs.push({
        id: 'm' + genId(),
        chatId: currentChatId,
        from: 'me',
        text: displayText,
        time: time,
        timestamp: Date.now(),
        unread: 0,
        isPat: true
    });
    DataHub.set('messages', msgs);
    renderChatMessages();
    renderMessages();
    showToast('已发送');

    resetReplyProbability(currentChatId);
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === currentChatId; });
    if (friend) {
        if (!friend.replyState) friend.replyState = {};
        friend.replyState.chainProbability = 100;
        DataHub.set('friends', allFriends);
    }
    var allFriends2 = DataHub.get('friends', []);
    var friend2 = allFriends2.find(function(f) { return f.id === currentChatId; });
    if (friend2) {
        handleFriendReply(currentChatId, msgs[msgs.length - 1]);
    } else {
        var allRooms = DataHub.get('chatrooms', []);
        var room = allRooms.find(function(r) { return r.id === currentChatId; });
        if (room) {
            handleChatroomReply(currentChatId, msgs[msgs.length - 1]);
        }
    }
}

function sendEmojiContentToChat(item, extraText) {
    var msgs = DataHub.get('messages', []);

    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (item.type === 'emoji_pack') {

    content = '<img src="' + img + '" style="max-width:64px;max-height:64px;border-radius:8px;display:inline-block;">';
    if (extraText) content = extraText + ' ' + content;
} else {
        content = item.content || '';
        if (extraText) content = extraText + ' ' + content;
    }
    var msg = {
        id: 'm' + genId(),
        chatId: currentChatId,
        from: 'me',
        text: content,
        time: time,
        timestamp: Date.now(),

    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === currentChatId; });
    if (friend) {
        if (!friend.replyState) friend.replyState = {};
        friend.replyState.chainProbability = 100;
        DataHub.set('friends', allFriends);
    }
    var allFriends2 = DataHub.get('friends', []);
    var friend2 = allFriends2.find(function(f) { return f.id === currentChatId; });
    if (friend2) {
        handleFriendReply(currentChatId, msgs[msgs.length - 1]);
    } else {
        var allRooms = DataHub.get('chatrooms', []);
        var room = allRooms.find(function(r) { return r.id === currentChatId; });
        if (room) {
            handleChatroomReply(currentChatId, msgs[msgs.length - 1]);
        }
    }
}

}
function onTouchEnd(e) {

}

row.addEventListener('mousemove', onMove);

function showMessageBubbleMenu(row, msgId, fromMe, x, y) {
    hideMessageBubbleMenu();

    var menu = document.createElement('div');

function getSpecialQuoteOriginalText() {
    var msgs = DataHub.get('messages', []);

        if (m.chatId !== currentChatId) continue;

var quoteState = {

};

function startQuoteMessage(msgId) {
    var msgs = DataHub.get('messages', []);
    var msg = msgs.find(function(m) { return m.id === msgId; });
    if (!msg) return;
    if (msg.isRecall) {
        showToast('该消息已撤回，无法引用');

    }
    quoteState.msgId = msgId;
    renderQuoteBar();
    var input = document.getElementById('chatInput');
    if (input) input.focus();
}

function buildQuoteFromMsg(msg) {
    if (!msg) return null;
    if (msg.isRecall) {
        return { msgId: msg.id, failed: true, text: '', isImage: false, imageData: '' };
    }
    if (msg.isImage && msg.imageData) {
        return { msgId: msg.id, failed: false, text: '', isImage: true, imageData: msg.imageData };
    }
    if (msg.text && msg.text.indexOf('<img') !== -1) {
        var match = msg.text.match(/src="([^"]+)"/);
        if (match) {
            return { msgId: msg.id, failed: false, text: '', isImage: true, imageData: match[1] };
        }
    }
    return { msgId: msg.id, failed: false, text: msg.text || '', isImage: false, imageData: '' };
}

function renderQuoteBar() {
    var oldBar = document.getElementById('quoteBar');
    if (oldBar) oldBar.remove();
    if (!quoteState.msgId) return;
    var inputArea = document.querySelector('.chat-input-area');
    if (!inputArea) return;
    var msgs = DataHub.get('messages', []);
    var msg = msgs.find(function(m) { return m.id === quoteState.msgId; });
    var preview = '';
    if (!msg) {
        preview = '引用的消息已撤回';
    } else if (msg.isRecall) {
        preview = '引用的消息已撤回';
    } else if (msg.isImage && msg.imageData) {
        preview = '<img src="' + msg.imageData + '" style="max-width:32px;max-height:32px;border-radius:4px;vertical-align:middle;">';
    } else if (msg.text && msg.text.indexOf('<img') !== -1) {
        var match = msg.text.match(/src="([^"]+)"/);
        var imgSrc = match ? match[1] : '';
        preview = imgSrc ? '<img src="' + imgSrc + '" style="max-width:32px;max-height:32px;border-radius:4px;vertical-align:middle;">' : '[图片]';
    } else {
        var t = msg.text || '';
        if (t.length > 30) t = t.substring(0, 30) + '...';
        preview = t;
    }
    var bar = document.createElement('div');
    bar.id = 'quoteBar';
    bar.style.cssText = 'display:flex;align-items:center;gap:8px;padding:6px 10px;margin:0 0 4px 0;background:var(--theme-lighter, #f0f5f0);border-radius:8px;border-left:3px solid var(--theme-dark, #8aaa8e);width:100%;box-sizing:border-box;';
    bar.innerHTML = '<div style="flex:1;min-width:0;font-size:12px;color:#888888;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + preview + '</div>' +
        '<div style="flex-shrink:0;cursor:pointer;color:#999999;font-size:16px;line-height:1;padding:0 4px;" onclick="cancelQuote()">×</div>';
    inputArea.insertBefore(bar, inputArea.firstChild);
}

// ====== 撤回功能 ======
function recallMyMessage(msgId) {
    var msgs = DataHub.get('messages', []);
    var idx = -1;
    for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].id === msgId) { idx = i; break; }
    }
    if (idx < 0) return;
    var msg = msgs[idx];
    if (msg.from !== 'me') return;
    if (msg.isRecall) return;
    if (!msg.timestamp || Date.now() - msg.timestamp > 120000) {
        showToast('超过120秒，无法撤回');
        return;
    }

    var settings = DataHub.get('settings', {});
    var myText = '';

    var allFriends = DataHub.get('friends', []);
    var chatFriend = allFriends.find(function(f) { return f.id === msg.chatId; });
    if (chatFriend && chatFriend.chatSettings && chatFriend.chatSettings.myRecallText !== undefined && chatFriend.chatSettings.myRecallText !== '') {
        myText = chatFriend.chatSettings.myRecallText;
    } else if (settings.globalMyRecallText !== undefined && settings.globalMyRecallText !== '') {
        myText = settings.globalMyRecallText;
    } else {
        myText = '我 撤回了一条消息';
    }

    msg.isRecall = true;
    msg.text = myText;
    msg.isImage = false;
    msg.imageData = '';
    msg.isVote = false;
    msg.voteId = null;
    msg.isPat = false;

    markQuotesFailed(msgs, msgId);

    DataHub.set('messages', msgs);
    if (currentChatId === msg.chatId) {
        renderChatMessages();
    }
    renderMessages();
    showToast('已撤回');
}

function markQuotesFailed(msgs, recalledMsgId) {
    for (var i = 0; i < msgs.length; i++) {
        if (msgs[i].quote && msgs[i].quote.msgId === recalledMsgId) {
            msgs[i].quote.failed = true;
            msgs[i].quote.text = '';
            msgs[i].quote.isImage = false;
            msgs[i].quote.imageData = '';
        }
    }
}

function maybeFriendRecall(chatId, msgId) {
    var latestMsgsForRecall = DataHub.get('messages', []);
    var recallMsg = latestMsgsForRecall.find(function(x) { return x.id === msgId; });
    if (!recallMsg) return;

    var senderId = recallMsg.from;
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === senderId; });
    var settings = DataHub.get('settings', {});

    var recallProb = 1;
    var friendText = '对方撤回了一条消息';

    if (friend && friend.chatSettings && friend.chatSettings.recallProbability !== undefined) {
        recallProb = friend.chatSettings.recallProbability;
    } else if (settings.globalRecallProbability !== undefined) {
        recallProb = settings.globalRecallProbability;
    }

    if (friend && friend.chatSettings && friend.chatSettings.friendRecallText !== undefined && friend.chatSettings.friendRecallText !== '') {
        friendText = friend.chatSettings.friendRecallText;
    } else if (settings.globalFriendRecallText !== undefined && settings.globalFriendRecallText !== '') {
        friendText = settings.globalFriendRecallText;
    }

    if (Math.random() * 100 > recallProb) return;

    var delay = 2000 + Math.floor(Math.random() * 8000);
    setTimeout(function() {
        var latestMsgs = DataHub.get('messages', []);
        var m = latestMsgs.find(function(x) { return x.id === msgId; });
        if (!m) return;
        if (m.isRecall) return;
        m.isRecall = true;
        m.text = friendText;
        m.isImage = false;
        m.imageData = '';
        m.isVote = false;
        m.voteId = null;
        m.isPat = false;
        markQuotesFailed(latestMsgs, msgId);
        DataHub.set('messages', latestMsgs);
        if (currentChatId === chatId) {
            renderChatMessages();
        }
        renderMessages();
    }, delay);
}

// ====== 按概率挑选引用目标 ======
function pickQuoteTarget(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    var settings = DataHub.get('settings', {});

    var quoteProb = 1;
    if (friend && friend.chatSettings && friend.chatSettings.quoteProbability !== undefined) {
        quoteProb = friend.chatSettings.quoteProbability;
    } else if (settings.globalQuoteProbability !== undefined) {
        quoteProb = settings.globalQuoteProbability;
    }

    if (Math.random() * 100 > quoteProb) return null;

    var specialProb = (settings.specialQuoteProbability !== undefined) ? settings.specialQuoteProbability : 1;
    if (Math.random() * 100 <= specialProb) {
        var specialQuote = buildSpecialQuoteTarget(chatId);
        if (specialQuote) return specialQuote;
        if (Math.random() < 0.5) {
            return null;
        }
    }

    var msgs = DataHub.get('messages', []).filter(function(m) {
        return m.chatId === chatId && !m.isRecall && !m.isPat && !m.isVote;
    });
    if (msgs.length === 0) return null;

    var myMsgs = msgs.filter(function(m) { return m.from === 'me'; });
    var pool = myMsgs.length > 0 ? myMsgs : msgs;

    var target = pool[Math.floor(Math.random() * pool.length)];
    if (!target) return null;

    return buildQuoteFromMsg(target);
}

// ====== 构造特殊引用目标 ======
function buildSpecialQuoteTarget(chatId) {
    var msgs = DataHub.get('messages', []).filter(function(m) {
        return m.chatId === chatId;
    });
    var target = null;
    for (var i = msgs.length - 1; i >= 0; i--) {
        var m = msgs[i];
        if (m.from !== 'me') continue;
        if (m.isRecall) continue;
        if (m.isVote) continue;
        if (m.isImage) continue;
        if (m.text && m.text.indexOf('<img') !== -1) continue;
        target = m;
        break;
    }
    if (!target) return null;
    var quote = buildQuoteFromMsg(target);
    if (!quote) return null;
    quote.isSpecialQuote = true;
    return quote;
}

// ====== 判断消息是否为特殊引用消息 ======
function isSpecialQuoteMessage(msg) {
    return !!(msg && msg.quote && msg.quote.isSpecialQuote);
}

function triggerPat(chatId) {
    var allFriends = DataHub.get('friends', []);
    const friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    const friendSettings = friend.chatSettings || {};
const globalSettingsForProb = DataHub.get('settings', {});
const prob = (globalSettingsForProb.globalPatProbability !== undefined) ? globalSettingsForProb.globalPatProbability : (friendSettings.patProbability !== undefined ? friendSettings.patProbability : 2);
    if (Math.random() * 100 > prob) {
        showToast('好友没有回应');
        return;
    }
    const globalSettings = DataHub.get('settings', {});
    const identifier = (friendSettings.patIdentifier) ? friendSettings.patIdentifier : (globalSettings.globalPatOtherIdentifier || '💕');
    const allPatItems = [];
    const publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'pat') {
                allPatItems.push(item.content);
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'pat') {
                if (item.locked === true) return;
                allPatItems.push(item.content);
            }
        });
    }
    if (allPatItems.length === 0) {
        return;
    }
    const randomIndex = Math.floor(Math.random() * allPatItems.length);
    const patText = allPatItems[randomIndex];
    const raw = identifier + ' ' + patText + ' ' + identifier;
    let displayText = '';
    for (let i = 0; i < raw.length; i += 16) {
        if (i > 0) displayText += '\n';
        displayText += raw.substring(i, i + 16);
    }
    const now = new Date();
    const time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    var msgs = DataHub.get('messages', []);
    msgs.push({
        id: 'm' + genId(),
        chatId: chatId,
        from: friend.id,
        text: displayText,
        time: time,
        unread: (currentChatId === chatId) ? 0 : 1,
        isPat: true
    });
    DataHub.set('messages', msgs);
    renderAll();
    if (currentChatId === chatId) {
        renderChatMessages();
    }
    showToast('好友拍了拍你');
}

// ====== 好友相册是否有未读 ======
function hasAlbumUnread(chatId) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.privateAlbum) return false;
    for (var i = 0; i < friend.privateAlbum.length; i++) {
        var item = friend.privateAlbum[i];
        if (item.unread) return true;
        if (item.messages) {
            for (var j = 0; j < item.messages.length; j++) {
                if (item.messages[j].unread) return true;
            }
        }
    }
    return false;
}

function getFriendItemsByType(chatId, typeName) {
    var result = [];
    var allFriends = DataHub.get('friends', []);

    if (friend && friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === typeName && item.content) {
                result.push(item.content);
            }
        });
    }
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === typeName && item.content) {

}

function normalizeDateStr(str) {
    if (!str) return '';
    str = str.trim();
    var m = str.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})$/);
    if (!m) return '';
    var y = m[1];
    var mo = String(parseInt(m[2])).padStart(2, '0');
    var d = String(parseInt(m[3])).padStart(2, '0');
    return y + '-' + mo + '-' + d;
}

var COUPLE_STATUS_TEXTS = ['忙碌', '空闲', '无所事事', '发呆', '摸鱼', '学习中', '休息中', '玩手机', '吃饭中', '睡觉中'];

function getTodayDateKey() {
    var now = new Date();
    return now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
}

function ensureCoupleDayData(chatId, dateKey) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.couple) return;
    if (!friend.couple.statusCalendar) friend.couple.statusCalendar = {};
    var cal = friend.couple.statusCalendar;
    var isToday = (dateKey === getTodayDateKey());
    var changed = false;

    if (!cal[dateKey]) {
        cal[dateKey] = {
            timeDiff: generateTimeDiff(),
            status: generateStatus(),
            statusText: generateStatusText(),
            message: generateCoupleMessage(friend),
            myReply: '',
            myReplyLocked: false,
            statusUpdatedAt: Date.now()
        };
        changed = true;
    } else {
        var d = cal[dateKey];
        if (d.timeDiff === undefined || d.timeDiff === null) {
            d.timeDiff = generateTimeDiff();
            changed = true;
        }
        if (!d.message) {
            d.message = generateCoupleMessage(friend);
            changed = true;
        }
        if (d.statusText === undefined) {
            d.statusText = generateStatusText();
            changed = true;
        }
        if (d.status === undefined) {
            d.status = generateStatus();
            changed = true;
        }
        if (d.myReply === undefined) {
            d.myReply = '';
            changed = true;
        }
        if (d.myReplyLocked === undefined) {
            d.myReplyLocked = false;
            changed = true;
        }

        if (isToday) {
            var last = d.statusUpdatedAt || 0;
            if (Date.now() - last >= 30 * 60 * 1000) {
                d.status = generateStatus();
                d.statusText = generateStatusText();
                d.statusUpdatedAt = Date.now();
                changed = true;
            }
        } else {
            if (d.myReplyLocked !== true) {
                d.myReplyLocked = true;
                changed = true;
            }
        }
    }

    if (changed) {
        DataHub.set('friends', allFriends);
    }
}

function generateTimeDiff() {
    var val = (Math.random() * 24) - 12;
    return Math.round(val * 10) / 10;
}

function generateStatus() {
    return Math.random() < 0.5 ? 'online' : 'offline';
}

function generateStatusText() {
    return COUPLE_STATUS_TEXTS[Math.floor(Math.random() * COUPLE_STATUS_TEXTS.length)];
}

function generateCoupleMessage(friend) {
    if (!friend) return '';
    var allItems = [];

    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }

    if (allItems.length > 0) {
        var count = Math.floor(Math.random() * 3) + 1;
        var selected = [];
        for (var i = 0; i < count; i++) {
            selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
        }
        return selected.join(' ');
    }

    if (!isDictionaryEmpty()) {
        var sentence = generateDictionarySentence();
        if (sentence) return sentence;
    }

    return '嗯嗯';
}

function calcAge(birthday) {
    if (!birthday) return '';
    var parts = birthday.split('-');
    if (parts.length < 3) return '';
    var by = parseInt(parts[0]);
    var bm = parseInt(parts[1]);
    var bd = parseInt(parts[2]);
    if (!by || !bm || !bd) return '';
    var now = new Date();
    var age = now.getFullYear() - by;
    var m = now.getMonth() + 1;
    var d = now.getDate();
    if (m < bm || (m === bm && d < bd)) age--;
    if (age < 0) age = 0;
    return age;
}

function calcZodiac(birthday) {
    if (!birthday) return '';
    var parts = birthday.split('-');
    if (parts.length < 3) return '';
    var bm = parseInt(parts[1]);
    var bd = parseInt(parts[2]);
    if (!bm || !bd) return '';
    var signs = [
        { name: '摩羯座', end: [1, 19] },
        { name: '水瓶座', end: [2, 18] },
        { name: '双鱼座', end: [3, 20] },
        { name: '白羊座', end: [4, 19] },
        { name: '金牛座', end: [5, 20] },
        { name: '双子座', end: [6, 21] },
        { name: '巨蟹座', end: [7, 22] },
        { name: '狮子座', end: [8, 22] },
        { name: '处女座', end: [9, 22] },
        { name: '天秤座', end: [10, 23] },
        { name: '天蝎座', end: [11, 22] },
        { name: '射手座', end: [12, 21] },
        { name: '摩羯座', end: [12, 31] }
    ];
    for (var i = 0; i < signs.length; i++) {
        var s = signs[i];
        if (bm < s.end[0] || (bm === s.end[0] && bd <= s.end[1])) {
            return s.name;
        }
    }
    return '摩羯座';
}

function calcTogetherDays(startDate) {
    if (!startDate) return 0;
    var parts = startDate.split('-');
    if (parts.length < 3) return 0;
    var sy = parseInt(parts[0]);
    var sm = parseInt(parts[1]);
    var sd = parseInt(parts[2]);
    if (!sy || !sm || !sd) return 0;
    var start = new Date(sy, sm - 1, sd);
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var diff = Math.floor((today - start) / (24 * 3600 * 1000));
    if (diff < 0) diff = 0;
    return diff + 1;
}

function formatTimeDiff(val) {
    var now = new Date();
    var baseMinutes = now.getHours() * 60 + now.getMinutes();
    var diffMinutes = Math.round((val || 0) * 60);
    var targetMinutes = baseMinutes + diffMinutes;
    targetMinutes = ((targetMinutes % 1440) + 1440) % 1440;
    var hh = String(Math.floor(targetMinutes / 60)).padStart(2, '0');
    var mm = String(targetMinutes % 60).padStart(2, '0');
    var timeStr = hh + ':' + mm;

    var diffStr = '';
    if (Math.abs(val) < 0.05) {
        diffStr = '同步';
    } else {
        var absVal = Math.abs(val);
        var absStr = (absVal % 1 === 0) ? String(absVal) : absVal.toFixed(1);
        diffStr = (val > 0 ? '+' : '-') + absStr + 'h';
    }

    return timeStr + '（' + diffStr + '）';
}

function checkCoupleStatusCalendar() {
    var allFriends = DataHub.get('friends', []);
    var todayKey = getTodayDateKey();
    var changed = false;

    for (var i = 0; i < allFriends.length; i++) {
        var friend = allFriends[i];
        if (!friend.couple || friend.couple.enabled !== true) continue;
        if (!friend.couple.statusCalendar) friend.couple.statusCalendar = {};

        var cal = friend.couple.statusCalendar;
        var d = cal[todayKey];

        if (!d) {
            cal[todayKey] = {
                timeDiff: generateTimeDiff(),
                status: generateStatus(),
                statusText: generateStatusText(),
                message: generateCoupleMessage(friend),
                myReply: '',
                myReplyLocked: false,
                statusUpdatedAt: Date.now()
            };
            changed = true;
        } else {
            if (d.timeDiff === undefined || d.timeDiff === null) {
                d.timeDiff = generateTimeDiff();
                changed = true;
            }
            if (!d.message) {
                d.message = generateCoupleMessage(friend);
                changed = true;
            }
            if (d.statusText === undefined) {
                d.statusText = generateStatusText();
                changed = true;
            }
            if (d.status === undefined) {
                d.status = generateStatus();
                changed = true;
            }
            var last = d.statusUpdatedAt || 0;
            if (Date.now() - last >= 30 * 60 * 1000) {
                d.status = generateStatus();
                d.statusText = generateStatusText();
                d.statusUpdatedAt = Date.now();
                changed = true;
            }
        }

        var keys = Object.keys(cal);
        for (var k = 0; k < keys.length; k++) {
            var dk = keys[k];
            if (dk === todayKey) continue;
            if (cal[dk] && cal[dk].myReplyLocked !== true) {
                cal[dk].myReplyLocked = true;
                changed = true;
            }
        }
    }

    if (changed) {
        DataHub.set('friends', allFriends);
        var calContent = document.getElementById('coupleCalendarContent');
        if (calContent && coupleCalendarState.chatId) {
            calContent.innerHTML = renderCoupleCalendar(coupleCalendarState.chatId);
        }
    }
}
