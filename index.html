window.deleteGroup = function(groupName) {
    if (groupName === '未分组') {
        showToast('不能删除默认分组');
        return;
    }
    if (!confirm('确定删除分组「' + groupName + '」吗？该分组下的好友将自动归入「未分组」')) return;
    var groups = DataHub.get('groups', []);
    groups = groups.filter(g => g !== groupName);
    if (!groups.includes('未分组')) {
        groups.unshift('未分组');
    }
    DataHub.set('groups', groups);
    var friends = DataHub.get('friends', []);
    friends.forEach(f => {
        if (f.group === groupName) f.group = '未分组';
    });
    DataHub.set('friends', friends);
    if (window._expandedGroups) delete window._expandedGroups[groupName];
    renderContacts();
    showToast('已删除分组');
};

window.deleteFriend = function(id) {
    if (!confirm('确定删除该好友吗？相关聊天记录也将被删除')) return;
    var friends = DataHub.get('friends', []);
    friends = friends.filter(f => f.id !== id);
    DataHub.set('friends', friends);
    var messages = DataHub.get('messages', []);
    messages = messages.filter(m => m.chatId !== id);
    DataHub.set('messages', messages);
    var chatrooms = DataHub.get('chatrooms', []);
    chatrooms.forEach(c => {
        c.members = c.members.filter(mid => mid !== id);
    });
    DataHub.set('chatrooms', chatrooms);
    renderAll();
    showToast('已删除好友');
};

function renderMallManageProducts() {
    var container = document.getElementById('mallManageProductList');
    if (!container) return;
    var mall = getMallData();
    var current = window._mallManageCategory || '全部';

    // 只显示当前聊天好友可见的商品
    var products;
    if (currentChatId) {
        products = getVisibleProductsForFriend(currentChatId);
    } else {
        products = mall.products.slice();
    }
    if (current !== '全部') {
        products = products.filter(function(p) { return p.category === current; });
    }
    products = products.slice().sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    if (products.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#999999;padding:30px 0;font-size:13px;">暂无商品，点击右上角添加</div>';
        return;
    }

    var html = '';
    for (var i = 0; i < products.length; i++) {
        var p = products[i];
        var catLabel = p.category || '默认';
        if (p.exclusiveFriendId) {
            var friends = DataHub.get('friends', []);
            var f = friends.find(function(x) { return x.id === p.exclusiveFriendId; });
            if (f) catLabel += '（' + f.name + '专属）';
        }
        var buyBtn = '';
        var collectBtn = '';

function pickProductImageUpload() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        var files = e.target.files;
        if (!files || files.length === 0) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            compressImage(ev.target.result, 80, function(compressed) {
                window._productImageDraft = { image: compressed, imageType: 'upload' };
                var preview = document.getElementById('newProductImagePreview');
                if (preview) {
                    preview.innerHTML = '<img src="' + compressed + '" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">';
                }
            });
        };
        reader.readAsDataURL(files[0]);
    };
    input.click();
}

function getDictionaryData() {
    let data = DataHub.get('dictionary', null);
    if (!data) {
        data = { groups: { word: ['默认'] }, items: [] };
        DataHub.set('dictionary', data);
    }
    if (!data.groups) data.groups = { word: ['默认'] };
    if (!data.groups.word) data.groups.word = ['默认'];
    if (!data.items) data.items = [];

}

}

function initDictionaryPage() {
    document.getElementById('dictionarySearchInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            searchDictionary();
        }
    });
    renderDictionaryGroups();
    renderDictionaryList();

function renderDictionaryGroups() {
    const container = document.getElementById('dictionaryGroupTabs');
    if (!container) return;
    const data = ensureDictPosGroups(getDictionaryData());
    const groups = data.groups.word || ['默认'];
    let html = '';
    groups.forEach(g => {
        const isActive = (g === dictionaryState.currentGroup);
        const count = data.items.filter(item => item.group === g).length;
        html += '<button class="btn-icon dictionary-group-btn" data-group="' + g + '" style="flex-shrink:0;padding:6px 16px;border-radius:30px;border:none;font-size:13px;cursor:pointer;background:' + (isActive ? 'var(--theme-main, #d4e9d6)' : 'var(--theme-lighter, #eef5ef)') + ';color:' + (isActive ? '#000000' : '#888888') + ';">' + g + '（' + count + '）</button>';
    });
    container.innerHTML = html;
    container.querySelectorAll('.dictionary-group-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        container.querySelectorAll('.dictionary-group-btn').forEach(b => {
            b.style.background = 'var(--theme-lighter, #eef5ef)';
            b.style.color = '#888888';
        });
        this.style.background = 'var(--theme-main, #d4e9d6)';
        this.style.color = '#000000';
            dictionaryState.currentGroup = this.dataset.group;
            dictionaryState.selectMode = false;
            dictionaryState.selectedIds = new Set();
            renderDictionaryList();
        });
    });
}

function autoJudgeAllDictionaryPos() {
    const data = ensureDictPosGroups(getDictionaryData());
    let changed = 0;
    let moved = 0;
    data.items.forEach(function(item) {
        if (!item.pos) {
            const guessed = guessPos(item.content);
            if (guessed && guessed.length > 0) {
                item.pos = guessed;
                changed++;
            }
        }
        const posArr = getPosArray(item);
        const targetGroup = getPosGroupName(posArr[0] || '');
        if (item.group !== targetGroup) {
            item.group = targetGroup;
            moved++;
        }
    });
    if (changed === 0 && moved === 0) {
        showToast('没有需要处理的词');
        return;
    }
    saveDictionaryData(data);
    renderDictionaryList();
    renderDictionaryGroups();
    let msg = '已判断 ' + changed + ' 个词性';
    if (moved > 0) msg += '，移动 ' + moved + ' 个分组';
    showToast(msg);
}

window.autoJudgeAllDictionaryPos = autoJudgeAllDictionaryPos;

function renderDictionaryList() {
    const container = document.getElementById('dictionaryItemList');
    if (!container) return;
    const data = getDictionaryData();
    const group = dictionaryState.currentGroup;
    const keyword = dictionaryState.searchKeyword.trim().toLowerCase();
    let items = data.items.filter(item => item.group === group);
    if (keyword) {
        items = items.filter(item => item.content && item.content.toLowerCase().includes(keyword));
    }
    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalCount = items.length;

    document.querySelectorAll('.dictionary-group-btn').forEach(btn => {
        const groupName = btn.dataset.group;
        const count = data.items.filter(item => item.group === groupName).length;
        const currentText = btn.textContent.replace(/（\d+）$/, '').trim();
        btn.textContent = currentText + '（' + count + '）';
    });

    let html = '';
    html += '<div style="font-size:13px;color:#999999;padding:4px 0 10px 0;border-bottom:1px solid var(--theme-lighter, #eef5ef);margin-bottom:4px;">共 ' + totalCount + ' 条</div>';
    if (items.length === 0) {
        html += '<div style="text-align:center;color:#999999;padding:30px 0;">暂字词，点击「+ 添加」添加</div>';
        container.innerHTML = html;
        return;
    }
    const isSelectMode = dictionaryState.selectMode;
    const selectedIds = dictionaryState.selectedIds;
    items.forEach(item => {
        const isSelected = selectedIds.has(item.id);
        const selectCheckbox = isSelectMode ? '<input type="checkbox" class="dictionary-select-checkbox" data-id="' + item.id + '" ' + (isSelected ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:#4a7a4e;flex-shrink:0;margin-right:8px;">' : '';
        var posArr = getPosArray(item);
if (posArr.length === 0) posArr = guessPos(item.content);
var posTag = '';
posArr.forEach(function(p) {
    posTag += '<span style="font-size:11px;color:#999999;background:var(--theme-lighter, #eef5ef);border-radius:10px;padding:2px 8px;margin-left:4px;flex-shrink:0;">' + p + '</span>';
});
html += '<div class="dictionary-item" data-id="' + item.id + '" style="display:flex;align-items:center;padding:10px 14px;margin:2px 0;background:#ffffff;border-radius:10px;border-bottom:1px solid var(--theme-lighter, #eef5ef);cursor:' + (isSelectMode ? 'default' : 'pointer') + ';">' +

'</div>';
    });

    const id = el.dataset.id;
    if (isSelectMode) {
        const checkbox = el.querySelector('.dictionary-select-checkbox');

            checkbox.addEventListener('change', function(e) {
                e.stopPropagation();
                if (this.checked) {
                    dictionaryState.selectedIds.add(id);
                } else {
                    dictionaryState.selectedIds.delete(id);
                }
                updateDictionarySelectAllState();
                updateDictionarySelectCount();
                renderDictionaryList();
            });
        }
        el.addEventListener('click', function(e) {
            if (e.target.tagName !== 'INPUT') {
                const cb = this.querySelector('.dictionary-select-checkbox');
                if (cb) {
                    cb.checked = !cb.checked;
                    cb.dispatchEvent(new Event('change'));
                }
            }
        });
    } else {
    let pressTimer = null;
    let startX = 0, startY = 0;
    let triggered = false;

    function startPress(e) {
        const p = e.touches ? e.touches[0] : e;
        startX = p.clientX;
        startY = p.clientY;
        triggered = false;
        clearTimeout(pressTimer);
        pressTimer = setTimeout(function() {
            triggered = true;
            showDictionaryItemMenu(id);
        }, 600);
    }
    function movePress(e) {
        const p = e.touches ? e.touches[0] : e;
        if (Math.abs(p.clientX - startX) > 8 || Math.abs(p.clientY - startY) > 8) {
            clearTimeout(pressTimer);
        }
    }
    function endPress() {
        clearTimeout(pressTimer);
    }

    el.addEventListener('touchstart', startPress, { passive: true });
    el.addEventListener('touchmove', movePress, { passive: true });
    el.addEventListener('touchend', endPress);
    el.addEventListener('touchcancel', endPress);
    el.addEventListener('mousedown', startPress);
    el.addEventListener('mousemove', movePress);
    el.addEventListener('mouseup', endPress);
    el.addEventListener('mouseleave', endPress);
}
});
    updateDictionarySelectAllState();
    updateDictionarySelectCount();
}

function saveDictionaryItemEdit(id) {

    const content = contentEl.value.trim();

    document.querySelectorAll('.dictionary-edit-pos-check:checked').forEach(function(cb) {
        posArr.push(cb.value);
    });
    if (posArr.length === 0) {

    const item = data.items.find(it => it.id === id);
    if (!item) return;
    const newGroup = getPosGroupName(posArr[0] || '');
    const exists = data.items.some(it =>
        it.id !== id &&

    item.group = newGroup;

function saveDictionarySingle() {
    const input = document.getElementById('dictionarySingleInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const content = input.value.trim();
    let posArr = [];
    document.querySelectorAll('.dictionary-single-pos-check:checked').forEach(function(cb) {
        posArr.push(cb.value);
    });
    if (posArr.length === 0) {
        posArr = guessPos(content);
    }
    const data = ensureDictPosGroups(getDictionaryData());

    var existing = data.items.find(function(item) {
        return item.content === content;
    });

    if (existing) {
        var oldPosArr = getPosArray(existing);
        if (oldPosArr.length === 0) oldPosArr = guessPos(existing.content);
        var merged = oldPosArr.slice();
        var addedCount = 0;
        posArr.forEach(function(p) {
            if (merged.indexOf(p) === -1) {
                merged.push(p);
                addedCount++;
            }
        });
        if (addedCount === 0) {
            showToast('该字词已存在，词性无新增');
            return;
        }
        existing.pos = merged;
        saveDictionaryData(data);
        closeModal();
        var targetGroup = existing.group || '默认';
        dictionaryState.currentGroup = targetGroup;
        renderDictionaryList();
        renderDictionaryGroups();
        showToast('已合并 ' + addedCount + ' 个词性到「' + targetGroup + '」组的「' + content + '」');
        return;
    }

    const group = getPosGroupName(posArr[0] || '');
    data.items.push({
        id: 'dc' + Date.now() + Math.random().toString(36).substr(2, 4),
        type: 'word',
        group: group,
        content: content,
        pos: posArr,
        images: [],
        createdAt: Date.now()
    });
    saveDictionaryData(data);
    closeModal();
    dictionaryState.currentGroup = group;
    renderDictionaryList();
    renderDictionaryGroups();
    showToast('已添加到「' + group + '」组');
}

function saveDictionaryBatch() {
    const input = document.getElementById('dictionaryBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    let fixedPosArr = [];
    document.querySelectorAll('.dictionary-batch-pos-check:checked').forEach(function(cb) {
        fixedPosArr.push(cb.value);
    });
    if (fixedPosArr.length === 0) {
        showToast('请先选择词性');
        return;
    }
    const data = ensureDictPosGroups(getDictionaryData());
    let addedCount = 0;
    let mergedCount = 0;
    let mergedPosCount = 0;
    let lastMergedGroup = '';
    lines.forEach(line => {
        var existing = data.items.find(function(item) {
            return item.content === line;
        });
        if (existing) {
            var oldPosArr = getPosArray(existing);
            if (oldPosArr.length === 0) oldPosArr = guessPos(existing.content);
            var merged = oldPosArr.slice();
            var addPos = 0;
            fixedPosArr.forEach(function(p) {
                if (merged.indexOf(p) === -1) {
                    merged.push(p);
                    addPos++;
                }
            });
            if (addPos > 0) {
                existing.pos = merged;
                mergedCount++;
                mergedPosCount += addPos;
                lastMergedGroup = existing.group || '默认';
            }
            return;
        }
        const posArr = fixedPosArr.slice();
        const group = getPosGroupName(posArr[0] || '');
        data.items.push({
            id: 'dc' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: 'word',
            group: group,
            content: line,
            pos: posArr,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    saveDictionaryData(data);
    closeModal();
    renderDictionaryList();
    renderDictionaryGroups();
    let msg = '已添加 ' + addedCount + ' 条';
    if (mergedCount > 0) {
        msg += '，合并 ' + mergedCount + ' 条（共 ' + mergedPosCount + ' 个词性）';
        if (lastMergedGroup) msg += '，合并到「' + lastMergedGroup + '」组';
    }
    showToast(msg);
}

function renderLexiconList() {
    const container = document.getElementById('lexiconItemList');
    if (!container) return;
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const group = lexiconState.currentGroup;
    const keyword = lexiconState.searchKeyword.trim().toLowerCase();
    const allTypeItems = data.items.filter(item => item.type === type);
    let items = allTypeItems.filter(item => item.group === group);
    if (keyword) {
        items = items.filter(item => {
            const contentMatch = item.content && item.content.toLowerCase().includes(keyword);
            const groupMatch = item.group && item.group.toLowerCase().includes(keyword);
            return contentMatch || groupMatch;
        });
    }
    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalCount = items.length;
    document.querySelectorAll('.lexicon-type-btn').forEach(btn => {
        const btnType = btn.dataset.type;
        const count = data.items.filter(item => item.type === btnType).length;
        const countSpan = btn.querySelector('.type-count');
        if (countSpan) {
            countSpan.textContent = '（' + count + '）';
        }
    });
    document.querySelectorAll('.lexicon-group-btn').forEach(btn => {
        const groupName = btn.dataset.group;
        const count = data.items.filter(item => item.type === type && item.group === groupName).length;
        const currentText = btn.textContent.replace(/（\d+）$/, '').trim();
        btn.textContent = currentText + '（' + count + '）';
    });
    let html = '';
    html += '<div style="font-size:13px;color:#999999;padding:4px 0 10px 0;border-bottom:1px solid var(--theme-lighter, #eef5ef);margin-bottom:4px;">共 ' + totalCount + ' 条</div>';
    if (items.length === 0) {
        html += '<div style="text-align:center;color:#999999;padding:30px 0;">暂无词条，点击「+ 添加」添加</div>';
        container.innerHTML = html;
        return;
    }
    const isSelectMode = lexiconState.selectMode;
    const selectedIds = lexiconState.selectedIds;
    const isImageType = (type === 'emoji_pack');
    if (isImageType) {
        html += '<div style="display:flex;flex-wrap:wrap;margin:-4px;">';
    }
    items.forEach(item => {
        const isSelected = selectedIds.has(item.id);
        let contentDisplay = '';
        if (type !== 'emoji_pack') {
            contentDisplay = item.content || '';
        }
        let imageHtml = '';
        if (isImageType && item.images && item.images.length > 0) {
            let imagesHtml = '';
            item.images.forEach(img => {
                imagesHtml += '<img src="' + img + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid #eef5ef;flex-shrink:0;">';
            });
            imageHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">' + imagesHtml + '</div>';
        }
        const selectCheckbox = isSelectMode ? '<input type="checkbox" class="lexicon-select-checkbox" data-id="' + item.id + '" ' + (isSelected ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:#4a7a4e;flex-shrink:0;margin-right:8px;">' : '';
        if (isImageType) {
            html += '<div class="lexicon-item" data-id="' + item.id + '" style="display:inline-flex;flex-direction:column;align-items:center;padding:6px;margin:4px;background:#ffffff;border-radius:10px;border:1px solid #eef5ef;cursor:' + (isSelectMode ? 'default' : 'pointer') + ';width:calc(25% - 8px);box-sizing:border-box;vertical-align:top;">' +
    selectCheckbox +
    '<div style="width:100%;">' + imageHtml + '</div>' +
    (!isSelectMode ? '<span style="font-size:10px;color:#999999;margin-top:4px;text-align:center;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">' + (item.group || '默认') + '</span>' : '') +
'</div>';
        } else {
            html += '<div class="lexicon-item" data-id="' + item.id + '" style="display:flex;align-items:center;padding:10px 14px;margin:2px 0;background:#ffffff;border-radius:10px;border-bottom:1px solid var(--theme-lighter, #eef5ef);cursor:' + (isSelectMode ? 'default' : 'pointer') + ';">' +
                selectCheckbox +
                '<div style="flex:1;min-width:0;">' +
                    '<div style="font-size:14px;color:#000000;word-break:break-all;">' + contentDisplay + '</div>' +
                    imageHtml +
                '</div>' +
                (!isSelectMode ? '<span style="font-size:12px;color:#999999;flex-shrink:0;">' + (item.group || '默认') + '</span>' : '') +
            '</div>';
        }
    });
    if (isImageType) {
        html += '</div>';
    }
    container.innerHTML = html;
    container.querySelectorAll('.lexicon-item').forEach(el => {
        const id = el.dataset.id;
        if (isSelectMode) {
            const checkbox = el.querySelector('.lexicon-select-checkbox');
            if (checkbox) {
                checkbox.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (this.checked) {
                        lexiconState.selectedIds.add(id);
                    } else {
                        lexiconState.selectedIds.delete(id);
                    }
                    updateLexiconSelectAllState();
                    updateLexiconSelectCount();
                    renderLexiconList();
                });
            }
            el.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const cb = this.querySelector('.lexicon-select-checkbox');
                    if (cb) {
                        cb.checked = !cb.checked;
                        cb.dispatchEvent(new Event('change'));
                    }
                }
            });
        } else {
            let pressTimer = null;
            el.addEventListener('touchstart', function(e) {
                pressTimer = setTimeout(() => {
                    enterLexiconSelectMode();
                }, 600);
            });
            el.addEventListener('touchend', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('touchmove', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('mousedown', function(e) {
                pressTimer = setTimeout(() => {
                    enterLexiconSelectMode();
                }, 600);
            });
            el.addEventListener('mouseup', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('mouseleave', function() {
                clearTimeout(pressTimer);
            });
        }
    });
    updateLexiconSelectAllState();
    updateLexiconSelectCount();
}

function toggleLexiconSelectAll() {
    const container = document.getElementById('lexiconItemList');
    if (!container) return;
    const checkboxes = container.querySelectorAll('.lexicon-select-checkbox');
    if (checkboxes.length === 0) return;
    const btn = document.getElementById('lexiconSelectAllBtn');
    const isAllChecked = btn && btn.dataset.allChecked === 'true';

        checkboxes.forEach(cb => {

function deleteLexiconSelected() {
    const count = lexiconState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的词条');

    }
    if (!confirm('确定删除选中的 ' + count + ' 个词条吗？')) return;
    const data = getLexiconData();
    data.items = data.items.filter(item => !lexiconState.selectedIds.has(item.id));
    saveLexiconData(data);
    lexiconState.selectedIds = new Set();
    exitLexiconSelectMode();
    renderLexiconGroups();

    updateTypeCounts();
    showToast('已删除 ' + count + ' 个词条');
}

function saveLexiconBatch() {
    const input = document.getElementById('lexiconBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const group = lexiconState.currentGroup;
    let addedCount = 0;
    let skippedCount = 0;
    lines.forEach(line => {
        const exists = data.items.some(item =>
            item.type === type &&
            item.group === group &&
            item.content === line
        );
        if (exists) {
            skippedCount++;
            return;
        }
        data.items.push({
            id: 'l' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: type,
            group: group,
            content: line,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    saveLexiconData(data);
    closeModal();
    renderLexiconList();
    renderLexiconGroups();
    let msg = '已添加 ' + addedCount + ' 条';
    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 条重复词条';
    showToast(msg);
}

function saveLexiconImages() {
    const fileInput = document.getElementById('lexiconImageInput');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showToast('请选择图片');
        return;
    }
    const files = Array.from(fileInput.files);
    const data = getLexiconData();
    let loadedCount = 0;
    let skippedCount = 0;
    let totalProcessed = 0;
    files.forEach(async (file) => {
        try {
            const hash = await computeImageHash(file);
            const exists = data.items.some(item =>
                item.type === 'emoji_pack' &&
                item.hash === hash
            );
            if (exists) {
                skippedCount++;
                loadedCount++;
                if (loadedCount === files.length) {
                    closeModal();
                    renderLexiconList();
                    let msg = '已上传 ' + totalProcessed + ' 张';
                    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                    showToast(msg);
                }
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 80, function(compressedBase64) {
                    data.items.push({
                        id: 'l' + Date.now() + Math.random().toString(36).substr(2, 6),
                        type: 'emoji_pack',
                        group: lexiconState.currentGroup,
                        content: '',
                        images: [compressedBase64],
                        hash: hash,
                        createdAt: Date.now()
                    });
                    totalProcessed++;
                    loadedCount++;
                    if (loadedCount === files.length) {
                        saveLexiconData(data);
                        closeModal();
                        renderLexiconList();
                        let msg = '已上传 ' + totalProcessed + ' 张';
                        if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                        showToast(msg);
                    }
                });
            };
            reader.readAsDataURL(file);
        } catch (err) {
            console.error('处理图片失败:', err);
            loadedCount++;
            if (loadedCount === files.length) {
                closeModal();
                renderLexiconList();
                showToast('已上传 ' + totalProcessed + ' 张，' + skippedCount + ' 张跳过');
            }
        }
    });
}

async function computeImageHash(file) {
    const buffer = await file.arrayBuffer();
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
}

function compressImage(base64, targetSizeKB, callback) {
    const img = new Image();
    img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 800;
        if (width > maxSize || height > maxSize) {
            const ratio = Math.min(maxSize / width, maxSize / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.8;
        let result = canvas.toDataURL('image/jpeg', quality);
        while (result.length > targetSizeKB * 1024 && quality > 0.1) {
            quality -= 0.05;
            result = canvas.toDataURL('image/jpeg', quality);
        }
        callback(result);
    };
    img.src = base64;
}

function applyGlobalBgColor() {
    var settings = DataHub.get('settings', {});
    var mode = settings.bgMode || 'color';
    var appEl = document.getElementById('app');
    if (!appEl) return;
    var oldLayer = document.getElementById('globalBgLayer');
    if (oldLayer) oldLayer.remove();
    var oldCustom = document.getElementById('customBgStyle');
    if (oldCustom) oldCustom.remove();
    if (mode === 'color') {
        var c = settings.bgColor || '#ffffff';
        appEl.style.background = c;
        appEl.style.backgroundImage = 'none';
    } else if (mode === 'image') {
        var img = settings.bgImage || '';
        var opacity = (settings.bgOpacity !== undefined) ? settings.bgOpacity : 100;

window.saveFlow = function() {
    const type = document.getElementById('flowType');
    const amount = document.getElementById('flowAmount');
    const note = document.getElementById('flowNote');
    if (amount && parseFloat(amount.value)) {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        if (!wallet.flows) wallet.flows = [];
        const now = new Date();
        const time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        const amt = parseFloat(amount.value);
        wallet.flows.unshift({
            type: type.value,
            amount: amt,
            note: note ? note.value.trim() : '',
            time: time
        });
        if (type.value === '收入') {
            wallet.balance = (wallet.balance || 0) + amt;
        } else {
            wallet.balance = (wallet.balance || 0) - amt;
        }
        DataHub.set('wallet', wallet);
        closeModal();
        renderAll();
        openSubPage('wallet');
        showToast('流水已添加');
    }
};

function getMomentYearMonth(timeStr) {
    if (!timeStr) return { year: '未知', month: '未知' };
    var parts = timeStr.split(' ')[0].split('.');
    if (parts.length < 2) return { year: '未知', month: '未知' };
    return { year: parts[0] + '年', month: parts[1] + '月' };
}

function getMomentDateFull(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ');
    if (parts.length < 2) return timeStr;
    var dateParts = parts[0].split('.');
    if (dateParts.length < 3) return timeStr;
    var shortDate = parseInt(dateParts[1]) + '.' + parseInt(dateParts[2]);
    var timeParts = parts[1].split(':');
    var shortTime = '';
    if (timeParts.length >= 2) {
        shortTime = timeParts[0] + ':' + timeParts[1];
        if (timeParts.length >= 3) {
            shortTime += ':' + timeParts[2];
        }
    }
    return shortDate + ' ' + shortTime;
}

function getMomentDateShort(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ')[0].split('.');
    if (parts.length < 3) return '';
    return parseInt(parts[1]) + '.' + parseInt(parts[2]);
}

        var remaining = files.length;
        for (var i = 0; i < files.length; i++) {
            (function(file) {
                var reader = new FileReader();

                    compressImage(ev.target.result, 80, function(compressed) {
                        momentComposeState.images.push(compressed);

var momentLongPressState = {
    timer: null,
    menuEl: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindMomentReplyLongPress() {
    var container = document.getElementById('momentsSubContent');
    if (!container) return;
    var replyEls = container.querySelectorAll('.moment-reply[data-reply-id]');
    for (var i = 0; i < replyEls.length; i++) {
        (function(el) {
            var momentId = el.getAttribute('data-moment-id');
            var from = el.getAttribute('data-from');
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                momentLongPressState.startX = p.clientX;
                momentLongPressState.startY = p.clientY;
                momentLongPressState.moved = false;
                clearTimeout(momentLongPressState.timer);
                momentLongPressState.timer = setTimeout(function() {
                    if (!momentLongPressState.moved) {
                        showMomentReplyBubbleMenu(el, momentId, from, p.clientX, p.clientY);
                    }
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - momentLongPressState.startX) > 8 || Math.abs(p.clientY - momentLongPressState.startY) > 8) {
                    momentLongPressState.moved = true;
                    clearTimeout(momentLongPressState.timer);
                }
            }
            function onEnd() {
                clearTimeout(momentLongPressState.timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(replyEls[i]);
    }
}

function scheduleMomentFriendReplies(momentId, round) {
    if (!round || round < 1) round = 1;
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    var pending = DataHub.get('momentsPendingReplies', []);
    var now = Date.now();

    friends.forEach(function(friend) {
        var exists = pending.some(function(p) {
            return p.momentId === momentId && p.friendId === friend.id && p.round === round;
        });
        if (exists) return;
        var needMs = Math.random() * 30 * 60 * 1000;
        pending.push({
            id: 'mpr' + Date.now() + Math.random().toString(36).substr(2, 4),
            momentId: momentId,
            friendId: friend.id,
            round: round,
            needMs: needMs,
            accumulatedMs: 0,
            lastTickAt: now,
            createdAt: now
        });
    });

    DataHub.set('momentsPendingReplies', pending);
}

function checkMomentsPendingReplies() {
    var pending = DataHub.get('momentsPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRender = false;

    pending.forEach(function(p) {
        var elapsed = now - (p.lastTickAt || now);
        if (elapsed < 0) elapsed = 0;
        p.accumulatedMs = (p.accumulatedMs || 0) + elapsed;
        p.lastTickAt = now;

        if (p.accumulatedMs < p.needMs) {
            remaining.push(p);
            return;
        }
        var handled = handleMomentPendingReply(p);
        if (handled) needRender = true;
    });

    DataHub.set('momentsPendingReplies', remaining);

    if (needRender) {
        var container = document.getElementById('momentsSubContent');
        if (container) {
            container.innerHTML = renderMomentsListContent();
        }
        renderAll();
    }
}

function renderMyDiaryDateList() {
    var state = getMyDiaryViewState();

    var diary = DataHub.get('diary', []);
    if (diary.length === 0) return '';

    var groups = {};
    diary.forEach(function(d) {
        if (!d) return;
        var date = d.date || getDiaryDateFromTime(d.time);
        if (!date) return;
        var p = date.split('.');
        if (p.length < 3) return;
        var y = p[0];
        var m = p[1];
        var day = p[2];
        if (!groups[y]) groups[y] = {};
        if (!groups[y][m]) groups[y][m] = {};
        if (!groups[y][m][day]) groups[y][m][day] = [];
        groups[y][m][day].push(d);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    if (years.length === 0) return '';

    var today = getTodayDateStr();
    var todayParts = today.split('.');
    var curYear = todayParts[0];
    var curMonth = todayParts[1];

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === curYear);
        }
        var arrow = yearExpanded ? 'v' : '>';
        html += '<div style="font-size:10px;font-weight:600;color:#000000;padding:4px 4px;cursor:pointer;white-space:nowrap;" onclick="toggleMyDiaryYear(\'' + year + '\')">' +
            year + ' ' + arrow +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === curYear && month === curMonth);
            }
            var mArrow = monthExpanded ? 'v' : '>';
            html += '<div style="font-size:10px;color:#000000;padding:3px 4px 3px 8px;cursor:pointer;white-space:nowrap;" onclick="toggleMyDiaryMonth(\'' + year + '\',\'' + month + '\')">' +
                parseInt(month) + '月 ' + mArrow +
            '</div>';

            if (!monthExpanded) return;

            var days = Object.keys(groups[year][month]).sort(function(a, b) {
                return parseInt(b) - parseInt(a);
            });

            days.forEach(function(day) {
                var dayKey = year + '_' + month + '_' + day;
                var dayExpanded;
                if (state.expandedDays && state.expandedDays[dayKey] !== undefined) {
                    dayExpanded = state.expandedDays[dayKey];

                    day + ' ' + dArrow +

});
items.forEach(function(d, idx) {

    var d = diary.find(function(x) { return x.id === diaryId; });

    if (!d) {
        return '<div style="text-align:center;color:#999999;padding:30px 0;font-size:13px;">请从左侧选择一篇日记</div>';
    }

    var date = d.date || getDiaryDateFromTime(d.time);
    var dateDisplay = date;
    var p = date.split('.');
    if (p.length >= 3) {
        dateDisplay = p[0] + '年' + parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
    }

    var html = '';

    html += '<div style="font-size:14px;font-weight:600;color:#000000;margin-bottom:10px;">' + dateDisplay + '</div>';

    if (!d.content) {
        html += '<div style="text-align:center;color:#999999;padding:30px 0;font-size:13px;">这天没有日记</div>';
        return html;
    }

    html += '<div style="background:#f8fbf8;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.7;color:#000000;white-space:pre-wrap;word-break:break-word;">' +
        d.content +
    '</div>';

    var replies = d.replies || [];
    if (replies.length > 0) {
        html += '<div style="font-size:12px;color:#999999;margin-bottom:6px;">留言</div>';
        html += '<div style="background:#f8fbf8;border-radius:12px;padding:10px 12px;margin-bottom:12px;">';
        replies.forEach(function(r) {
            var fromName = '';
            if (r.from === 'me') {
                fromName = myName;
            } else {
                var f = friends.find(function(x) { return x.id === r.from; });
                fromName = f ? f.name : '好友';
            }
            var prefix = '';
            if (r.to === 'me') {
                prefix = fromName + ' @ ' + myName + '：';
            } else if (r.to) {
                var tf = friends.find(function(x) { return x.id === r.to; });
                var toName = tf ? tf.name : '好友';
                prefix = fromName + ' @ ' + toName + '：';
            } else {
                prefix = fromName + '：';
            }
            var deleteBtn = '';
            if (r.from === 'me') {
                deleteBtn = '<span onclick="event.stopPropagation();deleteMyDiaryReply(\'' + diaryId + '\',\'' + (r.id || '') + '\')" style="flex-shrink:0;margin-left:8px;color:#d4b0b0;cursor:pointer;font-size:14px;user-select:none;">x</span>';
            }
            html += '<div class="my-diary-reply" data-reply-id="' + (r.id || '') + '" data-diary-id="' + diaryId + '" data-from="' + (r.from || '') + '" style="display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;color:#000000;padding:4px 0;cursor:pointer;word-break:break-word;">' +
                '<span style="flex:1;min-width:0;">' + prefix + (r.text || '') + '</span>' +
                deleteBtn +
            '</div>';
        });
        html += '</div>';
    }

    var inputHtml = '';
    var locked = d.locked === true;
    if (locked) {
        inputHtml = '<div style="font-size:12px;color:#999999;margin-bottom:8px;">已上锁，好友无法回复</div>';
    } else {
        inputHtml = '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
            '<input type="text" id="myDiaryMsgInput" placeholder="留言..." style="flex:1;padding:8px 14px;border:1px solid #d4e4d6;border-radius:20px;font-size:14px;outline:none;background:#ffffff;color:#000000;">' +
            '<button onclick="sendMyDiaryMessage(\'' + diaryId + '\')" style="padding:8px 18px;background:var(--theme-main, #d4e9d6);border:none;border-radius:20px;font-size:14px;cursor:pointer;color:#000000;white-space:nowrap;">发送</button>' +
        '</div>';
    }

    html += inputHtml;

    var lockSvg = locked
    ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
    : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
html += '<div style="display:flex;gap:8px;">' +
    '<button class="btn-icon" onclick="toggleDiaryLock(\'' + (d.id || '') + '\')" style="color:#000000;">' + lockSvg + '</button>' +
    '<button class="btn-icon" onclick="deleteMyDiary(\'' + (d.id || '') + '\')">删除</button>' +
'</div>';

    return html;
}

function bindMyDiaryReplyLongPress() {
    var content = document.getElementById('myDiaryContent');
    if (!content) return;
    var els = content.querySelectorAll('.my-diary-reply[data-reply-id]');
    for (var i = 0; i < els.length; i++) {
        (function(el) {
            var diaryId = el.getAttribute('data-diary-id');
            var from = el.getAttribute('data-from');
            var timer = null;
            var startX = 0, startY = 0, moved = false;
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                startX = p.clientX;
                startY = p.clientY;
                moved = false;
                clearTimeout(timer);
                timer = setTimeout(function() {
                    if (moved) return;
                    if (!from || from === 'me') return;
                    openMyDiaryReplyInput(diaryId, from);
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - startX) > 8 || Math.abs(p.clientY - startY) > 8) {
                    moved = true;
                    clearTimeout(timer);
                }
            }
            function onEnd() {
                clearTimeout(timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(els[i]);
    }
}

function sendMyDiaryMessage(diaryId) {
    var input = document.getElementById('myDiaryMsgInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    var text = input.value.trim();

    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === diaryId; });
    if (!d) return;
    if (!d.replies) d.replies = [];
    if (d.locked === true) {
        showToast('已上锁，无法回复');
        return;
    }

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var state = getMyDiaryViewState();
    var target = state.replyTargets[diaryId] || null;

    var maxRound = 0;
    d.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    d.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: 'me',
        to: target || null,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('diary', diary);

    input.value = '';
    input.placeholder = '留言...';
    state.replyTargets[diaryId] = null;
    reloadMyDiaryContent();
    showToast('已发送');

    scheduleDiaryFriendReplies(diaryId, maxRound + 2);
}

function deleteMyDiaryReply(diaryId, replyId) {
    if (!diaryId || !replyId) return;
    if (!confirm('确定删除这条留言吗？')) return;
    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === diaryId; });
    if (!d || !d.replies) return;
    d.replies = d.replies.filter(function(r) {
        return !(r.id === replyId && r.from === 'me');
    });
    DataHub.set('diary', diary);
    reloadMyDiaryContent();
    showToast('已删除');
}

    var diary = DataHub.get('diary', []);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

window.deleteMyDiary = function(id) {
    if (!id) return;
    if (!confirm('确定删除这条日记吗？好友回复也会一起删除。')) return;
    var diary = DataHub.get('diary', []);
    diary = diary.filter(function(x) { return x.id !== id; });
    DataHub.set('diary', diary);

    var pending = DataHub.get('diaryPendingReplies', []);
    pending = pending.filter(function(p) { return p.diaryId !== id; });
    DataHub.set('diaryPendingReplies', pending);

    var state = getMyDiaryViewState();
    if (state.selectedId === id) {
        state.selectedId = diary.length > 0 ? diary[0].id : null;
    }

    renderAll();
    openSubPage('diary');
    showToast('已删除');
};

                time: time,
                unread: 0
            });
            DataHub.set('messages', msgs);
            DataHub.set('pendingVideoCallInterrupt', { duration: duration, time: Date.now() });
        } catch (e) {}
        stopVideoCallTimers();
        videoCallState.active = false;

// 获取某好友的零钱罐数据
function getPiggyData(friendId) {
    if (!friendId) return { balance: 0, flows: [] };
    var friends = DataHub.get('friends', []);
    var f = friends.find(function(x) { return x.id === friendId; });
    if (!f) return { balance: 0, flows: [] };
    if (!f.couple) f.couple = {};
    if (!f.couple.piggy) f.couple.piggy = { balance: 0, flows: [] };
    if (!f.couple.piggy.flows) f.couple.piggy.flows = [];
    return f.couple.piggy;
}

// 写入某好友的零钱罐数据
function savePiggyData(friendId, piggy) {

// 我存入零钱罐
function piggyDepositFromMe(friendId, amount) {
    if (!friendId || !amount || amount <= 0) {
        showToast('请输入有效金额');
        return false;
    }
    var myBalance = getAccountBalance('my');
    if (myBalance < amount) {

        return false;
    }

    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;
    var friendName = friend.name || '好友';

    // 我的账户：支出
    addFlow('my', {
        amount: amount,
        direction: 'expense',
        category: '零钱存入',
        subCategory: '我存入零钱罐',
        fromAccount: 'my',
        toAccount: 'piggy:' + friendId,
        relatedFriendId: friendId,
        note: '存入 ' + friendName + ' 的零钱罐'
    });

    // 零钱罐：收入
    addFlow('piggy:' + friendId, {
        amount: amount,
        direction: 'income',
        category: '零钱存入',
        subCategory: '我存入',
        fromAccount: 'my',
        toAccount: 'piggy:' + friendId,
        relatedFriendId: friendId,

    });

// 好友存入零钱罐（自动）
function piggyDepositFromFriend(friendId, amount) {

    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;
    if ((friend.balance || 0) < amount) return false;

        fromAccount: 'friend:' + friendId,
        toAccount: 'piggy:' + friendId,
        relatedFriendId: friendId,

    });

        direction: 'income',
        category: '零钱存入',
        subCategory: '他存入',
        fromAccount: 'friend:' + friendId,

// 从零钱罐付款（购物用，供第 5 步调用）
// payer: 'me' | 'friend'
// forWhom: 'self' | 'friend' | 'pay_for_friend'
function piggyPayForPurchase(friendId, amount, payer, forWhom, productInfo, note) {
    if (!friendId || !amount || amount <= 0) return false;
    var piggy = getPiggyData(friendId);
    if ((piggy.balance || 0) < amount) return false;

    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;
    var friendName = friend.name || '好友';
    var myName = DataHub.get('myProfile', { nickname: '我' }).nickname || '我';

    var payerLabel = (payer === 'me') ? '我' : friendName;

    // 零钱罐：支出
    addFlow('piggy:' + friendId, {
        amount: amount,
        direction: 'expense',
        category: '零钱购物',
        subCategory: '零钱购物',
        fromAccount: 'piggy:' + friendId,
        toAccount: '',
        relatedFriendId: friendId,
        relatedProductId: productInfo ? productInfo.id : '',
        note: note || (payerLabel + '从零钱罐付款'),
    forWhom: forWhom,
    productInfo: productInfo,
    payer: payer
});

    // 付款方账户也记一笔（支出从零钱罐，不是从余额，所以这里只记录不扣余额）
    // 说明：零钱罐的钱本来就是付款方的，所以付款方账户不需要重复扣
    // 但为了统计「零钱取用」，在付款方账户记一笔零钱购物
    var payerAccount = (payer === 'me') ? 'my' : ('friend:' + friendId);
    addFlow(payerAccount, {
        amount: amount,
        direction: 'expense',
        category: '零钱购物',
        subCategory: '零钱购物',
        fromAccount: 'piggy:' + friendId,
        toAccount: '',
        relatedFriendId: friendId,
        relatedProductId: productInfo ? productInfo.id : '',
        note: note || '从零钱罐付款',
    forWhom: forWhom,
    productInfo: productInfo,
    payer: payer
});

    return true;
}

// 零钱罐流水按类型汇总
function getPiggySummary(friendId) {
    var piggy = getPiggyData(friendId);
    var flows = piggy.flows || [];
    var result = {
        myDeposit: 0,
        friendDeposit: 0,
        myShop: 0,
        friendShop: 0
    };
    for (var i = 0; i < flows.length; i++) {
        var f = flows[i];
        if (f.category === '零钱存入') {
            if (f.subCategory === '我存入') result.myDeposit += f.amount;
            else if (f.subCategory === '他存入') result.friendDeposit += f.amount;
        } else if (f.category === '零钱购物') {
            // 判断是谁花的：看 fromAccount 对应的付款方
            // 这里用 note 或 forWhom 判断不够准确，用 fromAccount 判断
            // fromAccount 是 'piggy:xxx'，无法区分付款方
            // 所以零钱购物流水要额外带 payer 字段
            if (f.payer === 'me') result.myShop += f.amount;
            else if (f.payer === 'friend') result.friendShop += f.amount;
        }
    }
    return result;
}

// ====== 好友自动存入零钱罐 ======
function autoFriendPiggyDeposit() {
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    // 检查今天每个好友已经自动存入几次
    var today = getTodayDateStr();
    var depositLog = DataHub.get('piggyAutoDepositLog', {});
    if (!depositLog[today]) depositLog[today] = {};

    var changed = false;
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        if (!f.couple || f.couple.enabled !== true) continue;
        if ((f.balance || 0) <= 0) continue;

        var todayCount = depositLog[today][f.id] || 0;
        if (todayCount >= 3) continue;

        // 每天 0~3 次，随机决定这次是否存
        var shouldDeposit = Math.random() < 0.3;
        if (!shouldDeposit) continue;

        // 金额：他余额的 1%~10%
        var pct = 0.01 + Math.random() * 0.09;
        var amount = Math.round((f.balance || 0) * pct * 100) / 100;
        if (amount < 0.01) continue;

        var ok = piggyDepositFromFriend(f.id, amount);
        if (ok) {
            depositLog[today][f.id] = todayCount + 1;
            changed = true;
            showToast(f.name + ' 往零钱罐存了 ¥' + amount.toFixed(2));
        }
    }

    if (changed) {
        DataHub.set('piggyAutoDepositLog', depositLog);
        renderAll();
    }
}

// ====== 好友自动购物 ======
function autoFriendShopping() {
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    var today = getTodayDateStr();
    var shopLog = DataHub.get('piggyAutoShopLog', {});
    if (!shopLog[today]) shopLog[today] = {};

    var changed = false;
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        if ((f.balance || 0) <= 0) {
            // 余额为 0 也可能用零钱罐，继续判断
            var piggyCheck = getPiggyData(f.id);
            if ((piggyCheck.balance || 0) <= 0) continue;
        }

        var todayCount = shopLog[today][f.id] || 0;
        if (todayCount >= 2) continue;

        var shouldShop = Math.random() < 0.1;
        if (!shouldShop) continue;

        var ok = doFriendRandomShopping(f.id);
        if (ok) {
            shopLog[today][f.id] = todayCount + 1;
            changed = true;
        }

}

// 获取商场数据
function getMallData() {
    var mall = DataHub.get('mall', null);
    if (!mall) {
        mall = { products: [], categories: [] };
        DataHub.set('mall', mall);
    }
    if (!mall.products) mall.products = [];
    if (!mall.categories) mall.categories = [];
    return mall;
}

function saveMallData(mall) {
    DataHub.set('mall', mall);
}

// 默认商品 SVG 图（内存小）
function getDefaultProductSvg() {
    return 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80"><rect width="80" height="80" fill="#eef5ef"/><path d="M20 32h40v30H20z" fill="#d4e9d6"/><path d="M28 32l12-12 12 12" fill="none" stroke="#8aaa8e" stroke-width="3"/><circle cx="40" cy="46" r="6" fill="#8aaa8e"/></svg>');
}

// 渲染商品图片
function renderProductImage(product) {
    if (!product) return '<div style="width:100%;height:80px;background:#eef5ef;border-radius:8px;"></div>';
    if (product.imageType === 'upload' && product.image) {
        return '<img src="' + product.image + '" style="width:100%;height:80px;object-fit:cover;border-radius:8px;">';
    }
    if (product.imageType === 'emoji' && product.image) {
        return '<div style="width:100%;height:80px;background:#eef5ef;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:40px;">' + product.image + '</div>';
    }
    return '<img src="' + getDefaultProductSvg() + '" style="width:100%;height:80px;object-fit:cover;border-radius:8px;">';
}

// 获取某好友可见的商品
function getVisibleProductsForFriend(friendId) {
    var mall = getMallData();
    return mall.products.filter(function(p) {
        if (!p.exclusiveFriendId) return true;
        return p.exclusiveFriendId === friendId;
    });
}

// 获取某好友可见的分类
function getVisibleCategoriesForFriend(friendId) {
    var mall = getMallData();
    return mall.categories.filter(function(c) {
        if (!c.exclusiveFriendId) return true;
        return c.exclusiveFriendId === friendId;
    });
}

// 添加分类
function addMallCategory(name, exclusiveFriendId) {
    if (!name || !name.trim()) {
        showToast('请输入分类名');
        return false;
    }
    var mall = getMallData();
    var exists = mall.categories.some(function(c) { return c.name === name.trim(); });
    if (exists) {
        showToast('分类已存在');
        return false;
    }
    mall.categories.push({
        name: name.trim(),
        exclusiveFriendId: exclusiveFriendId || ''
    });
    saveMallData(mall);
    showToast('已添加分类');
    return true;
}

// 删除分类
function deleteMallCategory(name) {
    if (!name) return;
    if (!confirm('确定删除分类「' + name + '」吗？该分类下的商品会归入默认分类。')) return;
    var mall = getMallData();
    mall.categories = mall.categories.filter(function(c) { return c.name !== name; });
    for (var i = 0; i < mall.products.length; i++) {
        if (mall.products[i].category === name) {
            mall.products[i].category = '默认';
        }
    }
    saveMallData(mall);
    showToast('已删除分类');
}

// 添加商品
function addMallProduct(data) {
    if (!data || !data.name || !data.name.trim()) {
        showToast('请输入商品名');
        return false;
    }
    if (data.price === undefined || data.price === null || isNaN(data.price) || data.price < 0) {
        showToast('请输入有效价格');
        return false;
    }
    var mall = getMallData();
    var now = Date.now();
    mall.products.push({
        id: 'p' + now + Math.random().toString(36).substr(2, 4),
        name: data.name.trim(),
        price: parseFloat(data.price),
        image: data.image || '',
        imageType: data.imageType || 'default',
        category: data.category || '默认',
        description: data.description || '',
        exclusiveFriendId: data.exclusiveFriendId || '',
        createdAt: now,
        updatedAt: now
    });
    saveMallData(mall);
    showToast('已添加商品');
    return true;
}

// 更新商品
function updateMallProduct(productId, data) {
    if (!productId || !data) return false;
    var mall = getMallData();
    var p = mall.products.find(function(x) { return x.id === productId; });
    if (!p) return false;
    if (data.name !== undefined) p.name = data.name.trim();
    if (data.price !== undefined) p.price = parseFloat(data.price);
    if (data.image !== undefined) p.image = data.image;
    if (data.imageType !== undefined) p.imageType = data.imageType;
    if (data.category !== undefined) p.category = data.category;
    if (data.description !== undefined) p.description = data.description;
    if (data.exclusiveFriendId !== undefined) p.exclusiveFriendId = data.exclusiveFriendId;
    p.updatedAt = Date.now();
    saveMallData(mall);
    showToast('已保存');
    return true;
}

// 删除商品
function deleteMallProduct(productId) {
    if (!productId) return;
    if (!confirm('确定删除这个商品吗？')) return;
    var mall = getMallData();
    mall.products = mall.products.filter(function(x) { return x.id !== productId; });
    saveMallData(mall);
    showToast('已删除');
}

// 购买商品（核心函数）
// productId: 商品 id
// payer: 'me' | 'friend'
// forWhom: 'self' | 'friend'
// paidFrom: 'balance' | 'piggy'
// paidFromFriendId: 如果是零钱罐，哪个好友的罐子（payer 是 friend 时，就是他自己的罐子）
function buyProduct(productId, payer, forWhom, paidFrom, paidFromFriendId) {
    if (!productId) return false;
    var mall = getMallData();
    var product = mall.products.find(function(p) { return p.id === productId; });
    if (!product) {
        showToast('商品不存在');
        return false;
    }
    if (!currentChatId) {
        showToast('请先进入聊天');
        return false;
    }
    var friendId = currentChatId;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;
    var friendName = friend.name || '好友';

    var price = product.price || 0;
    var productInfo = {
        id: product.id,
        name: product.name,
        price: product.price,
        image: product.image,
        imageType: product.imageType,
        description: product.description,
        category: product.category
    };

    var productSnapshot = JSON.parse(JSON.stringify(productInfo));

    // 判断付款账户
    var paidAccountId = '';
    var paidLabel = '';

    if (paidFrom === 'balance') {
        if (payer === 'me') {
            paidAccountId = 'my';
            paidLabel = '我的余额';
        } else {
            paidAccountId = 'friend:' + friendId;
            paidLabel = friendName + '的余额';
        }
    } else if (paidFrom === 'piggy') {
        var piggyFriendId = paidFromFriendId || friendId;
        paidAccountId = 'piggy:' + piggyFriendId;
        var piggyFriends = DataHub.get('friends', []);
        var piggyFriend = piggyFriends.find(function(f) { return f.id === piggyFriendId; });
        paidLabel = (piggyFriend ? piggyFriend.name : '好友') + '的零钱罐';
    } else {
        showToast('支付方式错误');
        return false;
    }

    // 检查余额
    var balance = getAccountBalance(paidAccountId);
    if (balance < price) {
        showToast(paidLabel + '余额不足');
        return false;
    }

    // 扣款
    var isPiggy = (paidFrom === 'piggy');
    var category = isPiggy ? '零钱购物' : '商场购物';
    var subCategory = isPiggy ? '零钱购物' : '余额支付';

    addFlow(paidAccountId, {
        amount: price,
        direction: 'expense',
        category: category,
        subCategory: subCategory,
        fromAccount: paidAccountId,
        toAccount: '',
        relatedFriendId: friendId,
        relatedProductId: product.id,
        note: (payer === 'me' ? '我' : friendName) + '购买了 ' + product.name,
        forWhom: forWhom,
        productInfo: productSnapshot,
        payer: payer
    });

    // 写入购买记录
    addPurchasedItem(payer, forWhom, productSnapshot, paidFrom, paidFromFriendId, false);

    // 购物日记 1% 触发
    if (Math.random() < 0.01) {
        triggerShoppingDiary(payer, friendId, productSnapshot);
    }

    showToast('购买成功');
    return true;
}

// 写入购买记录到 purchasedItems
function addPurchasedItem(payer, forWhom, productInfo, paidFrom, paidFromFriendId, isSurprise) {
    var now = Date.now();
    var nowStr = getNowTimeStringFull();

    // 决定商品归谁
    var ownerAccountId = '';
    if (forWhom === 'self') {
        ownerAccountId = (payer === 'me') ? 'my' : ('friend:' + currentChatId);
    } else if (forWhom === 'friend') {
        // 商品归好友
        ownerAccountId = 'friend:' + currentChatId;
    } else if (forWhom === 'pay_for_friend') {
        ownerAccountId = 'friend:' + currentChatId;
    }

    // 如果是惊喜礼物（好友买给我），商品归我
    if (isSurprise) {
        ownerAccountId = 'my';
    }

    if (!ownerAccountId) ownerAccountId = 'my';

    var item = {
        id: 'pi' + now + Math.random().toString(36).substr(2, 4),
        productId: productInfo.id,
        name: productInfo.name,
        price: productInfo.price,
        image: productInfo.image || '',
        imageType: productInfo.imageType || 'default',
        description: productInfo.description || '',
        category: productInfo.category || '默认',
        boughtBy: payer,
        forWhom: forWhom,
        paidFrom: paidFrom,
        paidFromFriendId: paidFromFriendId || '',
        time: nowStr,
        isGift: (forWhom === 'friend'),
        isSurprise: !!isSurprise
    };

    var items = getPurchasedItems(ownerAccountId);
    items.unshift(item);
    setPurchasedItems(ownerAccountId, items);
}

// 好友随机购物（真正逻辑）
function doFriendRandomShopping(friendId) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;

    // 获取好友可见商品
    var visible = getVisibleProductsForFriend(friendId);
    if (visible.length === 0) return false;

    // 随机挑一个
    var product = visible[Math.floor(Math.random() * visible.length)];
    if (!product) return false;

    var price = product.price || 0;
    if (price <= 0) return false;

    // 决定支付方式：余额 或 零钱罐
    var usePiggy = false;
    if (friend.couple && friend.couple.enabled === true) {
        var piggy = getPiggyData(friendId);
        if ((piggy.balance || 0) >= price) {
            usePiggy = Math.random() < 0.5;
        }
    }

    var balance = friend.balance || 0;
    if (!usePiggy && balance < price) {
        // 余额不够，试试零钱罐
        var piggy2 = getPiggyData(friendId);
        if ((piggy2.balance || 0) >= price) {
            usePiggy = true;
        } else {
            return false;
        }
    }

    var productSnapshot = {
        id: product.id,
        name: product.name,
        price: product.price,
        image: product.image,
        imageType: product.imageType,
        description: product.description,
        category: product.category
    };

    // 决定归属：给自己买，还是买给我
    var forWhom = 'self';
    var isSurprise = false;
    if (Math.random() < 0.15) {
        // 15% 概率买给我（惊喜礼物）
        forWhom = 'friend';
        isSurprise = true;
    }

    // 扣款
    var paidAccountId = usePiggy ? ('piggy:' + friendId) : ('friend:' + friendId);
    var category = usePiggy ? '零钱购物' : '商场购物';
    var subCategory = usePiggy ? '零钱购物' : '余额支付';

    addFlow(paidAccountId, {
        amount: price,
        direction: 'expense',
        category: category,
        subCategory: subCategory,
        fromAccount: paidAccountId,
        toAccount: '',
        relatedFriendId: friendId,
        relatedProductId: product.id,
        note: friend.name + '购买了 ' + product.name,
        forWhom: forWhom,
        productInfo: productSnapshot,
        payer: 'friend'
    });

    // 写入购买记录
    addPurchasedItem('friend', forWhom, productSnapshot, usePiggy ? 'piggy' : 'balance', friendId, isSurprise);

    // 购物日记 1%
    if (Math.random() < 0.01) {
        triggerShoppingDiary('friend', friendId, productSnapshot);
    }

    if (isSurprise) {
        showToast(friend.name + ' 给你买了 ' + product.name);
    } else {
        showToast(friend.name + ' 购买了 ' + product.name);
    }

    // 每次好友购物后，1% 概率随机删除一件好友账户里的商品
    tryRandomDeleteFriendItem(friendId);

    return true;
}

// 好友发起支付礼物请求
function createPayRequest(friendId, productId) {
    if (!friendId || !productId) return false;
    var mall = getMallData();
    var product = mall.products.find(function(p) { return p.id === productId; });
    if (!product) return false;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    if (!friend) return false;
    var friendName = friend.name || '好友';

    var productInfo = {
        id: product.id,
        name: product.name,
        price: product.price,
        image: product.image,
        imageType: product.imageType,
        description: product.description,
        category: product.category
    };

    var requestId = 'pr' + Date.now() + Math.random().toString(36).substr(2, 4);

    var requests = DataHub.get('payRequests', []);
    requests.push({
        id: requestId,
        friendId: friendId,
        productId: productId,
        productInfo: productInfo,
        status: 'pending',
        createdAt: Date.now(),
        paidAt: null,
        rejectedAt: null,
        paidFrom: '',
        paidFromFriendId: ''
    });
    DataHub.set('payRequests', requests);

    // 发到聊天消息
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var msgs = DataHub.get('messages', []);
    msgs.push({
        id: 'm' + genId(),
        chatId: friendId,
        from: friendId,
        text: friendName + ' 想让你帮他买：' + product.name,
        time: time,
        timestamp: Date.now(),
        unread: (currentChatId === friendId) ? 0 : 1,
        isPayRequest: true,
        payRequestId: requestId
    });
    DataHub.set('messages', msgs);

    if (currentChatId === friendId) {
        renderChatMessages();
    }
    renderMessages();
    showToast(friendName + ' 发来一个支付请求');
    return true;
}

// 我同意支付
function payForRequest(requestId, paidFrom, paidFromFriendId) {
    if (!requestId) return false;
    var requests = DataHub.get('payRequests', []);
    var req = requests.find(function(r) { return r.id === requestId; });
    if (!req) {
        showToast('请求不存在');
        return false;
    }
    if (req.status !== 'pending') {
        showToast('该请求已处理');
        return false;
    }

    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === req.friendId; });
    if (!friend) return false;
    var friendName = friend.name || '好友';

    var price = req.productInfo.price || 0;

    // 判断付款账户
    var paidAccountId = '';
    var paidLabel = '';
    if (paidFrom === 'balance') {
        paidAccountId = 'my';
        paidLabel = '我的余额';
    } else if (paidFrom === 'piggy') {
        var piggyFriendId = paidFromFriendId || req.friendId;
        paidAccountId = 'piggy:' + piggyFriendId;
        var pf = friends.find(function(f) { return f.id === piggyFriendId; });
        paidLabel = (pf ? pf.name : '好友') + '的零钱罐';
    } else {
        showToast('支付方式错误');
        return false;
    }

    // 检查余额
    var balance = getAccountBalance(paidAccountId);
    if (balance < price) {
        showToast(paidLabel + '余额不足');
        return false;
    }

    // 扣款
    var isPiggy = (paidFrom === 'piggy');
    var category = isPiggy ? '零钱购物' : '商场购物';
    var subCategory = isPiggy ? '零钱购物' : '余额支付';

    addFlow(paidAccountId, {
        amount: price,
        direction: 'expense',
        category: category,
        subCategory: subCategory,
        fromAccount: paidAccountId,
        toAccount: '',
        relatedFriendId: req.friendId,
        relatedProductId: req.productId,
        note: '替 ' + friendName + ' 支付 ' + req.productInfo.name,
        forWhom: 'pay_for_friend',
        productInfo: req.productInfo,
        payer: 'me'
    });

    // 商品归好友
    addPurchasedItem('me', 'pay_for_friend', req.productInfo, paidFrom, paidFromFriendId, false);

    // 更新请求状态
    req.status = 'paid';
    req.paidAt = Date.now();
    req.paidFrom = paidFrom;
    req.paidFromFriendId = paidFromFriendId || '';
    DataHub.set('payRequests', requests);

    // 更新聊天消息
    updatePayRequestMessage(requestId, 'paid');

    showToast('已支付');
    return true;
}

// 我拒绝支付
function rejectPayRequest(requestId) {
    if (!requestId) return false;
    var requests = DataHub.get('payRequests', []);
    var req = requests.find(function(r) { return r.id === requestId; });
    if (!req) return false;
    if (req.status !== 'pending') return false;

    req.rejectedAt = Date.now();
    DataHub.set('payRequests', requests);

    updatePayRequestMessage(requestId, 'rejected');
    showToast('已拒绝');
    return true;
}

// ====== 好友自动发起支付礼物请求 ======
function autoFriendPayRequest() {
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    // 避免同时太多 pending 请求
    var requests = DataHub.get('payRequests', []);
    var pendingCount = 0;
    for (var pi = 0; pi < requests.length; pi++) {
        if (requests[pi].status === 'pending') pendingCount++;
    }
    if (pendingCount >= 3) return;

    var today = getTodayDateStr();
    var log = DataHub.get('payRequestAutoLog', {});
    if (!log[today]) log[today] = {};

    var changed = false;
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];

        var todayCount = log[today][f.id] || 0;
        if (todayCount >= 1) continue;

        var shouldReq = Math.random() < 0.03;
        if (!shouldReq) continue;

        var visible = getVisibleProductsForFriend(f.id);
        if (visible.length === 0) continue;

        var product = visible[Math.floor(Math.random() * visible.length)];
        if (!product) continue;

        var ok = createPayRequest(f.id, product.id);
        if (ok) {
            log[today][f.id] = todayCount + 1;
            changed = true;
        }
    }

    if (changed) {
        DataHub.set('payRequestAutoLog', log);
    }
}

window.autoFriendPayRequest = autoFriendPayRequest;

        chatId: chatId,

        text: text || '',
        time: time,
        timestamp: Date.now(),
        unread: (currentChatId === chatId && from !== 'me') ? 0 : (from !== 'me' ? 1 : 0)
    };
    if (extra) {
