// ====== 账户系统核心：统一流水表 ======
// 流水结构：
// {
//   id, time, timestamp,
//   amount,                // 正数
//   direction,             // 'income' | 'expense'
//   category,              // '红包' | '转账' | '商场购物' | '零钱存入' | '零钱购物' | '惊喜礼物' | '支付礼物'
//   subCategory,           // 细分标注
//   fromAccount,           // 'my' | 'friend:f1' | 'piggy:f1'
//   toAccount,
//   relatedFriendId,
//   relatedProductId,
//   note,
//   status,                // 'pending' | 'done' | 'refunded' | 'rejected'
//   forWhom,               // 'self' | 'friend' | 'pay_for_friend'
//   productInfo
// }

function getNowTimeStringFull() {
    var now = new Date();
    return now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
}

// ====== 获取某账户的流水数组 ======
// accountId: 'my' | 'friend:f1' | 'piggy:f1'
function getAccountFlows(accountId) {
    if (!accountId) return [];
    if (accountId === 'my') {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        if (!wallet.flows) wallet.flows = [];
        return wallet.flows;
    }
    if (accountId.indexOf('friend:') === 0) {
        var fid = accountId.substring(7);
        var friends = DataHub.get('friends', []);
        var f = friends.find(function(x) { return x.id === fid; });
        if (!f) return [];
        if (!f.flows) f.flows = [];
        return f.flows;
    }
    if (accountId.indexOf('piggy:') === 0) {
        var pid = accountId.substring(6);
        var friends2 = DataHub.get('friends', []);
        var f2 = friends2.find(function(x) { return x.id === pid; });
        if (!f2) return [];
        if (!f2.couple) f2.couple = {};
        if (!f2.couple.piggy) f2.couple.piggy = { balance: 0, flows: [] };
        if (!f2.couple.piggy.flows) f2.couple.piggy.flows = [];
        return f2.couple.piggy.flows;
    }
    return [];
}

// ====== 写入某账户的流水数组 ======
function setAccountFlows(accountId, flows) {
    if (!accountId) return;
    if (accountId === 'my') {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        wallet.flows = flows;
        DataHub.set('wallet', wallet);
        return;
    }
    if (accountId.indexOf('friend:') === 0) {
        var fid = accountId.substring(7);
        var friends = DataHub.get('friends', []);
        var f = friends.find(function(x) { return x.id === fid; });
        if (!f) return;
        f.flows = flows;
        DataHub.set('friends', friends);
        return;
    }
    if (accountId.indexOf('piggy:') === 0) {
        var pid = accountId.substring(6);
        var friends2 = DataHub.get('friends', []);
        var f2 = friends2.find(function(x) { return x.id === pid; });
        if (!f2) return;
        if (!f2.couple) f2.couple = {};
        if (!f2.couple.piggy) f2.couple.piggy = { balance: 0, flows: [] };
        f2.couple.piggy.flows = flows;
        DataHub.set('friends', friends2);
        return;
    }
}

// ====== 读取某账户余额 ======
function getAccountBalance(accountId) {
    if (!accountId) return 0;
    if (accountId === 'my') {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        return wallet.balance || 0;
    }
    if (accountId.indexOf('friend:') === 0) {
        var fid = accountId.substring(7);
        var friends = DataHub.get('friends', []);
        var f = friends.find(function(x) { return x.id === fid; });
        if (!f) return 0;
        return f.balance || 0;
    }
    if (accountId.indexOf('piggy:') === 0) {
        var pid = accountId.substring(6);
        var friends2 = DataHub.get('friends', []);
        var f2 = friends2.find(function(x) { return x.id === pid; });
        if (!f2) return 0;
        if (!f2.couple || !f2.couple.piggy) return 0;
        return f2.couple.piggy.balance || 0;
    }
    return 0;
}

// ====== 写入某账户余额 ======
function setAccountBalance(accountId, balance) {
    if (!accountId) return;
    if (accountId === 'my') {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        wallet.balance = balance;
        DataHub.set('wallet', wallet);
        return;
    }
    if (accountId.indexOf('friend:') === 0) {
        var fid = accountId.substring(7);
        var friends = DataHub.get('friends', []);
        var f = friends.find(function(x) { return x.id === fid; });
        if (!f) return;
        f.balance = balance;
        DataHub.set('friends', friends);
        return;
    }
    if (accountId.indexOf('piggy:') === 0) {
        var pid = accountId.substring(6);
        var friends2 = DataHub.get('friends', []);
        var f2 = friends2.find(function(x) { return x.id === pid; });
        if (!f2) return;
        if (!f2.couple) f2.couple = {};
        if (!f2.couple.piggy) f2.couple.piggy = { balance: 0, flows: [] };
        f2.couple.piggy.balance = balance;
        DataHub.set('friends', friends2);
        return;
    }
}

// ====== 统一写入一笔流水，并同步余额 ======
// flow: 流水对象（不含 id / time / timestamp，函数自动补）
// 返回：完整流水对象
function addFlow(accountId, flow) {
    if (!accountId || !flow) return null;
    var now = new Date();
    var fullFlow = {
        id: 'fl' + now.getTime() + Math.random().toString(36).substr(2, 4),
        time: getNowTimeStringFull(),
        timestamp: now.getTime(),
        amount: Math.abs(flow.amount || 0),
        direction: flow.direction || 'expense',
        category: flow.category || '',
        subCategory: flow.subCategory || '',
        fromAccount: flow.fromAccount || '',
        toAccount: flow.toAccount || '',
        relatedFriendId: flow.relatedFriendId || '',
relatedProductId: flow.relatedProductId || '',
relatedHongbaoId: flow.relatedHongbaoId || '',
note: flow.note || '',
        status: flow.status || 'done',
        forWhom: flow.forWhom || '',
        productInfo: flow.productInfo || null
    };

    var flows = getAccountFlows(accountId);
    flows.unshift(fullFlow);
    setAccountFlows(accountId, flows);

    var balance = getAccountBalance(accountId);
    if (fullFlow.direction === 'income') {
        balance = balance + fullFlow.amount;
    } else {
        balance = balance - fullFlow.amount;
    }
    setAccountBalance(accountId, balance);

    return fullFlow;
}

// ====== 过滤流水：按分类 ======
function filterFlowsByCategory(flows, category) {
    if (!flows) return [];
    if (!category) return flows;
    return flows.filter(function(f) { return f.category === category; });
}

// ====== 过滤流水：按日期（dateKey 格式 '2026.10.03'） ======
function filterFlowsByDate(flows, dateKey) {
    if (!flows) return [];
    if (!dateKey) return flows;
    return flows.filter(function(f) {
        return f.time && f.time.indexOf(dateKey) === 0;
    });
}

// ====== 过滤流水：今日 ======
function filterFlowsToday(flows) {
    if (!flows) return [];
    var now = new Date();
    var dateKey = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
    return filterFlowsByDate(flows, dateKey);
}

// ====== 求和：收入合计 ======
function sumIncome(flows) {
    if (!flows) return 0;
    var total = 0;
    for (var i = 0; i < flows.length; i++) {
        if (flows[i].direction === 'income') total += flows[i].amount;
    }
    return total;
}

// ====== 求和：支出合计 ======
function sumExpense(flows) {
    if (!flows) return 0;
    var total = 0;
    for (var i = 0; i < flows.length; i++) {
        if (flows[i].direction === 'expense') total += flows[i].amount;
    }
    return total;
}

// ====== 求和：净额（收入-支出） ======
function sumNet(flows) {
    return sumIncome(flows) - sumExpense(flows);
}

// ====== 按分类分组求和 ======
function groupFlowsByCategory(flows) {
    var result = {};
    if (!flows) return result;
    for (var i = 0; i < flows.length; i++) {
        var f = flows[i];
        var cat = f.category || '其他';
        if (!result[cat]) result[cat] = { income: 0, expense: 0, count: 0 };
        if (f.direction === 'income') result[cat].income += f.amount;
        else result[cat].expense += f.amount;
        result[cat].count++;
    }
    return result;
}

// ====== 统一流水状态显示 ======
function getFlowStatusText(status) {
    if (status === 'pending') return '（待处理）';
    if (status === 'accepted') return '（已收款）';
    if (status === 'expired') return '（已退回）';
    if (status === 'rejected') return '（已退回）';
    if (status === 'refunded') return '（已退回）';
    return '';
}

// ====== 商品随机删除（1% 概率） ======
// 每次好友购物后触发一次
// 删除范围：好友账户里的商品（他给自己买的 + 我买给他的）
function tryRandomDeleteFriendItem(friendId) {
    if (!friendId) return false;
    if (Math.random() >= 0.01) return false;

    var accountId = 'friend:' + friendId;
    var items = getPurchasedItems(accountId);
    if (!items || items.length === 0) return false;

    // 过滤：只删「他给自己买的」和「我买给他的」
    var candidates = [];
    for (var i = 0; i < items.length; i++) {
        var it = items[i];
        if (it.forWhom === 'self' && it.boughtBy === 'friend') {
            candidates.push(it);
        } else if (it.forWhom === 'friend' && it.boughtBy === 'me') {
            candidates.push(it);
        }
    }
    if (candidates.length === 0) return false;

    var picked = candidates[Math.floor(Math.random() * candidates.length)];
    if (!picked) return false;

    items = items.filter(function(x) { return x.id !== picked.id; });
    setPurchasedItems(accountId, items);

    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === friendId; });
    var friendName = friend ? friend.name : '好友';
    showToast(friendName + ' 删除了一件商品：' + (picked.name || ''));
    return true;
}

window.tryRandomDeleteFriendItem = tryRandomDeleteFriendItem;

// ====== 好友商品自动随机删除（定时兜底） ======
function autoRandomDeleteFriendItems() {
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    var today = getTodayDateStr();
    var log = DataHub.get('randomDeleteLog', {});
    if (!log[today]) log[today] = {};

    var changed = false;
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        var todayCount = log[today][f.id] || 0;
        if (todayCount >= 1) continue;

        var ok = tryRandomDeleteFriendItem(f.id);
        if (ok) {
            log[today][f.id] = todayCount + 1;
            changed = true;
        }
    }

    if (changed) {
        DataHub.set('randomDeleteLog', log);
        renderAll();
    }
}

// ====== 购物日记的好友回复调度 ======
// 我写了购物日记后，好友会随机回复
// 复用已有的 friendDiaryPendingReplies 机制
function scheduleShoppingDiaryFriendReplies(diaryId) {
    if (!diaryId) return;
    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === diaryId; });
    if (!d) return;
    if (!d.fromShopping) return; // 不是购物日记，不处理
    if (d.locked === true) return;

    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    var pending = DataHub.get('friendDiaryPendingReplies', []);
    var now = Date.now();
    var added = false;

    for (var i = 0; i < friends.length; i++) {
        var friend = friends[i];
        var exists = pending.some(function(p) {
            return p.chatId === friend.id && p.date === d.date && p.type === 'shopping';
        });
        if (exists) continue;

        // 购物日记回复更快：5~30 分钟
        var needMs = (5 + Math.random() * 25) * 60 * 1000;
        pending.push({
            id: 'fdpr' + Date.now() + Math.random().toString(36).substr(2, 4),
            chatId: friend.id,
            date: d.date,
            type: 'shopping',
            needMs: needMs,
            accumulatedMs: 0,
            lastTickAt: now,
            createdAt: now
        });
        added = true;
    }

    if (added) {
        DataHub.set('friendDiaryPendingReplies', pending);
    }
}

window.scheduleShoppingDiaryFriendReplies = scheduleShoppingDiaryFriendReplies;

// 启动购物日记回复调度
function startShoppingDiaryReplyScheduler() {
    // 每次我发购物日记后主动调度
    // 这里挂一个定时兜底，扫描最近 1 小时的购物日记
    setInterval(function() {
        var diary = DataHub.get('diary', []);
        var now = Date.now();
        for (var i = 0; i < diary.length; i++) {
            var d = diary[i];
            if (!d.fromShopping) continue;
            if (d.locked === true) continue;
            if (d.shoppingReplyScheduled === true) continue;

            // 只处理 1 小时内的
            var dTime = 0;
            if (d.time) {
                var parts = d.time.split(/[.: ]/);
                if (parts.length >= 5) {
                    dTime = new Date(parts[0], parseInt(parts[1])-1, parseInt(parts[2]), parseInt(parts[3]), parseInt(parts[4])).getTime();
                }
            }
            if (now - dTime > 60 * 60 * 1000) continue;

            scheduleShoppingDiaryFriendReplies(d.id);
            d.shoppingReplyScheduled = true;
        }
        DataHub.set('diary', diary);
    }, 5 * 60 * 1000);
}

// ====== 月度统计核心逻辑 ======

// 获取某个月份的 key（格式 '2026.09'）
function getMonthKeyFromDate(date) {
    var d = date || new Date();
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0');
}

// 获取上个月的 key
function getLastMonthKey() {
    var d = new Date();
    d.setMonth(d.getMonth() - 1);
    return getMonthKeyFromDate(d);
}

// 判断某流水是否属于某个月份
function isFlowInMonth(flow, monthKey) {
    if (!flow || !flow.time || !monthKey) return false;
    return flow.time.indexOf(monthKey) === 0;
}

// 统计某账户某月的商品购买
// 返回 { mostBought, mostBoughtForMe, diaryTriggerProduct }
function calcMonthlyStats(accountId, monthKey) {
    var result = {
        month: monthKey,
        mostCollected: '',
        mostBought: '',
        mostBoughtForMe: '',
        diaryTriggerProduct: ''
    };

    // 获取流水
    var flows = getAccountFlows(accountId);

    // 统计购买次数
    var boughtCount = {};       // 商品名 -> 次数（自己买）
    var boughtForMeCount = {};  // 商品名 -> 次数（买给我）
    var diaryProduct = '';

    for (var i = 0; i < flows.length; i++) {
        var f = flows[i];
        if (!isFlowInMonth(f, monthKey)) continue;
        if (f.category !== '商场购物' && f.category !== '零钱购物') continue;

        var pname = f.productInfo ? f.productInfo.name : '';
        if (!pname) continue;

        // 自己买
        if (f.forWhom === 'self') {
            boughtCount[pname] = (boughtCount[pname] || 0) + 1;
        }

        // 买给我
        if (f.forWhom === 'friend' && accountId.indexOf('friend:') === 0) {
            boughtForMeCount[pname] = (boughtForMeCount[pname] || 0) + 1;
        }
    }

    // 找最大值
    function findMax(obj) {
        var maxKey = '';
        var maxVal = 0;
        for (var k in obj) {
            if (obj[k] > maxVal) {
                maxVal = obj[k];
                maxKey = k;
            }
        }
        return maxKey;
    }

    result.mostBought = findMax(boughtCount);
    result.mostBoughtForMe = findMax(boughtForMeCount);

    // 触发购物日记的商品
    var stats = getMonthlyStats(accountId);
    if (stats.month === monthKey) {
        result.diaryTriggerProduct = stats.diaryTriggerProduct || '';
    }

    return result;
}

// 执行月度统计（每月 1 号跑）
function runMonthlyStats() {
    var lastMonthKey = getLastMonthKey();
    var lastStatsMonth = DataHub.get('lastMonthlyStatsMonth', '');
    if (lastStatsMonth === lastMonthKey) return; // 已统计过

    // 我的账户
    var myStats = calcMonthlyStats('my', lastMonthKey);
    var wallet = DataHub.get('wallet', { balance: 0, flows: [], monthlyStats: {} });
    wallet.monthlyStats = myStats;
    DataHub.set('wallet', wallet);

    // 每个好友
    var friends = DataHub.get('friends', []);
    for (var i = 0; i < friends.length; i++) {
        var f = friends[i];
        f.monthlyStats = calcMonthlyStats('friend:' + f.id, lastMonthKey);
    }
    DataHub.set('friends', friends);

    DataHub.set('lastMonthlyStatsMonth', lastMonthKey);
    showToast('已完成上月统计');
}

window.calcMonthlyStats = calcMonthlyStats;
window.runMonthlyStats = runMonthlyStats;

// 获取某好友的收藏列表
function getFriendCollections(friendId) {
    if (!friendId) return [];
    var friends = DataHub.get('friends', []);
    var f = friends.find(function(x) { return x.id === friendId; });
    if (!f) return [];
    if (!f.collections) f.collections = [];
    return f.collections;
}

// 写入某好友的收藏列表
function setFriendCollections(friendId, collections) {
    if (!friendId) return;
    var friends = DataHub.get('friends', []);
    var f = friends.find(function(x) { return x.id === friendId; });
    if (!f) return;
    f.collections = collections;
    DataHub.set('friends', friends);
}

// 判断商品是否已被某好友收藏
function isProductCollectedByFriend(friendId, productId) {
    var list = getFriendCollections(friendId);
    return list.some(function(c) { return c.productId === productId; });
}

// 收藏商品
function collectProduct(friendId, productId) {
    if (!friendId || !productId) return false;
    if (isProductCollectedByFriend(friendId, productId)) {
        showToast('已收藏');
        return false;
    }
    var mall = getMallData();
    var product = mall.products.find(function(p) { return p.id === productId; });
    if (!product) return false;

    var productInfo = {
        id: product.id,
        name: product.name,
        price: product.price,
        image: product.image,
        imageType: product.imageType,
        description: product.description,
        category: product.category
    };

    var list = getFriendCollections(friendId);
    list.unshift({
        id: 'col' + Date.now() + Math.random().toString(36).substr(2, 4),
        productId: productId,
        productInfo: productInfo,
        collectedAt: Date.now(),
        collectedAtStr: getNowTimeStringFull()
    });
    setFriendCollections(friendId, list);
    showToast('已收藏');
    return true;
}

// 取消收藏
function uncollectProduct(friendId, productId) {
    if (!friendId || !productId) return false;
    var list = getFriendCollections(friendId);
    list = list.filter(function(c) { return c.productId !== productId; });
    setFriendCollections(friendId, list);
    showToast('已取消收藏');
    return true;
}

// 切换收藏状态
function toggleCollectProduct(friendId, productId) {
    if (isProductCollectedByFriend(friendId, productId)) {
        return uncollectProduct(friendId, productId);
    } else {
        return collectProduct(friendId, productId);
    }
}

// 统计某月收藏最多的商品（给月度统计用）
function calcMostCollectedInMonth(friendId, monthKey) {
    var list = getFriendCollections(friendId);
    if (!list || list.length === 0) return '';
    // 收藏没有时间精确到月也够用，这里用 collectedAtStr 过滤
    var count = {};
    for (var i = 0; i < list.length; i++) {
        var c = list[i];
        if (monthKey && c.collectedAtStr && c.collectedAtStr.indexOf(monthKey) !== 0) continue;
        var pname = c.productInfo ? c.productInfo.name : '';
        if (!pname) continue;
        count[pname] = (count[pname] || 0) + 1;
    }
    var maxKey = '';
    var maxVal = 0;
    for (var k in count) {
        if (count[k] > maxVal) {
            maxVal = count[k];
            maxKey = k;
        }
    }
    return maxKey;
}

function ensureFriendDailyRandomFlow(chatId) {
    if (!chatId) return;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var today = getTodayDateStr();
    var log = DataHub.get('friendDailyRandomLog', {});
    if (!log[chatId]) log[chatId] = {};
    if (log[chatId].date === today) return;

    var amount = Math.round((Math.random() * 2000 - 1000) * 100) / 100;
    if (amount === 0) amount = 0.01;

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var flow = {
        id: 'fl' + Date.now() + Math.random().toString(36).substr(2, 4),
        time: time,
        timestamp: Date.now(),
        amount: Math.abs(amount),
        direction: (amount >= 0) ? 'income' : 'expense',
        category: '每日随机收支',
        subCategory: '今日随机收支',
        fromAccount: '',
        toAccount: '',
        relatedFriendId: chatId,
        relatedProductId: '',
        note: '今日随机收支',
        status: 'done',
        forWhom: '',
        productInfo: null
    };

    var accountId = 'friend:' + chatId;
    var flows = getAccountFlows(accountId);
    flows.unshift(flow);
    setAccountFlows(accountId, flows);

    var balance = getAccountBalance(accountId);
    if (flow.direction === 'income') {
        balance = balance + flow.amount;
    } else {
        balance = balance - flow.amount;
    }
    setAccountBalance(accountId, balance);

    log[chatId] = { date: today, flowId: flow.id, amount: amount };
    DataHub.set('friendDailyRandomLog', log);
}

function getFriendDailyRandomFlow(chatId) {
    if (!chatId) return null;
    var log = DataHub.get('friendDailyRandomLog', {});
    var today = getTodayDateStr();
    if (!log[chatId] || log[chatId].date !== today) return null;
    return log[chatId];
}

function renderFriendTodayRandomFlow(chatId) {
    var record = getFriendDailyRandomFlow(chatId);
    if (!record) return '0.00元';
    var amount = record.amount || 0;
    var sign = (amount >= 0) ? '+' : '-';
    return sign + Math.abs(amount).toFixed(2) + '元';
}

function scheduleFriendShoppingDiaryReply(friendId, diaryId) {
    var pending = DataHub.get('friendShoppingDiaryPendingReplies', []);
    var now = Date.now();
    var needMs = Math.floor(Math.random() * (120 * 60 * 1000 - 5 * 60 * 1000 + 1)) + 5 * 60 * 1000;
    pending.push({
        id: 'fsdpr' + Date.now() + Math.random().toString(36).substr(2, 4),
        friendId: friendId,
        diaryId: diaryId,
        needMs: needMs,
        accumulatedMs: 0,
        lastTickAt: now,
        createdAt: now
    });
    DataHub.set('friendShoppingDiaryPendingReplies', pending);
}

function checkFriendShoppingDiaryPendingReplies() {
    var pending = DataHub.get('friendShoppingDiaryPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRenderFriendId = null;

    pending.forEach(function(p) {
        var elapsed = now - (p.lastTickAt || now);
        if (elapsed < 0) elapsed = 0;
        p.accumulatedMs = (p.accumulatedMs || 0) + elapsed;
        p.lastTickAt = now;

        if (p.accumulatedMs < p.needMs) {
            remaining.push(p);
            return;
        }
        var handled = handleFriendShoppingDiaryPendingReply(p);
        if (handled) needRenderFriendId = p.friendId;
    });

    DataHub.set('friendShoppingDiaryPendingReplies', remaining);

    if (needRenderFriendId) {
        var container = document.getElementById('accountTabContent');
        if (container && window._accountCurrentTab === 'shopping_diary') {
            container.innerHTML = renderFriendAccountTabContent('friend:' + needRenderFriendId, 'shopping_diary');
        }
    }
}

function handleFriendShoppingDiaryPendingReply(p) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === p.friendId; });
    if (!friend || !friend.shoppingDiary) return false;
    var item = friend.shoppingDiary.find(function(x) { return x.id === p.diaryId; });
    if (!item) return false;
    if (!item.replies) item.replies = [];

    var results = generateReplyContent(p.friendId);
    if (!results || results.length === 0) return false;
    if (results.length === 1 && results[0].skip) return false;

    var first = results[0];
    var text = '';
    if (first.text && first.text.indexOf('<img') === -1) {
        text = first.text;
    }
    if (!text) return false;

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var maxRound = 0;
    item.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    item.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        to: 'me',
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('friends', friends);
    showToast(friend.name + ' 回复了你的留言');
    return true;
}

var pending = DataHub.get('albumPendingReplies', []);
pending.push({

// ====== 检查并处理所有到期的相册异步回复 ======
function checkAlbumPendingReplies() {
    var pending = DataHub.get('albumPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRender = false;

    pending.forEach(function(p) {
        var accel = getFriendAcceleration(p.chatId);
        var elapsed = now - (p.lastTickAt || now);
        if (elapsed < 0) elapsed = 0;
        p.accumulatedMs = (p.accumulatedMs || 0) + elapsed * accel;
        p.lastTickAt = now;

        if (p.accumulatedMs < p.needMs) {
            remaining.push(p);
            return;
        }
        var handled = handleAlbumPendingReply(p);
        if (handled) needRender = true;
    });

    DataHub.set('albumPendingReplies', remaining);

    if (needRender) {
        if (albumViewState.chatId && document.getElementById('albumSubPage')) {
            renderAlbumContent();
        }
    }
}

function handleAlbumPendingReply(p) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === p.chatId; });
    if (!friend || !friend.privateAlbum) return false;
    var item = friend.privateAlbum.find(function(x) { return x.id === p.albumItemId; });
    if (!item) return false;

    var nowStr = getNowTimeString();

    if (p.type === 'message') {
        var replyText = generateAlbumFriendMessage(friend);
        if (!replyText) replyText = '嗯嗯';
        if (!item.messages) item.messages = [];
        item.messages.push({
            id: 'am' + genId(),
            from: 'friend',
            text: replyText,
            time: nowStr,
            unread: true
        });
        item.unread = true;
        DataHub.set('friends', friends);
        return true;
    }

    if (p.type === 'delete_first') {
        var agree = Math.random() < 0.5;
        if (agree) {
            item.status = 'deleted';
            var reason = generateAlbumFriendMessage(friend) || '那好吧听你的';
            if (!item.messages) item.messages = [];
            item.messages.push({
                id: 'am' + genId(),
                from: 'friend',
                text: reason,
                time: nowStr,
                unread: true
            });
            item.unread = true;
            item.deleteRequest = null;
        } else {
            item.status = 'rejected';
            var rejectMsg = generateAlbumFriendMessage(friend) || '我不，我喜欢我不删';
            if (!item.messages) item.messages = [];
            item.messages.push({
                id: 'am' + genId(),
                from: 'friend',
                text: rejectMsg,
                time: nowStr,
                unread: true
            });
            item.unread = true;
            item.deleteRequest = {
                stage: 'waiting_reason',
                requestedAt: Date.now(),
                replyAt: null
            };
        }
        DataHub.set('friends', friends);
        return true;
    }

    if (p.type === 'delete_final') {
        var agreeFinal = Math.random() < 0.5;
        if (agreeFinal) {
            item.status = 'deleted';
            var reasonFinal = generateAlbumFriendMessage(friend) || '那好吧听你的';
            if (!item.messages) item.messages = [];
            item.messages.push({
                id: 'am' + genId(),
                from: 'friend',
                text: reasonFinal,
                time: nowStr,
                unread: true
            });
            item.unread = true;
            item.deleteRequest = null;
        } else {
            item.status = 'normal';
            var rejectFinal = generateAlbumFriendMessage(friend) || '我不，我喜欢我不删';
            if (!item.messages) item.messages = [];
            item.messages.push({
                id: 'am' + genId(),
                from: 'friend',
                text: rejectFinal,
                time: nowStr,
                unread: true
            });
            item.unread = true;
            item.deleteRequest = null;
        }
        DataHub.set('friends', friends);
        return true;
    }

    return false;
}

function giveUpDeleteAlbumImage() {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === albumViewState.chatId; });
    if (!friend || !friend.privateAlbum) return;
    var item = friend.privateAlbum[albumViewState.currentIndex];
    if (!item) return;
    item.status = 'normal';
    item.deleteRequest = null;
    var pending = DataHub.get('albumPendingReplies', []);
    pending = pending.filter(function(p) {
        return !(p.chatId === albumViewState.chatId && p.albumItemId === item.id);
    });
    DataHub.set('albumPendingReplies', pending);
    DataHub.set('friends', friends);
    renderAlbumContent();
    showToast('已放弃删除');
}

var needMsFinal = randomAlbumReplyTime();

// ====== 获取私人词条数据 ======
function getPrivateLexiconData() {
    const friendId = privateLexiconState.currentFriendId;
    if (!friendId) return { groups: { word: ['默认'], emoji: ['默认'], yanwenzi: ['默认'], emoji_pack: ['默认'], pat: ['默认'], status: ['默认'], weather: ['默认'] }, items: [] };
    var allFriends = DataHub.get('friends', []);
    const friend = allFriends.find(function(f) { return f.id === friendId; });
    if (!friend) return { groups: { word: ['默认'], emoji: ['默认'], yanwenzi: ['默认'], emoji_pack: ['默认'], pat: ['默认'], status: ['默认'], weather: ['默认'] }, items: [] };
    if (!friend.privateLexicon) {
        friend.privateLexicon = {
            groups: {
                word: ['默认'],
                emoji: ['默认'],
                yanwenzi: ['默认'],
                emoji_pack: ['默认'],
                pat: ['默认'],
                status: ['默认'],
                weather: ['默认']
            },
            items: []
        };
        DataHub.set('friends', allFriends);
    }
    const types = ['word', 'emoji', 'yanwenzi', 'emoji_pack', 'pat', 'status', 'weather'];
    types.forEach(function(t) {
        if (!friend.privateLexicon.groups[t]) friend.privateLexicon.groups[t] = ['默认'];
    });
    return friend.privateLexicon;
}

function savePrivateLexiconData(data) {
    const friendId = privateLexiconState.currentFriendId;
    if (!friendId) return;
    var allFriends = DataHub.get('friends', []);
    const friend = allFriends.find(function(f) { return f.id === friendId; });
    if (!friend) return;
    friend.privateLexicon = data;
    DataHub.set('friends', allFriends);
}
// ====== 初始化私人词条库页面 ======
function initPrivateLexiconPage() {
    document.querySelectorAll('.private-lexicon-type-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.private-lexicon-type-btn').forEach(function(b) {
                b.style.background = 'var(--theme-lighter, #eef5ef)';
                b.style.color = '#888888';
            });
            this.style.background = 'var(--theme-main, #d4e9d6)';
            this.style.color = '#000000';
            privateLexiconState.currentType = this.dataset.type;
            privateLexiconState.currentGroup = '默认';
            privateLexiconState.selectMode = false;
            privateLexiconState.selectedIds = new Set();
            renderPrivateLexiconGroups();
            renderPrivateLexiconList();
        });
    });
    document.getElementById('privateLexiconSearchInput')?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            searchPrivateLexicon();
        }
    });
    renderPrivateLexiconGroups();
    renderPrivateLexiconList();
    updatePrivateTypeCounts();
}

// ====== 更新私人词条类型计数 ======
function updatePrivateTypeCounts() {
    const data = getPrivateLexiconData();
    document.querySelectorAll('.private-lexicon-type-btn').forEach(function(btn) {
        const type = btn.dataset.type;
        const count = data.items.filter(function(item) { return item.type === type; }).length;
        const countSpan = btn.querySelector('.type-count');
        if (countSpan) {
            countSpan.textContent = '（' + count + '）';
        }
    });
}

// ====== 切换私人词条拍一拍上锁状态 ======
function togglePrivateLexiconPatLock(itemId) {
    var data = getPrivateLexiconData();
    var item = data.items.find(function(it) { return it.id === itemId; });
    if (!item || item.type !== 'pat') return;
    item.locked = (item.locked === true) ? false : true;
    savePrivateLexiconData(data);
    renderPrivateLexiconList();
    showToast(item.locked ? '已上锁，仅我可用' : '已解锁');
}

// ====== 渲染私人词条列表 ======
function renderPrivateLexiconList() {
    const container = document.getElementById('privateLexiconItemList');
    if (!container) return;
    const data = getPrivateLexiconData();
    const type = privateLexiconState.currentType;
    const group = privateLexiconState.currentGroup;
    const keyword = privateLexiconState.searchKeyword.trim().toLowerCase();
    const allTypeItems = data.items.filter(function(item) { return item.type === type; });
    let items = allTypeItems.filter(function(item) { return item.group === group; });
    if (keyword) {
        items = items.filter(function(item) {
            const contentMatch = item.content && item.content.toLowerCase().includes(keyword);
            const groupMatch = item.group && item.group.toLowerCase().includes(keyword);
            return contentMatch || groupMatch;
        });
    }
    if (type === 'pat') {
    items.sort(function(a, b) {
        var la = a.locked === true ? 1 : 0;
        var lb = b.locked === true ? 1 : 0;
        if (la !== lb) return lb - la;
        return (b.createdAt || 0) - (a.createdAt || 0);
    });
} else {
    items.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
}
    const totalCount = items.length;

    document.querySelectorAll('.private-lexicon-type-btn').forEach(function(btn) {
        const btnType = btn.dataset.type;
        const count = data.items.filter(function(item) { return item.type === btnType; }).length;

        if (countSpan) {
            countSpan.textContent = '（' + count + '）';

function togglePrivateLexiconSelectAll() {
    const container = document.getElementById('privateLexiconItemList');

    if (checkboxes.length === 0) return;
    const btn = document.getElementById('privateLexiconSelectAllBtn');
    const isAllChecked = btn && btn.dataset.allChecked === 'true';

function deletePrivateLexiconSelected() {
    const count = privateLexiconState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的词条');
        return;
    }
    if (!confirm('确定删除选中的 ' + count + ' 个词条吗？')) return;
    const data = getPrivateLexiconData();
    data.items = data.items.filter(function(item) { return !privateLexiconState.selectedIds.has(item.id); });
    savePrivateLexiconData(data);
    privateLexiconState.selectedIds = new Set();
    exitPrivateLexiconSelectMode();
    renderPrivateLexiconGroups();
    renderPrivateLexiconList();
    updatePrivateTypeCounts();

function savePrivateLexiconBatch() {
    const input = document.getElementById('privateLexiconBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    const data = getPrivateLexiconData();
    const type = privateLexiconState.currentType;
    const group = privateLexiconState.currentGroup;
    let addedCount = 0;
    let skippedCount = 0;
    lines.forEach(function(line) {
        const exists = data.items.some(function(item) {
            return item.type === type && item.group === group && item.content === line;
        });
        if (exists) {
            skippedCount++;
            return;
        }
        data.items.push({
            id: 'pl' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: type,
            group: group,
            content: line,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    savePrivateLexiconData(data);
    closeModal();
    renderPrivateLexiconList();
    renderPrivateLexiconGroups();
    updatePrivateTypeCounts();
    let msg = '已添加 ' + addedCount + ' 条';
    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 条重复词条';
    showToast(msg);
}

function savePrivateLexiconImages() {
    const fileInput = document.getElementById('privateLexiconImageInput');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showToast('请选择图片');
        return;
    }
    const files = Array.from(fileInput.files);
    const data = getPrivateLexiconData();
    let loadedCount = 0;
    let skippedCount = 0;
    let totalProcessed = 0;
    files.forEach(async function(file) {
        try {
            const hash = await computeImageHash(file);
            const exists = data.items.some(function(item) {
                return item.type === 'emoji_pack' && item.hash === hash;
            });
            if (exists) {
                skippedCount++;
                loadedCount++;
                if (loadedCount === files.length) {
                    closeModal();
                    renderPrivateLexiconList();
                    let msg = '已上传 ' + totalProcessed + ' 张';
                    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                    showToast(msg);
                }
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 80, function(compressedBase64) {
                    data.items.push({
                        id: 'pl' + Date.now() + Math.random().toString(36).substr(2, 6),
                        type: 'emoji_pack',
                        group: privateLexiconState.currentGroup,
                        content: '',
                        images: [compressedBase64],
                        hash: hash,
                        createdAt: Date.now()
                    });
                    totalProcessed++;
                    loadedCount++;
                    if (loadedCount === files.length) {
                        savePrivateLexiconData(data);
                        closeModal();
                        renderPrivateLexiconList();
                        renderPrivateLexiconGroups();
                        updatePrivateTypeCounts();
                        let msg = '已上传 ' + totalProcessed + ' 张';
                        if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                        showToast(msg);
                    }
                });
            };
            reader.readAsDataURL(file);
        } catch (err) {
            console.error('处理图片失败:', err);
            loadedCount++;
            if (loadedCount === files.length) {
                closeModal();
                renderPrivateLexiconList();
                showToast('已上传 ' + totalProcessed + ' 张，' + skippedCount + ' 张跳过');
            }
        }
    });
}

function generateMomentForFriendById(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var allTextItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allTextItems.push(item.content);
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allTextItems.push(item.content);
            }
        });
    }

    var allImages = [];
    if (friend.privateAlbum && friend.privateAlbum.length > 0) {
        friend.privateAlbum.forEach(function(albumItem) {
            if (albumItem.status !== 'deleted' && albumItem.imageData) {
                allImages.push(albumItem.imageData);
            }
        });
    }

    var hasText = allTextItems.length > 0;
    var hasImage = allImages.length > 0;

    if (!hasText && !hasImage) return;

    var layout;
    if (hasText && hasImage) {
        layout = Math.floor(Math.random() * 4);
    } else if (hasText) {
        layout = 0;
    } else {
        layout = 1;
    }

    var textContent = '';
    var images = [];

    if (layout === 0 || layout === 2 || layout === 3) {
        var count = Math.floor(Math.random() * 19) + 3;
        var selected = [];
        for (var i = 0; i < count; i++) {
            selected.push(allTextItems[Math.floor(Math.random() * allTextItems.length)]);
        }
        for (var j = 0; j < selected.length; j++) {
            if (j > 0 && j % 3 === 0) {
                textContent += '\n';
            }
            textContent += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
        }
    }

    if (layout === 1 || layout === 2 || layout === 3) {
        var imgCount = Math.floor(Math.random() * 3) + 1;
        if (imgCount > allImages.length) imgCount = allImages.length;
        var shuffled = allImages.slice().sort(function() { return Math.random() - 0.5; });
        for (var k = 0; k < imgCount; k++) {
            images.push(shuffled[k]);
        }
    }

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (!friend.moments) friend.moments = [];
    friend.moments.unshift({
        id: 'm' + Date.now() + Math.random().toString(36).substr(2, 4),
        content: textContent,
        time: time,
        images: images,
        layout: layout,
        replies: [],
        unread: true
    });

    DataHub.set('friends', allFriends);
}

var friendMomentsViewState = {};

function renderFriendMomentsList(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return '';

    var moments = friend.moments || [];
    var state = friendMomentsViewState[chatId];
    if (!state) {
        state = { expandedYears: {}, expandedMonths: {}, replyTargets: {} };
        friendMomentsViewState[chatId] = state;
    }

    var groups = {};
    moments.forEach(function(m) {
        var ym = getMomentYearMonth(m.time);
        if (!groups[ym.year]) groups[ym.year] = {};
        if (!groups[ym.year][ym.month]) groups[ym.year][ym.month] = [];
        groups[ym.year][ym.month].push(m);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    var defaultExpandedYear = null;
    var defaultExpandedMonth = null;
    if (years.length > 0) {
        defaultExpandedYear = years[0];
        var months0 = Object.keys(groups[defaultExpandedYear]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        if (months0.length > 0) defaultExpandedMonth = months0[0];
    }

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === defaultExpandedYear);
        }
        var arrow = yearExpanded ? '▼' : '▶';
        html += '<div style="font-weight:600;padding:10px 0 6px 0;color:#000000;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleFriendMomentYear(\'' + chatId + '\',\'' + year + '\')">' +
            '<span>' + year + '</span>' +
            '<span style="font-size:12px;color:#999999;">' + arrow + '</span>' +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === defaultExpandedYear && month === defaultExpandedMonth);
            }
            var mArrow = monthExpanded ? '▼' : '▶';
            html += '<div style="font-weight:500;padding:6px 0 4px 20px;color:#333333;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleFriendMomentMonth(\'' + chatId + '\',\'' + year + '\',\'' + month + '\')">' +
                '<span>' + month + '</span>' +
                '<span style="font-size:12px;color:#999999;">' + mArrow + '</span>' +
            '</div>';

            if (!monthExpanded) return;

            groups[year][month].forEach(function(m) {
                html += '<div style="padding-left:32px;">' + renderFriendMomentCard(chatId, m) + '</div>';
            });
        });
    });

    if (!moments.length) {
        html += '<div style="padding:20px;text-align:center;color:#999999;">暂无朋友圈</div>';
    }
    return html;
}

var friendMomentLongPressState = {
    timer: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindFriendMomentReplyLongPress(chatId) {
    var container = document.getElementById('friendMomentsSubContent');
    if (!container) return;
    var replyEls = container.querySelectorAll('.friend-moment-reply[data-reply-id]');
    for (var i = 0; i < replyEls.length; i++) {
        (function(el) {
            var momentId = el.getAttribute('data-moment-id');
            var from = el.getAttribute('data-from');
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                friendMomentLongPressState.startX = p.clientX;
                friendMomentLongPressState.startY = p.clientY;
                friendMomentLongPressState.moved = false;
                clearTimeout(friendMomentLongPressState.timer);
                friendMomentLongPressState.timer = setTimeout(function() {
                    if (!friendMomentLongPressState.moved) {
                        if (!from || from === 'me') return;
                        setFriendMomentReplyTarget(chatId, momentId, from);
                    }
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - friendMomentLongPressState.startX) > 8 || Math.abs(p.clientY - friendMomentLongPressState.startY) > 8) {
                    friendMomentLongPressState.moved = true;
                    clearTimeout(friendMomentLongPressState.timer);
                }
            }
            function onEnd() {
                clearTimeout(friendMomentLongPressState.timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(replyEls[i]);
    }
}

function handleFriendMomentReply(chatId, momentId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var moment = friend.moments.find(function(m) { return m.id === momentId; });
    if (!moment) return;

    var results = generateReplyContent(chatId);
    if (!results || results.length === 0) return;
    if (results.length === 1 && results[0].skip) return;

    var first = results[0];
    var text = '';
    if (first.text && first.text.indexOf('<img') === -1) {
        text = first.text;
    }
    if (!text) return;

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (!moment.replies) moment.replies = [];
    var maxRound = 0;
    moment.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    moment.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),

function handleFriendDiaryPendingReply(p) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === p.chatId; });
    if (!friend) return false;
    var diary = getFriendDiaryByDate(friend, p.date);
    if (!diary) return false;
    if (!diary.replies) diary.replies = [];

    var results = generateReplyContent(p.chatId);
    if (!results || results.length === 0) return false;
    if (results.length === 1 && results[0].skip) return false;

    var first = results[0];
    var text = '';
    if (first.text && first.text.indexOf('<img') === -1) {
        text = first.text;
    }
    if (!text) return false;

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var maxRound = 0;
    diary.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    var target = null;
    if (p.type === 'reply') {
        for (var i = diary.replies.length - 1; i >= 0; i--) {
            if (diary.replies[i].from === 'me') {
                target = 'me';
                break;
            }
        }
    }

    diary.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        to: target,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('friends', allFriends);
    showToast(friend.name + ' 回复了你的日记');
    return true;
}

function generateFriendDiaryDaily() {
    var allFriends = DataHub.get('friends', []);
    var today = getTodayDateStr();
    var changed = false;
    for (var i = 0; i < allFriends.length; i++) {
        var friend = allFriends[i];
        if (!friend.diary) friend.diary = [];
        var existing = getFriendDiaryByDate(friend, today);
        if (existing) {
            // 已有日记（可能是购物日记），不覆盖
            continue;
        }
        var content = generateFriendDiaryContent(friend);
        if (!content) continue;
        var now = new Date();
        var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' 00:00:00';
        friend.diary.push({
            id: 'd' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: today,
            time: time,
            content: content,
            replies: [],
            unread: true
        });
        changed = true;
    }
    if (changed) DataHub.set('friends', allFriends);
}

function generateFriendDiaryContent(friend) {
    var sentences = [];

    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) sentences.push(item.content);
            }
        });
    }

    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) sentences.push(item.content);
            }
        });
    }

    if (isDictionaryEmpty && !isDictionaryEmpty()) {
        var dictSentence = generateDictionarySentence();
        if (dictSentence) sentences.push(dictSentence);
    }

    if (sentences.length === 0) return '';

    var count = Math.floor(Math.random() * 25) + 6;
    var selected = [];
    for (var i = 0; i < count; i++) {
        selected.push(sentences[Math.floor(Math.random() * sentences.length)]);
    }

    var content = '';
    for (var j = 0; j < selected.length; j++) {
        if (j > 0 && j % 3 === 0) {
            content += '\n';
        }
        content += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
    }
    return content;
}

function getTodayDateStr() {
    var now = new Date();
    return now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
}

function getDiaryDateFromTime(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ');
    if (parts.length < 1) return '';
    return parts[0];
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

function buildDateListFromStart(startDateStr, endDateStr) {
    var result = [];
    if (!startDateStr || !endDateStr) return result;
    var sp = startDateStr.split('.');
    var ep = endDateStr.split('.');
    if (sp.length < 3 || ep.length < 3) return result;
    var start = new Date(parseInt(sp[0]), parseInt(sp[1]) - 1, parseInt(sp[2]));
    var end = new Date(parseInt(ep[0]), parseInt(ep[1]) - 1, parseInt(ep[2]));
    if (start > end) return result;
    var cur = new Date(start.getTime());
    while (cur <= end) {
        result.push(cur.getFullYear() + '.' + pad2(cur.getMonth()+1) + '.' + pad2(cur.getDate()));
        cur.setDate(cur.getDate() + 1);
    }
    return result;
}

function getFriendDiaryDateSet(friend) {
    var set = {};
    if (!friend || !friend.diary) return set;
    for (var i = 0; i < friend.diary.length; i++) {
        var d = friend.diary[i];
        if (!d) continue;
        var date = d.date || getDiaryDateFromTime(d.time);
        if (date) set[date] = true;
    }
    return set;
}

function getFriendDiaryByDate(friend, date) {
    if (!friend || !friend.diary || !date) return null;
    for (var i = 0; i < friend.diary.length; i++) {
        var d = friend.diary[i];
        if (!d) continue;
        var dd = d.date || getDiaryDateFromTime(d.time);
        if (dd === date) return d;
    }
    return null;
}

function bindFriendDiaryReplyLongPress(chatId) {
    var content = document.getElementById('friendDiaryContent');
    if (!content) return;
    var els = content.querySelectorAll('.friend-diary-reply[data-reply-id]');
    for (var i = 0; i < els.length; i++) {
        (function(el) {
            var date = el.getAttribute('data-date');
            var from = el.getAttribute('data-from');
            var timer = null;
            var startX = 0, startY = 0, moved = false;
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                startX = p.clientX;
                startY = p.clientY;
                moved = false;
                clearTimeout(timer);
                timer = setTimeout(function() {
                    if (moved) return;
                    if (!from || from === 'me') return;
                    openFriendDiaryReplyInput(chatId, date, from);
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - startX) > 8 || Math.abs(p.clientY - startY) > 8) {
                    moved = true;
                    clearTimeout(timer);
                }
            }
            function onEnd() {
                clearTimeout(timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(els[i]);
    }
}

function renderFriendDiaryDateList(chatId) {
    var friend = DataHub.get('friends', []).find(function(f) { return f.id === chatId; });
    if (!friend) return '';

    var state = friendDiaryViewState[chatId];
    if (!state) return '';

    var firstOpenDate = DataHub.get('firstOpenDate', null);
    if (!firstOpenDate) {
        firstOpenDate = getTodayDateStr();
    }
    var today = getTodayDateStr();
    var allDates = buildDateListFromStart(firstOpenDate, today);
    if (allDates.length === 0) return '';

    allDates.reverse();

    var dateSet = getFriendDiaryDateSet(friend);

    var groups = {};
    allDates.forEach(function(d) {
        var p = d.split('.');
        if (p.length < 3) return;
        var y = p[0];
        var m = p[1];
        if (!groups[y]) groups[y] = {};
        if (!groups[y][m]) groups[y][m] = [];
        groups[y][m].push(d);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    if (years.length === 0) return '';

    var todayParts = today.split('.');
    var curYear = todayParts[0];
    var curMonth = todayParts[1];

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === curYear);
        }
        var arrow = yearExpanded ? 'v' : '>';
        html += '<div style="font-size:10px;font-weight:600;color:#000000;padding:4px 4px;cursor:pointer;white-space:nowrap;" onclick="toggleFriendDiaryYear(\'' + chatId + '\',\'' + year + '\')">' +
            year + ' ' + arrow +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === curYear && month === curMonth);
            }
            var mArrow = monthExpanded ? 'v' : '>';
            html += '<div style="font-size:10px;color:#000000;padding:3px 4px 3px 8px;cursor:pointer;white-space:nowrap;" onclick="toggleFriendDiaryMonth(\'' + chatId + '\',\'' + year + '\',\'' + month + '\')">' +
                parseInt(month) + '月 ' + mArrow +
            '</div>';

            if (!monthExpanded) return;

            groups[year][month].forEach(function(d) {
                var hasDiary = dateSet[d] === true;
                var color = hasDiary ? '#000000' : '#bbbbbb';
                var selected = (state.selectedDate === d);
                var bg = selected ? 'background:#eef5ef;' : '';
                var shortDate = d.split('.')[2];
                html += '<div onclick="selectFriendDiaryDate(\'' + chatId + '\',\'' + d + '\')" style="font-size:9px;color:' + color + ';padding:3px 4px 3px 14px;cursor:pointer;white-space:nowrap;' + bg + '">' +
                    shortDate +
                '</div>';
            });
        });
    });

    return html;
}

function markFriendDiaryRead(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.diary) return;
    var changed = false;
    for (var i = 0; i < friend.diary.length; i++) {
        if (friend.diary[i] && friend.diary[i].unread === true) {
            friend.diary[i].unread = false;
            changed = true;
        }
    }
    if (changed) DataHub.set('friends', allFriends);
}
function sendFriendDiaryMessage(chatId, date) {
    var input = document.getElementById('friendDiaryMsgInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    var text = input.value.trim();

    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var diary = getFriendDiaryByDate(friend, date);
    if (!diary) {
        diary = {
            id: 'd' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: date,
            time: date + ' 00:00:00',
            content: '',
            replies: []
        };
        if (!friend.diary) friend.diary = [];
        friend.diary.push(diary);
    }
    if (!diary.replies) diary.replies = [];

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var target = null;
    if (friendDiaryViewState[chatId] && friendDiaryViewState[chatId].replyTargets) {
        target = friendDiaryViewState[chatId].replyTargets[date] || null;
    }

    var maxRound = 0;
    diary.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    diary.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: 'me',
        to: target || null,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('friends', allFriends);

    input.value = '';
    input.placeholder = '留言...';
    if (friendDiaryViewState[chatId] && friendDiaryViewState[chatId].replyTargets) {
        friendDiaryViewState[chatId].replyTargets[date] = null;
    }
    reloadFriendDiaryContent(chatId);
    showToast('已发送');

    scheduleFriendDiaryReplyAsync(chatId, date);
}

function deleteMyFriendDiaryReply(chatId, date, replyId) {
    if (!chatId || !date || !replyId) return;
    if (!confirm('确定删除这条留言吗？')) return;
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    var diary = getFriendDiaryByDate(friend, date);
    if (!diary || !diary.replies) return;
    diary.replies = diary.replies.filter(function(r) {
        return !(r.id === replyId && r.from === 'me');
    });
    DataHub.set('friends', allFriends);
    reloadFriendDiaryContent(chatId);
    showToast('已删除');
}

function hasLetterUnread(chatId) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return false;
    var hisReply = friend.letters.hisReply || [];
    var fromHim = friend.letters.fromHim || [];
    for (var i = 0; i < hisReply.length; i++) {
        if (hisReply[i].unread) return true;
    }
    for (var j = 0; j < fromHim.length; j++) {
        if (fromHim[j].unread) return true;
    }
    return false;
}

// ====== 信封：格式化预计回信时间 ======
function formatLetterReplyTime(replyAtMs) {
    var d = new Date(replyAtMs);
    return d.getFullYear() + '/' + pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + ' ' +
        pad2(d.getHours()) + '：' + pad2(d.getMinutes()) + '：' + pad2(d.getSeconds());
}

function formatLetterDuration(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    return h + '小时' + m + '分' + s + '秒';
}

// ====== 信封：卡片事件绑定 ======
var letterLongPressState = {
    timer: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindLetterCardEvents() {
    var container = document.getElementById('letterContent');
    if (!container) return;
    var cards = container.querySelectorAll('.letter-card');
    for (var i = 0; i < cards.length; i++) {
        (function(card) {
            var id = card.getAttribute('data-id');
            if (letterViewState.selectMode) {
                var cb = card.querySelector('.letter-select-checkbox');
                if (cb) {
                    cb.addEventListener('change', function(e) {
                        e.stopPropagation();
                        if (this.checked) letterViewState.selectedIds.add(id);
                        else letterViewState.selectedIds.delete(id);
                        updateLetterSelectBar();
                    });
                }
                card.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'INPUT' && !e.target.closest('.letter-quote-jump')) {
                        var checkbox = this.querySelector('.letter-select-checkbox');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            checkbox.dispatchEvent(new Event('change'));
                        }
                    }
                });
            } else {
    var quoteJump = card.querySelector('.letter-quote-jump');
    if (quoteJump) {
        quoteJump.addEventListener('click', function(e) {
            e.stopPropagation();
            var qid = this.getAttribute('data-quoteid');
            if (qid) jumpToOriginalLetter(qid);
        });
    }
    var replyBtn = card.querySelector('.letter-reply-btn');
    if (replyBtn) {
        replyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openLetterReplyCompose(letterViewState.chatId, this.getAttribute('data-id'));
        });
    }
                function onStart(e) {
                    var p = e.touches ? e.touches[0] : e;
                    letterLongPressState.startX = p.clientX;
                    letterLongPressState.startY = p.clientY;
                    letterLongPressState.moved = false;
                    clearTimeout(letterLongPressState.timer);
                    letterLongPressState.timer = setTimeout(function() {
                        if (!letterLongPressState.moved) {
                            enterLetterSelectMode();
                        }
                    }, 500);
                }
                function onMove(e) {
                    var p = e.touches ? e.touches[0] : e;
                    if (Math.abs(p.clientX - letterLongPressState.startX) > 8 || Math.abs(p.clientY - letterLongPressState.startY) > 8) {
                        letterLongPressState.moved = true;
                        clearTimeout(letterLongPressState.timer);
                    }
                }
                function onEnd() {
                    clearTimeout(letterLongPressState.timer);
                }
                card.addEventListener('touchstart', onStart, { passive: true });
                card.addEventListener('touchmove', onMove, { passive: true });
                card.addEventListener('touchend', onEnd);
                card.addEventListener('mousedown', onStart);
                card.addEventListener('mousemove', onMove);
                card.addEventListener('mouseup', onEnd);
                card.addEventListener('mouseleave', onEnd);
            }
        })(cards[i]);
    }
}

// ====== 信封：跳转原信 ======
function jumpToOriginalLetter(letterId) {
    var chatId = letterViewState.chatId;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return;
    var tabs = ['toHim', 'hisReply', 'fromHim', 'myReply'];
    var foundTab = null;
    for (var i = 0; i < tabs.length; i++) {
        var list = friend.letters[tabs[i]] || [];
        for (var j = 0; j < list.length; j++) {
            if (list[j].id === letterId) { foundTab = tabs[i]; break; }
        }
        if (foundTab) break;
    }
    if (!foundTab) {
        showToast('原信已删除');
        return;
    }
    switchLetterTab(foundTab, letterId);
}

function switchLetterTab(tab, highlightId) {
    letterViewState.currentTab = tab;
    letterViewState.selectMode = false;
    letterViewState.selectedIds = new Set();
    document.querySelectorAll('.letter-tab-btn').forEach(function(b) {
        if (b.dataset.tab === tab) {
            b.style.background = 'var(--theme-main, #d4e9d6)';
            b.style.color = '#000000';
        } else {
            b.style.background = 'var(--theme-lighter, #eef5ef)';
            b.style.color = '#888888';
        }
    });
    markLetterTabRead(tab);
    renderLetterList();
    hideLetterSelectBar();
    if (highlightId) {
        setTimeout(function() {
            var card = document.querySelector('.letter-card[data-id="' + highlightId + '"]');
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.transition = 'background 0.3s';
                var oldBg = card.style.background;
                card.style.background = '#fff3c0';
                setTimeout(function() { card.style.background = oldBg; }, 800);
            }
        }, 100);
    }
}

function deleteLetterSelected() {
    var count = letterViewState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的信件');
        return;
    }
    if (!confirm('确定删除选中的 ' + count + ' 封信吗？')) return;
    var chatId = letterViewState.chatId;
    var tab = letterViewState.currentTab;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return;
    var list = friend.letters[tab] || [];

}

// ====== 信封：好友主动来信（1 小时刷，参考朋友圈概率） ======
function generateLetterFromHimOnAppUse() {
    var allFriends = DataHub.get('friends', []);
    if (allFriends.length === 0) return;
    var changed = false;
    for (var i = 0; i < allFriends.length; i++) {
        var friend = allFriends[i];
        if (Math.random() * 100 <= 30) {
            if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
            if (!friend.letters.fromHim) friend.letters.fromHim = [];

// ====== 信封：生成好友来信内容（词条库 + 词典拼句，空则兜底） ======
function generateLetterContent(friend) {
    var allItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }
    if (friend && friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }

    if (allItems.length > 0) {
        var count = Math.floor(Math.random() * 22) + 9;
        var selected = [];
        for (var i = 0; i < count; i++) {
            selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
        }
        var content = '';
        for (var j = 0; j < selected.length; j++) {
            if (j > 0 && j % 3 === 0) content += '\n';
            content += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
        }
        return content;
    }

    if (!isDictionaryEmpty()) {
        var dictSentence = generateDictionarySentence();
        if (dictSentence) return dictSentence;
    }

    return '收到你的信了';
}

function scheduleLetterReply(chatId, letterId, replyAt) {
    var pending = DataHub.get('letterPendingReplies', []);
    pending.push({
        id: 'lpr' + genId(),
        chatId: chatId,
        letterId: letterId,
        replyAt: replyAt,
        createdAt: Date.now()
    });
    DataHub.set('letterPendingReplies', pending);
}

// ====== 信封：检查到期的回信 ======
function checkLetterPendingReplies() {
    var pending = DataHub.get('letterPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRenderChatId = null;
    var needRenderTab = null;

    for (var i = 0; i < pending.length; i++) {
        var p = pending[i];
        if (now >= p.replyAt) {
            var ok = handleLetterPendingReply(p);
            if (ok) {
                needRenderChatId = p.chatId;
                needRenderTab = 'hisReply';
            }
        } else {
            remaining.push(p);
        }
    }

    DataHub.set('letterPendingReplies', remaining);

    if (needRenderChatId && letterViewState.chatId === needRenderChatId) {
        renderLetterList();
    }
}

// ====== 信封：执行回信 ======
function handleLetterPendingReply(p) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === p.chatId; });
    if (!friend) return false;
    if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
    if (!friend.letters.toHim) friend.letters.toHim = [];
    if (!friend.letters.hisReply) friend.letters.hisReply = [];

    var toHimItem = null;
    for (var i = 0; i < friend.letters.toHim.length; i++) {
        if (friend.letters.toHim[i].id === p.letterId) {
            toHimItem = friend.letters.toHim[i];
            break;
        }
    }
    if (!toHimItem) return false;
    if (toHimItem.replied) return false;

    var content = generateLetterContent(friend);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var replyId = 'lr' + genId();
    friend.letters.hisReply.push({
        id: replyId,
        content: content,
        time: time,
        replyToId: p.letterId,
        unread: true
    });

    toHimItem.replied = true;
    toHimItem.replyId = replyId;

    DataHub.set('friends', allFriends);
    showToast(friend.name + ' 回信了');
    return true;
}

function getGroupMembers(groupName) {
    return DataHub.get('friends', []).filter(f => f.group === groupName);
}
function renderContacts() {
    const container = document.getElementById('contactContent');
    if (!container) return;
    const activeTab = document.querySelector('#contactTabs .active')?.dataset.tab || 'groups';
    let html = '';
    if (activeTab === 'groups') {
        const groups = DataHub.get('groups', ['好友', '亲人', '爱人', '未分组']);
        html = '<button class="add-group-btn" onclick="showAddGroup()">+ 新建分组</button>';
        groups.forEach(g => {
            const members = getGroupMembers(g);
            const count = members.length;
            const isUngrouped = (g === '未分组');
            const expanded = window._expandedGroups && window._expandedGroups[g];
            const toggleIcon = expanded ? '▼' : '▶';
            let memberHtml = '';
            if (expanded) {
                if (members.length === 0) {
                    memberHtml = '<div class="group-expand-content"><div class="empty-members">暂无好友</div></div>';
                } else {
                    memberHtml = '<div class="group-expand-content">' +
                        members.map(f => '<div class="group-member">' + f.name + '</div>').join('') +
                        '</div>';
                }
            }
            const delBtnHtml = isUngrouped ? '' : '<span class="group-del-btn" onclick="deleteGroup(\'' + g + '\')">×</span>';
            html += '<div class="contact-item" style="flex-wrap:wrap;">' +
                '<div style="display:flex;align-items:center;width:100%;">' +
                    '<span class="group-toggle" onclick="toggleGroup(\'' + g + '\')">' + toggleIcon + '</span>' +
                    '<div class="group-info" onclick="toggleGroup(\'' + g + '\')">' +
                        '<div class="name">' + g + ' <span class="sub">（' + count + '人）</span></div>' +
                    '</div>' +
                    delBtnHtml +
                '</div>' +
                memberHtml +
            '</div>';
        });
    } else if (activeTab === 'friends') {
        const friends = DataHub.get('friends', []);
        html = friends.map(f => {
            const avatarContent = f.avatar && f.avatar.startsWith('data:image') ? '<img src="' + f.avatar + '">' : getInitials(f.name);
            return '<div class="contact-item">' +
                '<div class="avatar-small" onclick="editFriendAvatar(\'' + f.id + '\')">' + avatarContent + '</div>' +
                '<div class="info" onclick="editFriendName(\'' + f.id + '\')"><div class="name">' + f.name + '</div><div class="sub">' + (f.group||'未分组') + '</div></div>' +
                '<span class="del-btn" onclick="deleteFriend(\'' + f.id + '\')">×</span>' +
            '</div>';
        }).join('');
        if (!html) html = '<div style="padding:20px;text-align:center;color:#999999;">暂无好友，点击顶部+添加</div>';
    } else if (activeTab === 'chatrooms') {
        const rooms = DataHub.get('chatrooms', []);
        html = rooms.map(r => {
            const members = r.members || [];
            const count = members.length + 1;
            const avatarContent = r.avatar && r.avatar.startsWith('data:image') ? '<img src="' + r.avatar + '">' : '群';
            return '<div class="contact-item">' +
                '<div class="avatar-small" onclick="editRoomAvatar(\'' + r.id + '\')">' + avatarContent + '</div>' +
                '<div class="info" onclick="editRoomName(\'' + r.id + '\')"><div class="name">' + r.name + '</div><div class="sub">' + count + '人</div></div>' +
                '<span class="del-btn" onclick="deleteChatroom(\'' + r.id + '\')">×</span>' +
            '</div>';
        }).join('');
        if (!html) html = '<div style="padding:20px;text-align:center;color:#999999;">暂无群聊，点击顶部+创建</div>';
    }
    container.innerHTML = html;
}

window.toggleGroup = function(groupName) {
    if (!window._expandedGroups) window._expandedGroups = {};

window.saveNewGroup = function() {
    const input = document.getElementById('newGroupInput');
    if (input && input.value.trim()) {
        const name = input.value.trim();
        var groups = DataHub.get('groups', ['好友', '亲人', '爱人', '未分组']);
        if (groups.includes(name)) {

            return;
        }

        closeModal();
        renderContacts();

    }
