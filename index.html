    const allTypeItems = data.items.filter(function(item) { return item.type === type; });
    let items = allTypeItems.filter(function(item) { return item.group === group; });
    if (keyword) {
        items = items.filter(function(item) {
            const contentMatch = item.content && item.content.toLowerCase().includes(keyword);
            const groupMatch = item.group && item.group.toLowerCase().includes(keyword);
            return contentMatch || groupMatch;
        });
    }
    if (type === 'pat') {
    items.sort(function(a, b) {
        var la = a.locked === true ? 1 : 0;
        var lb = b.locked === true ? 1 : 0;
        if (la !== lb) return lb - la;
        return (b.createdAt || 0) - (a.createdAt || 0);
    });
} else {
    items.sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
}

function exitPrivateLexiconSelectMode() {

function togglePrivateLexiconSelectAll() {
    const container = document.getElementById('privateLexiconItemList');
    if (!container) return;
    const checkboxes = container.querySelectorAll('.private-lexicon-select-checkbox');
    if (checkboxes.length === 0) return;
    const btn = document.getElementById('privateLexiconSelectAllBtn');
    const isAllChecked = btn && btn.dataset.allChecked === 'true';
    if (isAllChecked) {
        privateLexiconState.selectedIds = new Set();
    } else {
        checkboxes.forEach(function(cb) {
            privateLexiconState.selectedIds.add(cb.dataset.id);
        });
    }
    renderPrivateLexiconList();
}

function deletePrivateLexiconSelected() {
    const count = privateLexiconState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的词条');
        return;
    }
    if (!confirm('确定删除选中的 ' + count + ' 个词条吗？')) return;
    const data = getPrivateLexiconData();
    data.items = data.items.filter(function(item) { return !privateLexiconState.selectedIds.has(item.id); });
    savePrivateLexiconData(data);
    privateLexiconState.selectedIds = new Set();
    exitPrivateLexiconSelectMode();
    renderPrivateLexiconGroups();
    renderPrivateLexiconList();
    updatePrivateTypeCounts();
    showToast('已删除 ' + count + ' 个词条');
}

function savePrivateLexiconBatch() {
    const input = document.getElementById('privateLexiconBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    const data = getPrivateLexiconData();
    const type = privateLexiconState.currentType;
    const group = privateLexiconState.currentGroup;
    let addedCount = 0;
    let skippedCount = 0;
    lines.forEach(function(line) {
        const exists = data.items.some(function(item) {
            return item.type === type && item.group === group && item.content === line;
        });
        if (exists) {
            skippedCount++;
            return;
        }
        data.items.push({
            id: 'pl' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: type,
            group: group,
            content: line,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    savePrivateLexiconData(data);
    closeModal();
    renderPrivateLexiconList();
    renderPrivateLexiconGroups();
    updatePrivateTypeCounts();
    let msg = '已添加 ' + addedCount + ' 条';
    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 条重复词条';
    showToast(msg);
}

function savePrivateLexiconImages() {
    const fileInput = document.getElementById('privateLexiconImageInput');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showToast('请选择图片');
        return;
    }
    const files = Array.from(fileInput.files);
    const data = getPrivateLexiconData();
    let loadedCount = 0;
    let skippedCount = 0;
    let totalProcessed = 0;
    files.forEach(async function(file) {
        try {
            const hash = await computeImageHash(file);
            const exists = data.items.some(function(item) {
                return item.type === 'emoji_pack' && item.hash === hash;
            });
            if (exists) {
                skippedCount++;
                loadedCount++;
                if (loadedCount === files.length) {
                    closeModal();
                    renderPrivateLexiconList();
                    let msg = '已上传 ' + totalProcessed + ' 张';
                    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                    showToast(msg);
                }
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 80, function(compressedBase64) {
                    data.items.push({
                        id: 'pl' + Date.now() + Math.random().toString(36).substr(2, 6),
                        type: 'emoji_pack',
                        group: privateLexiconState.currentGroup,
                        content: '',
                        images: [compressedBase64],
                        hash: hash,
                        createdAt: Date.now()
                    });
                    totalProcessed++;
                    loadedCount++;
                    if (loadedCount === files.length) {
                        savePrivateLexiconData(data);
                        closeModal();
                        renderPrivateLexiconList();
                        renderPrivateLexiconGroups();
                        updatePrivateTypeCounts();
                        let msg = '已上传 ' + totalProcessed + ' 张';
                        if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                        showToast(msg);
                    }
                });
            };
            reader.readAsDataURL(file);
        } catch (err) {
            console.error('处理图片失败:', err);
            loadedCount++;
            if (loadedCount === files.length) {
                closeModal();
                renderPrivateLexiconList();
                showToast('已上传 ' + totalProcessed + ' 张，' + skippedCount + ' 张跳过');
            }
        }
    });
}

function generateMomentForFriendById(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var allTextItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allTextItems.push(item.content);
            }
        });
    }
    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allTextItems.push(item.content);
            }
        });
    }

    var allImages = [];
    if (friend.privateAlbum && friend.privateAlbum.length > 0) {
        friend.privateAlbum.forEach(function(albumItem) {
            if (albumItem.status !== 'deleted' && albumItem.imageData) {
                allImages.push(albumItem.imageData);
            }
        });
    }

    var hasText = allTextItems.length > 0;
    var hasImage = allImages.length > 0;

    if (!hasText && !hasImage) return;

    var layout;
    if (hasText && hasImage) {
        layout = Math.floor(Math.random() * 4);
    } else if (hasText) {
        layout = 0;
    } else {
        layout = 1;
    }

    var textContent = '';
    var images = [];

    if (layout === 0 || layout === 2 || layout === 3) {
        var count = Math.floor(Math.random() * 19) + 3;
        var selected = [];
        for (var i = 0; i < count; i++) {
            selected.push(allTextItems[Math.floor(Math.random() * allTextItems.length)]);
        }
        for (var j = 0; j < selected.length; j++) {
            if (j > 0 && j % 3 === 0) {
                textContent += '\n';
            }
            textContent += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
        }
    }

    if (layout === 1 || layout === 2 || layout === 3) {
        var imgCount = Math.floor(Math.random() * 3) + 1;
        if (imgCount > allImages.length) imgCount = allImages.length;
        var shuffled = allImages.slice().sort(function() { return Math.random() - 0.5; });
        for (var k = 0; k < imgCount; k++) {
            images.push(shuffled[k]);
        }
    }

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (!friend.moments) friend.moments = [];
    friend.moments.unshift({
        id: 'm' + Date.now() + Math.random().toString(36).substr(2, 4),
        content: textContent,
        time: time,
        images: images,
        layout: layout,
        replies: [],
        unread: true
    });

    DataHub.set('friends', allFriends);
}

var friendMomentsViewState = {};

function renderFriendMomentsList(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return '';

    var moments = friend.moments || [];
    var state = friendMomentsViewState[chatId];
    if (!state) {
        state = { expandedYears: {}, expandedMonths: {}, replyTargets: {} };
        friendMomentsViewState[chatId] = state;
    }

    var groups = {};
    moments.forEach(function(m) {
        var ym = getMomentYearMonth(m.time);
        if (!groups[ym.year]) groups[ym.year] = {};
        if (!groups[ym.year][ym.month]) groups[ym.year][ym.month] = [];
        groups[ym.year][ym.month].push(m);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    var defaultExpandedYear = null;
    var defaultExpandedMonth = null;
    if (years.length > 0) {
        defaultExpandedYear = years[0];
        var months0 = Object.keys(groups[defaultExpandedYear]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        if (months0.length > 0) defaultExpandedMonth = months0[0];
    }

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === defaultExpandedYear);
        }
        var arrow = yearExpanded ? '▼' : '▶';
        html += '<div style="font-weight:600;padding:10px 0 6px 0;color:#000000;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleFriendMomentYear(\'' + chatId + '\',\'' + year + '\')">' +
            '<span>' + year + '</span>' +
            '<span style="font-size:12px;color:#999999;">' + arrow + '</span>' +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === defaultExpandedYear && month === defaultExpandedMonth);
            }
            var mArrow = monthExpanded ? '▼' : '▶';
            html += '<div style="font-weight:500;padding:6px 0 4px 20px;color:#333333;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleFriendMomentMonth(\'' + chatId + '\',\'' + year + '\',\'' + month + '\')">' +
                '<span>' + month + '</span>' +
                '<span style="font-size:12px;color:#999999;">' + mArrow + '</span>' +
            '</div>';

            if (!monthExpanded) return;

            groups[year][month].forEach(function(m) {
                html += '<div style="padding-left:32px;">' + renderFriendMomentCard(chatId, m) + '</div>';
            });
        });
    });

    if (!moments.length) {
        html += '<div style="padding:20px;text-align:center;color:#999999;">暂无朋友圈</div>';
    }
    return html;
}

var friendMomentLongPressState = {
    timer: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindFriendMomentReplyLongPress(chatId) {
    var container = document.getElementById('friendMomentsSubContent');
    if (!container) return;
    var replyEls = container.querySelectorAll('.friend-moment-reply[data-reply-id]');
    for (var i = 0; i < replyEls.length; i++) {
        (function(el) {
            var momentId = el.getAttribute('data-moment-id');
            var from = el.getAttribute('data-from');
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                friendMomentLongPressState.startX = p.clientX;
                friendMomentLongPressState.startY = p.clientY;
                friendMomentLongPressState.moved = false;
                clearTimeout(friendMomentLongPressState.timer);
                friendMomentLongPressState.timer = setTimeout(function() {
                    if (!friendMomentLongPressState.moved) {
                        if (!from || from === 'me') return;
                        setFriendMomentReplyTarget(chatId, momentId, from);
                    }
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - friendMomentLongPressState.startX) > 8 || Math.abs(p.clientY - friendMomentLongPressState.startY) > 8) {
                    friendMomentLongPressState.moved = true;
                    clearTimeout(friendMomentLongPressState.timer);
                }
            }
            function onEnd() {
                clearTimeout(friendMomentLongPressState.timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(replyEls[i]);
    }
}

        return;

        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),

function handleFriendMomentReply(chatId, momentId) {

    if (!friend) return;

    if (!moment.replies) moment.replies = [];
    var maxRound = 0;
    moment.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    moment.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        to: 'me',
        text: text,
        time: time,

function scheduleFriendMomentReplyAsync(chatId, momentId) {
    var pending = DataHub.get('friendMomentPendingReplies', []);
    var now = Date.now();
    var needMs = Math.floor(Math.random() * (120 * 60 * 1000 - 5 * 60 * 1000 + 1)) + 5 * 60 * 1000;
    pending.push({
        id: 'fmpr' + Date.now() + Math.random().toString(36).substr(2, 4),
        chatId: chatId,
        momentId: momentId,
        needMs: needMs,
        accumulatedMs: 0,
        lastTickAt: now,
        createdAt: now
    });
    DataHub.set('friendMomentPendingReplies', pending);
}

function checkFriendMomentPendingReplies() {
    var pending = DataHub.get('friendMomentPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRenderChatId = null;

    pending.forEach(function(p) {
        var elapsed = now - (p.lastTickAt || now);
        if (elapsed < 0) elapsed = 0;
        p.accumulatedMs = (p.accumulatedMs || 0) + elapsed;
        p.lastTickAt = now;

        if (p.accumulatedMs < p.needMs) {
            remaining.push(p);
            return;
        }
        handleFriendMomentReply(p.chatId, p.momentId);
        needRenderChatId = p.chatId;
    });

    DataHub.set('friendMomentPendingReplies', remaining);

    if (needRenderChatId) {
        var container = document.getElementById('friendMomentsSubContent');
        if (container) {
            container.innerHTML = renderFriendMomentsList(needRenderChatId);
            bindFriendMomentReplyLongPress(needRenderChatId);
        }
    }
}

function checkFriendDiaryPendingReplies() {

    var needReloadChatId = null;

function handleFriendDiaryPendingReply(p) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === p.chatId; });
    if (!friend) return false;
    var diary = getFriendDiaryByDate(friend, p.date);
    if (!diary) return false;
    if (!diary.replies) diary.replies = [];

    var results = generateReplyContent(p.chatId);
    if (!results || results.length === 0) return false;
    if (results.length === 1 && results[0].skip) return false;

    var first = results[0];
    var text = '';
    if (first.text && first.text.indexOf('<img') === -1) {
        text = first.text;
    }
    if (!text) return false;

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var maxRound = 0;
    diary.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    var target = null;
    if (p.type === 'reply') {
        for (var i = diary.replies.length - 1; i >= 0; i--) {
            if (diary.replies[i].from === 'me') {
                target = 'me';
                break;
            }
        }
    }

    diary.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        to: target,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('friends', allFriends);
    showToast(friend.name + ' 回复了你的日记');
    return true;
}

function generateFriendDiaryDaily() {
    var allFriends = DataHub.get('friends', []);
    var today = getTodayDateStr();
    var changed = false;
    for (var i = 0; i < allFriends.length; i++) {
        var friend = allFriends[i];

        var existing = getFriendDiaryByDate(friend, today);

        friend.diary.push({

            date: today,
            time: time,
            content: content,
            replies: [],
            unread: true
        });
        changed = true;
    }
    if (changed) DataHub.set('friends', allFriends);
}

function generateFriendDiaryContent(friend) {
    var sentences = [];

    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) sentences.push(item.content);
            }
        });
    }

    if (friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) sentences.push(item.content);
            }
        });
    }

    if (isDictionaryEmpty && !isDictionaryEmpty()) {
        var dictSentence = generateDictionarySentence();
        if (dictSentence) sentences.push(dictSentence);
    }

    if (sentences.length === 0) return '';

    var count = Math.floor(Math.random() * 25) + 6;
    var selected = [];
    for (var i = 0; i < count; i++) {
        selected.push(sentences[Math.floor(Math.random() * sentences.length)]);
    }

    var content = '';
    for (var j = 0; j < selected.length; j++) {
        if (j > 0 && j % 3 === 0) {
            content += '\n';
        }
        content += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
    }
    return content;
}

function getTodayDateStr() {
    var now = new Date();
    return now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0');
}

function getDiaryDateFromTime(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ');
    if (parts.length < 1) return '';
    return parts[0];
}

function pad2(n) {
    return String(n).padStart(2, '0');
}

function buildDateListFromStart(startDateStr, endDateStr) {
    var result = [];
    if (!startDateStr || !endDateStr) return result;
    var sp = startDateStr.split('.');
    var ep = endDateStr.split('.');
    if (sp.length < 3 || ep.length < 3) return result;
    var start = new Date(parseInt(sp[0]), parseInt(sp[1]) - 1, parseInt(sp[2]));
    var end = new Date(parseInt(ep[0]), parseInt(ep[1]) - 1, parseInt(ep[2]));
    if (start > end) return result;
    var cur = new Date(start.getTime());
    while (cur <= end) {
        result.push(cur.getFullYear() + '.' + pad2(cur.getMonth()+1) + '.' + pad2(cur.getDate()));
        cur.setDate(cur.getDate() + 1);
    }
    return result;
}

function getFriendDiaryDateSet(friend) {
    var set = {};
    if (!friend || !friend.diary) return set;
    for (var i = 0; i < friend.diary.length; i++) {
        var d = friend.diary[i];
        if (!d) continue;
        var date = d.date || getDiaryDateFromTime(d.time);
        if (date) set[date] = true;
    }
    return set;
}

function getFriendDiaryByDate(friend, date) {
    if (!friend || !friend.diary || !date) return null;
    for (var i = 0; i < friend.diary.length; i++) {
        var d = friend.diary[i];
        if (!d) continue;
        var dd = d.date || getDiaryDateFromTime(d.time);
        if (dd === date) return d;
    }
    return null;
}

function bindFriendDiaryReplyLongPress(chatId) {
    var content = document.getElementById('friendDiaryContent');
    if (!content) return;
    var els = content.querySelectorAll('.friend-diary-reply[data-reply-id]');
    for (var i = 0; i < els.length; i++) {
        (function(el) {
            var date = el.getAttribute('data-date');
            var from = el.getAttribute('data-from');
            var timer = null;
            var startX = 0, startY = 0, moved = false;
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                startX = p.clientX;
                startY = p.clientY;
                moved = false;
                clearTimeout(timer);
                timer = setTimeout(function() {
                    if (moved) return;
                    if (!from || from === 'me') return;
                    openFriendDiaryReplyInput(chatId, date, from);
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - startX) > 8 || Math.abs(p.clientY - startY) > 8) {
                    moved = true;
                    clearTimeout(timer);
                }
            }
            function onEnd() {
                clearTimeout(timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(els[i]);
    }
}

function renderFriendDiaryDateList(chatId) {
    var friend = DataHub.get('friends', []).find(function(f) { return f.id === chatId; });
    if (!friend) return '';

    var state = friendDiaryViewState[chatId];
    if (!state) return '';

    var firstOpenDate = DataHub.get('firstOpenDate', null);
    if (!firstOpenDate) {
        firstOpenDate = getTodayDateStr();
    }
    var today = getTodayDateStr();
    var allDates = buildDateListFromStart(firstOpenDate, today);
    if (allDates.length === 0) return '';

    allDates.reverse();

    var dateSet = getFriendDiaryDateSet(friend);

    var groups = {};
    allDates.forEach(function(d) {
        var p = d.split('.');
        if (p.length < 3) return;
        var y = p[0];
        var m = p[1];
        if (!groups[y]) groups[y] = {};
        if (!groups[y][m]) groups[y][m] = [];
        groups[y][m].push(d);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    if (years.length === 0) return '';

    var todayParts = today.split('.');
    var curYear = todayParts[0];
    var curMonth = todayParts[1];

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === curYear);
        }
        var arrow = yearExpanded ? 'v' : '>';
        html += '<div style="font-size:10px;font-weight:600;color:#000000;padding:4px 4px;cursor:pointer;white-space:nowrap;" onclick="toggleFriendDiaryYear(\'' + chatId + '\',\'' + year + '\')">' +
            year + ' ' + arrow +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === curYear && month === curMonth);
            }
            var mArrow = monthExpanded ? 'v' : '>';
            html += '<div style="font-size:10px;color:#000000;padding:3px 4px 3px 8px;cursor:pointer;white-space:nowrap;" onclick="toggleFriendDiaryMonth(\'' + chatId + '\',\'' + year + '\',\'' + month + '\')">' +
                parseInt(month) + '月 ' + mArrow +
            '</div>';

            if (!monthExpanded) return;

            groups[year][month].forEach(function(d) {
                var hasDiary = dateSet[d] === true;
                var color = hasDiary ? '#000000' : '#bbbbbb';
                var selected = (state.selectedDate === d);
                var bg = selected ? 'background:#eef5ef;' : '';
                var shortDate = d.split('.')[2];
                html += '<div onclick="selectFriendDiaryDate(\'' + chatId + '\',\'' + d + '\')" style="font-size:9px;color:' + color + ';padding:3px 4px 3px 14px;cursor:pointer;white-space:nowrap;' + bg + '">' +
                    shortDate +
                '</div>';
            });
        });
    });

    return html;
}

function markFriendDiaryRead(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.diary) return;
    var changed = false;
    for (var i = 0; i < friend.diary.length; i++) {
        if (friend.diary[i] && friend.diary[i].unread === true) {
            friend.diary[i].unread = false;
            changed = true;
        }
    }

function sendFriendDiaryMessage(chatId, date) {
    var input = document.getElementById('friendDiaryMsgInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    var text = input.value.trim();

    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;

    var diary = getFriendDiaryByDate(friend, date);
    if (!diary) {
        diary = {
            id: 'd' + Date.now() + Math.random().toString(36).substr(2, 4),
            date: date,
            time: date + ' 00:00:00',
            content: '',
            replies: []
        };
        if (!friend.diary) friend.diary = [];
        friend.diary.push(diary);
    }
    if (!diary.replies) diary.replies = [];

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var target = null;
    if (friendDiaryViewState[chatId] && friendDiaryViewState[chatId].replyTargets) {
        target = friendDiaryViewState[chatId].replyTargets[date] || null;
    }

    var maxRound = 0;
    diary.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    diary.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: 'me',
        to: target || null,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('friends', allFriends);

    input.value = '';
    input.placeholder = '留言...';
    if (friendDiaryViewState[chatId] && friendDiaryViewState[chatId].replyTargets) {
        friendDiaryViewState[chatId].replyTargets[date] = null;
    }
    reloadFriendDiaryContent(chatId);
    showToast('已发送');

    scheduleFriendDiaryReplyAsync(chatId, date);
}

function deleteMyFriendDiaryReply(chatId, date, replyId) {
    if (!chatId || !date || !replyId) return;
    if (!confirm('确定删除这条留言吗？')) return;
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    var diary = getFriendDiaryByDate(friend, date);
    if (!diary || !diary.replies) return;
    diary.replies = diary.replies.filter(function(r) {
        return !(r.id === replyId && r.from === 'me');
    });
    DataHub.set('friends', allFriends);
    reloadFriendDiaryContent(chatId);
    showToast('已删除');
}

function hasLetterUnread(chatId) {
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return false;
    var hisReply = friend.letters.hisReply || [];
    var fromHim = friend.letters.fromHim || [];
    for (var i = 0; i < hisReply.length; i++) {
        if (hisReply[i].unread) return true;
    }
    for (var j = 0; j < fromHim.length; j++) {
        if (fromHim[j].unread) return true;
    }
    return false;
}

// ====== 信封：格式化预计回信时间 ======
function formatLetterReplyTime(replyAtMs) {
    var d = new Date(replyAtMs);
    return d.getFullYear() + '/' + pad2(d.getMonth()+1) + '/' + pad2(d.getDate()) + ' ' +
        pad2(d.getHours()) + '：' + pad2(d.getMinutes()) + '：' + pad2(d.getSeconds());
}

function formatLetterDuration(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    return h + '小时' + m + '分' + s + '秒';
}

// ====== 信封：卡片事件绑定 ======
var letterLongPressState = {
    timer: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindLetterCardEvents() {
    var container = document.getElementById('letterContent');
    if (!container) return;
    var cards = container.querySelectorAll('.letter-card');
    for (var i = 0; i < cards.length; i++) {
        (function(card) {
            var id = card.getAttribute('data-id');
            if (letterViewState.selectMode) {
                var cb = card.querySelector('.letter-select-checkbox');
                if (cb) {
                    cb.addEventListener('change', function(e) {
                        e.stopPropagation();
                        if (this.checked) letterViewState.selectedIds.add(id);
                        else letterViewState.selectedIds.delete(id);
                        updateLetterSelectBar();
                    });
                }
                card.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'INPUT' && !e.target.closest('.letter-quote-jump')) {
                        var checkbox = this.querySelector('.letter-select-checkbox');
                        if (checkbox) {
                            checkbox.checked = !checkbox.checked;
                            checkbox.dispatchEvent(new Event('change'));
                        }
                    }
                });
            } else {
    var quoteJump = card.querySelector('.letter-quote-jump');
    if (quoteJump) {
        quoteJump.addEventListener('click', function(e) {
            e.stopPropagation();
            var qid = this.getAttribute('data-quoteid');
            if (qid) jumpToOriginalLetter(qid);
        });
    }
    var replyBtn = card.querySelector('.letter-reply-btn');
    if (replyBtn) {
        replyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            openLetterReplyCompose(letterViewState.chatId, this.getAttribute('data-id'));
        });
    }
                function onStart(e) {
                    var p = e.touches ? e.touches[0] : e;
                    letterLongPressState.startX = p.clientX;
                    letterLongPressState.startY = p.clientY;
                    letterLongPressState.moved = false;
                    clearTimeout(letterLongPressState.timer);
                    letterLongPressState.timer = setTimeout(function() {
                        if (!letterLongPressState.moved) {
                            enterLetterSelectMode();
                        }
                    }, 500);
                }
                function onMove(e) {
                    var p = e.touches ? e.touches[0] : e;
                    if (Math.abs(p.clientX - letterLongPressState.startX) > 8 || Math.abs(p.clientY - letterLongPressState.startY) > 8) {
                        letterLongPressState.moved = true;
                        clearTimeout(letterLongPressState.timer);
                    }
                }
                function onEnd() {
                    clearTimeout(letterLongPressState.timer);
                }
                card.addEventListener('touchstart', onStart, { passive: true });
                card.addEventListener('touchmove', onMove, { passive: true });
                card.addEventListener('touchend', onEnd);
                card.addEventListener('mousedown', onStart);
                card.addEventListener('mousemove', onMove);
                card.addEventListener('mouseup', onEnd);
                card.addEventListener('mouseleave', onEnd);
            }
        })(cards[i]);
    }
}

// ====== 信封：跳转原信 ======
function jumpToOriginalLetter(letterId) {
    var chatId = letterViewState.chatId;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return;
    var tabs = ['toHim', 'hisReply', 'fromHim', 'myReply'];
    var foundTab = null;
    for (var i = 0; i < tabs.length; i++) {
        var list = friend.letters[tabs[i]] || [];
        for (var j = 0; j < list.length; j++) {
            if (list[j].id === letterId) { foundTab = tabs[i]; break; }
        }
        if (foundTab) break;
    }
    if (!foundTab) {
        showToast('原信已删除');
        return;
    }
    switchLetterTab(foundTab, letterId);
}

function switchLetterTab(tab, highlightId) {
    letterViewState.currentTab = tab;
    letterViewState.selectMode = false;
    letterViewState.selectedIds = new Set();
    document.querySelectorAll('.letter-tab-btn').forEach(function(b) {
        if (b.dataset.tab === tab) {
            b.style.background = 'var(--theme-main, #d4e9d6)';
            b.style.color = '#000000';
        } else {
            b.style.background = 'var(--theme-lighter, #eef5ef)';
            b.style.color = '#888888';
        }
    });
    markLetterTabRead(tab);
    renderLetterList();
    hideLetterSelectBar();
    if (highlightId) {
        setTimeout(function() {
            var card = document.querySelector('.letter-card[data-id="' + highlightId + '"]');
            if (card) {
                card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                card.style.transition = 'background 0.3s';
                var oldBg = card.style.background;
                card.style.background = '#fff3c0';
                setTimeout(function() { card.style.background = oldBg; }, 800);
            }
        }, 100);
    }
}

// ====== 信封：多选模式 ======
function enterLetterSelectMode() {
    letterViewState.selectMode = true;
    letterViewState.selectedIds = new Set();
    renderLetterList();
}

function exitLetterSelectMode() {
    letterViewState.selectMode = false;
    letterViewState.selectedIds = new Set();
    hideLetterSelectBar();
    renderLetterList();
}

function showLetterSelectBar() {
    var bar = document.getElementById('letterSelectBar');
    if (!bar) {
        bar = document.createElement('div');
        bar.id = 'letterSelectBar';
        bar.style.cssText = 'position:sticky;bottom:0;background:#ffffff;padding:10px 16px;border-top:1px solid var(--theme-border, #d4e9d6);display:flex;gap:10px;align-items:center;z-index:10;';
        var subContent = document.querySelector('#letterSubPage .sub-content');
        if (subContent) subContent.appendChild(bar);
    }
    bar.innerHTML =
        '<button class="btn-icon" onclick="exitLetterSelectMode()" style="padding:6px 14px;">取消</button>' +
        '<button class="btn-icon" onclick="toggleLetterSelectAll()" style="padding:6px 14px;">全选</button>' +
        '<span style="flex:1;font-size:13px;color:#888888;" id="letterSelectCount">已选 0 项</span>' +
        '<button class="btn-primary" onclick="deleteLetterSelected()" style="padding:6px 18px;background:#e8a0a0;color:#ffffff;">删除</button>';
    updateLetterSelectBar();
}

function hideLetterSelectBar() {
    var bar = document.getElementById('letterSelectBar');
    if (bar) bar.remove();
}

function updateLetterSelectBar() {
    var countEl = document.getElementById('letterSelectCount');
    if (countEl) countEl.textContent = '已选 ' + letterViewState.selectedIds.size + ' 项';
}

function toggleLetterSelectAll() {
    var chatId = letterViewState.chatId;
    var tab = letterViewState.currentTab;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return;
    var list = friend.letters[tab] || [];
    if (letterViewState.selectedIds.size === list.length) {
        letterViewState.selectedIds = new Set();
    } else {
        letterViewState.selectedIds = new Set();
        for (var i = 0; i < list.length; i++) {
            letterViewState.selectedIds.add(list[i].id);
        }
    }
    renderLetterList();
}

function deleteLetterSelected() {
    var count = letterViewState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的信件');
        return;
    }
    if (!confirm('确定删除选中的 ' + count + ' 封信吗？')) return;
    var chatId = letterViewState.chatId;
    var tab = letterViewState.currentTab;
    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === chatId; });
    if (!friend || !friend.letters) return;
    var list = friend.letters[tab] || [];
    friend.letters[tab] = list.filter(function(item) {
        return !letterViewState.selectedIds.has(item.id);
    });
    DataHub.set('friends', friends);
    letterViewState.selectedIds = new Set();
    exitLetterSelectMode();
    showToast('已删除 ' + count + ' 封信');
}

// ====== 信封：好友主动来信（1 小时刷，参考朋友圈概率） ======
function generateLetterFromHimOnAppUse() {
    var allFriends = DataHub.get('friends', []);
    if (allFriends.length === 0) return;
    var changed = false;
    for (var i = 0; i < allFriends.length; i++) {
        var friend = allFriends[i];
        if (Math.random() * 100 <= 30) {
            if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
            if (!friend.letters.fromHim) friend.letters.fromHim = [];
            var content = generateLetterContent(friend);
            var now = new Date();
            var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
            friend.letters.fromHim.push({
                id: 'lf' + genId(),
                content: content,
                time: time,
                unread: true
            });
            changed = true;
        }
    }
    if (changed) {
        DataHub.set('friends', allFriends);
        if (letterViewState.chatId) {
            updateLetterTabRedDots();
        }
    }
}

// ====== 信封：倒计时定时器 ======
var letterCountdownTimer = null;

function startLetterCountdownTimer() {
    stopLetterCountdownTimer();
    letterCountdownTimer = setInterval(function() {
        var els = document.querySelectorAll('.letter-countdown');
        if (els.length === 0) return;
        for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var replyAt = parseInt(el.getAttribute('data-replyat'));
            if (!replyAt) continue;
            var remain = replyAt - Date.now();
            var timeStr = formatLetterReplyTime(replyAt);
            el.innerHTML = '好友将在 ' + timeStr + ' 回信<br>（约 ' + formatLetterDuration(remain) + '后）';
        }
    }, 1000);
}

function stopLetterCountdownTimer() {
    if (letterCountdownTimer) {
        clearInterval(letterCountdownTimer);
        letterCountdownTimer = null;
    }
}
// ====== 信封：生成好友来信内容（词条库 + 词典拼句，空则兜底） ======
function generateLetterContent(friend) {
    var allItems = [];
    var publicData = DataHub.get('lexiconData', null);
    if (publicData && publicData.items) {
        publicData.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }
    if (friend && friend.privateLexicon && friend.privateLexicon.items) {
        friend.privateLexicon.items.forEach(function(item) {
            if (item.type === 'word' || item.type === 'emoji' || item.type === 'yanwenzi' || item.type === 'status' || item.type === 'weather') {
                if (item.content) allItems.push(item.content);
            }
        });
    }

    if (allItems.length > 0) {
        var count = Math.floor(Math.random() * 22) + 9;
        var selected = [];
        for (var i = 0; i < count; i++) {
            selected.push(allItems[Math.floor(Math.random() * allItems.length)]);
        }
        var content = '';
        for (var j = 0; j < selected.length; j++) {
            if (j > 0 && j % 3 === 0) content += '\n';
            content += (j > 0 && j % 3 !== 0 ? ' ' : '') + selected[j];
        }
        return content;
    }

    if (!isDictionaryEmpty()) {
        var dictSentence = generateDictionarySentence();
        if (dictSentence) return dictSentence;
    }

    return '收到你的信了';
}

// ====== 信封：生成一封好友来信（写入 fromHim，红点） ======
function generateLetterFromHim(chatId) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
    if (!friend.letters.fromHim) friend.letters.fromHim = [];

    var content = generateLetterContent(friend);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    friend.letters.fromHim.push({
        id: 'lf' + genId(),
        content: content,
        time: time,
        unread: true
    });
    DataHub.set('friends', allFriends);

    if (letterViewState.chatId === chatId) {
        if (letterViewState.currentTab === 'fromHim') {
            friend.letters.fromHim[friend.letters.fromHim.length - 1].unread = false;
            DataHub.set('friends', allFriends);
            renderLetterList();

            updateLetterTabRedDots();
        }

    showToast(friend.name + '给你写了一封信');

// ====== 信封：发送信件（由写信页调用） ======
function sendLetter(chatId, content) {
    if (!content || !content.trim()) {
        showToast('请输入内容');
        return;
    }
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === chatId; });
    if (!friend) return;
    if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
    if (!friend.letters.toHim) friend.letters.toHim = [];

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var delayMs = Math.floor(Math.random() * 24 * 60 * 60 * 1000);
    var replyAt = now.getTime() + delayMs;

    var letterId = 'lt' + genId();
    friend.letters.toHim.push({
        id: letterId,
        content: content.trim(),
        time: time,
        replyAt: replyAt,
        replyDelayMs: delayMs,
        replied: false,
        replyId: null,
        unread: false
    });
    DataHub.set('friends', allFriends);

    scheduleLetterReply(chatId, letterId, replyAt);

    showToast('已寄出');
}

// ====== 信封：登记回信 pending ======
function scheduleLetterReply(chatId, letterId, replyAt) {
    var pending = DataHub.get('letterPendingReplies', []);
    pending.push({
        id: 'lpr' + genId(),
        chatId: chatId,
        letterId: letterId,
        replyAt: replyAt,
        createdAt: Date.now()
    });
    DataHub.set('letterPendingReplies', pending);
}

// ====== 信封：检查到期的回信 ======
function checkLetterPendingReplies() {
    var pending = DataHub.get('letterPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRenderChatId = null;
    var needRenderTab = null;

    for (var i = 0; i < pending.length; i++) {
        var p = pending[i];
        if (now >= p.replyAt) {
            var ok = handleLetterPendingReply(p);
            if (ok) {
                needRenderChatId = p.chatId;
                needRenderTab = 'hisReply';
            }
        } else {
            remaining.push(p);
        }
    }

    DataHub.set('letterPendingReplies', remaining);

    if (needRenderChatId && letterViewState.chatId === needRenderChatId) {
        renderLetterList();
    }
}

// ====== 信封：执行回信 ======
function handleLetterPendingReply(p) {
    var allFriends = DataHub.get('friends', []);
    var friend = allFriends.find(function(f) { return f.id === p.chatId; });
    if (!friend) return false;
    if (!friend.letters) friend.letters = { toHim: [], hisReply: [], fromHim: [], myReply: [] };
    if (!friend.letters.toHim) friend.letters.toHim = [];
    if (!friend.letters.hisReply) friend.letters.hisReply = [];

    var toHimItem = null;
    for (var i = 0; i < friend.letters.toHim.length; i++) {
        if (friend.letters.toHim[i].id === p.letterId) {
            toHimItem = friend.letters.toHim[i];
            break;
        }
    }
    if (!toHimItem) return false;
    if (toHimItem.replied) return false;

    var content = generateLetterContent(friend);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    var replyId = 'lr' + genId();
    friend.letters.hisReply.push({
        id: replyId,
        content: content,
        time: time,
        replyToId: p.letterId,
        unread: true
    });

    toHimItem.replied = true;
    toHimItem.replyId = replyId;

    DataHub.set('friends', allFriends);
    showToast(friend.name + ' 回信了');
    return true;
}

window.deleteGroup = function(groupName) {
    if (groupName === '未分组') {
        showToast('不能删除默认分组');
        return;
    }
    if (!confirm('确定删除分组「' + groupName + '」吗？该分组下的好友将自动归入「未分组」')) return;
    var groups = DataHub.get('groups', []);
    groups = groups.filter(g => g !== groupName);
    if (!groups.includes('未分组')) {
        groups.unshift('未分组');
    }
    DataHub.set('groups', groups);
    var friends = DataHub.get('friends', []);
    friends.forEach(f => {
        if (f.group === groupName) f.group = '未分组';
    });
    DataHub.set('friends', friends);
    if (window._expandedGroups) delete window._expandedGroups[groupName];
    renderContacts();
    showToast('已删除分组');
};

    if (!confirm('确定删除该好友吗？相关聊天记录也将被删除')) return;
    var friends = DataHub.get('friends', []);
    friends = friends.filter(f => f.id !== id);
    DataHub.set('friends', friends);
    var messages = DataHub.get('messages', []);
    messages = messages.filter(m => m.chatId !== id);
    DataHub.set('messages', messages);
    var chatrooms = DataHub.get('chatrooms', []);
    chatrooms.forEach(c => {

function autoJudgeAllDictionaryPos() {
    const data = ensureDictPosGroups(getDictionaryData());
    let changed = 0;
    let moved = 0;
    data.items.forEach(function(item) {
        if (!item.pos) {
            const guessed = guessPos(item.content);
            if (guessed && guessed.length > 0) {
                item.pos = guessed;
                changed++;
            }
        }
        const posArr = getPosArray(item);
        const targetGroup = getPosGroupName(posArr[0] || '');
        if (item.group !== targetGroup) {
            item.group = targetGroup;
            moved++;
        }
    });
    if (changed === 0 && moved === 0) {
        showToast('没有需要处理的词');
        return;
    }
    saveDictionaryData(data);
    renderDictionaryList();
    renderDictionaryGroups();
    let msg = '已判断 ' + changed + ' 个词性';
    if (moved > 0) msg += '，移动 ' + moved + ' 个分组';
    showToast(msg);
}

'</div>';

function saveDictionaryItemEdit(id) {
    const contentEl = document.getElementById('dictionaryEditContent');
    if (!contentEl || !contentEl.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const content = contentEl.value.trim();
    let posArr = [];
    document.querySelectorAll('.dictionary-edit-pos-check:checked').forEach(function(cb) {
        posArr.push(cb.value);
    });
    if (posArr.length === 0) {
        posArr = guessPos(content);
    }
    const data = ensureDictPosGroups(getDictionaryData());
    const item = data.items.find(it => it.id === id);
    if (!item) return;
    const newGroup = getPosGroupName(posArr[0] || '');
    const exists = data.items.some(it =>
        it.id !== id &&
        it.group === newGroup &&
        it.content === content
    );
    if (exists) {
        showToast('该字词已存在');
        return;
    }
    item.content = content;
    item.pos = posArr;
    item.group = newGroup;
    saveDictionaryData(data);
    closeModal();
    dictionaryState.currentGroup = newGroup;
    renderDictionaryList();
    renderDictionaryGroups();
    showToast('已保存');
}

function saveDictionarySingle() {
    const input = document.getElementById('dictionarySingleInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const content = input.value.trim();
    let posArr = [];
    document.querySelectorAll('.dictionary-single-pos-check:checked').forEach(function(cb) {
        posArr.push(cb.value);
    });
    if (posArr.length === 0) {
        posArr = guessPos(content);
    }
    const data = ensureDictPosGroups(getDictionaryData());

    var existing = data.items.find(function(item) {
        return item.content === content;
    });

    if (existing) {
        var oldPosArr = getPosArray(existing);
        if (oldPosArr.length === 0) oldPosArr = guessPos(existing.content);
        var merged = oldPosArr.slice();
        var addedCount = 0;
        posArr.forEach(function(p) {
            if (merged.indexOf(p) === -1) {
                merged.push(p);
                addedCount++;
            }
        });
        if (addedCount === 0) {
            showToast('该字词已存在，词性无新增');
            return;
        }
        existing.pos = merged;
        saveDictionaryData(data);
        closeModal();
        var targetGroup = existing.group || '默认';
        dictionaryState.currentGroup = targetGroup;
        renderDictionaryList();
        renderDictionaryGroups();
        showToast('已合并 ' + addedCount + ' 个词性到「' + targetGroup + '」组的「' + content + '」');
        return;
    }

    const group = getPosGroupName(posArr[0] || '');
    data.items.push({
        id: 'dc' + Date.now() + Math.random().toString(36).substr(2, 4),
        type: 'word',
        group: group,
        content: content,
        pos: posArr,
        images: [],
        createdAt: Date.now()
    });
    saveDictionaryData(data);
    closeModal();
    dictionaryState.currentGroup = group;
    renderDictionaryList();
    renderDictionaryGroups();
    showToast('已添加到「' + group + '」组');
}

function saveDictionaryBatch() {
    const input = document.getElementById('dictionaryBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    let fixedPosArr = [];
    document.querySelectorAll('.dictionary-batch-pos-check:checked').forEach(function(cb) {
        fixedPosArr.push(cb.value);
    });
    if (fixedPosArr.length === 0) {
        showToast('请先选择词性');
        return;
    }
    const data = ensureDictPosGroups(getDictionaryData());
    let addedCount = 0;
    let mergedCount = 0;
    let mergedPosCount = 0;
    let lastMergedGroup = '';
    lines.forEach(line => {
        var existing = data.items.find(function(item) {
            return item.content === line;
        });
        if (existing) {
            var oldPosArr = getPosArray(existing);
            if (oldPosArr.length === 0) oldPosArr = guessPos(existing.content);
            var merged = oldPosArr.slice();
            var addPos = 0;
            fixedPosArr.forEach(function(p) {
                if (merged.indexOf(p) === -1) {
                    merged.push(p);
                    addPos++;
                }
            });
            if (addPos > 0) {
                existing.pos = merged;
                mergedCount++;
                mergedPosCount += addPos;
                lastMergedGroup = existing.group || '默认';
            }
            return;
        }
        const posArr = fixedPosArr.slice();
        const group = getPosGroupName(posArr[0] || '');
        data.items.push({
            id: 'dc' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: 'word',
            group: group,
            content: line,
            pos: posArr,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    saveDictionaryData(data);
    closeModal();
    renderDictionaryList();
    renderDictionaryGroups();
    let msg = '已添加 ' + addedCount + ' 条';
    if (mergedCount > 0) {
        msg += '，合并 ' + mergedCount + ' 条（共 ' + mergedPosCount + ' 个词性）';
        if (lastMergedGroup) msg += '，合并到「' + lastMergedGroup + '」组';
    }
    showToast(msg);
}

let lexiconState = {
    currentType: 'word',
    currentGroup: '默认',
    selectMode: false,
    selectedIds: new Set(),
    searchKeyword: ''
};

function initLexiconPage() {
    document.querySelectorAll('.lexicon-type-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.lexicon-type-btn').forEach(b => {
                b.style.background = 'var(--theme-lighter, #eef5ef)';

function updateTypeCounts() {
    const data = getLexiconData();
    document.querySelectorAll('.lexicon-type-btn').forEach(btn => {
        const type = btn.dataset.type;
        const count = data.items.filter(item => item.type === type).length;

            countSpan.textContent = '（' + count + '）';
        }

}

function renderLexiconGroups() {
    const container = document.getElementById('lexiconGroupTabs');
    if (!container) return;
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const groups = data.groups[type] || ['默认'];
    let html = '';
    groups.forEach(g => {
        const isActive = (g === lexiconState.currentGroup);
        const count = data.items.filter(item => item.type === type && item.group === g).length;

    });

    container.querySelectorAll('.lexicon-group-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        container.querySelectorAll('.lexicon-group-btn').forEach(b => {
            b.style.background = 'var(--theme-lighter, #eef5ef)';
            b.style.color = '#888888';
        });
        this.style.background = 'var(--theme-main, #d4e9d6)';
        this.style.color = '#000000';
            lexiconState.currentGroup = this.dataset.group;
            lexiconState.selectMode = false;
            lexiconState.selectedIds = new Set();
            renderLexiconList();
        });
    });
}

function renderLexiconList() {
    const container = document.getElementById('lexiconItemList');
    if (!container) return;
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const group = lexiconState.currentGroup;
    const keyword = lexiconState.searchKeyword.trim().toLowerCase();
    const allTypeItems = data.items.filter(item => item.type === type);
    let items = allTypeItems.filter(item => item.group === group);
    if (keyword) {
        items = items.filter(item => {
            const contentMatch = item.content && item.content.toLowerCase().includes(keyword);
            const groupMatch = item.group && item.group.toLowerCase().includes(keyword);
            return contentMatch || groupMatch;
        });
    }
    items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const totalCount = items.length;
    document.querySelectorAll('.lexicon-type-btn').forEach(btn => {
        const btnType = btn.dataset.type;
        const count = data.items.filter(item => item.type === btnType).length;
        const countSpan = btn.querySelector('.type-count');
        if (countSpan) {
            countSpan.textContent = '（' + count + '）';
        }
    });
    document.querySelectorAll('.lexicon-group-btn').forEach(btn => {
        const groupName = btn.dataset.group;
        const count = data.items.filter(item => item.type === type && item.group === groupName).length;
        const currentText = btn.textContent.replace(/（\d+）$/, '').trim();
        btn.textContent = currentText + '（' + count + '）';
    });
    let html = '';
    html += '<div style="font-size:13px;color:#999999;padding:4px 0 10px 0;border-bottom:1px solid var(--theme-lighter, #eef5ef);margin-bottom:4px;">共 ' + totalCount + ' 条</div>';
    if (items.length === 0) {
        html += '<div style="text-align:center;color:#999999;padding:30px 0;">暂无词条，点击「+ 添加」添加</div>';
        container.innerHTML = html;
        return;
    }
    const isSelectMode = lexiconState.selectMode;
    const selectedIds = lexiconState.selectedIds;
    const isImageType = (type === 'emoji_pack');
    if (isImageType) {
        html += '<div style="display:flex;flex-wrap:wrap;margin:-4px;">';
    }
    items.forEach(item => {
        const isSelected = selectedIds.has(item.id);
        let contentDisplay = '';
        if (type !== 'emoji_pack') {
            contentDisplay = item.content || '';
        }
        let imageHtml = '';
        if (isImageType && item.images && item.images.length > 0) {
            let imagesHtml = '';
            item.images.forEach(img => {
                imagesHtml += '<img src="' + img + '" style="width:48px;height:48px;border-radius:8px;object-fit:cover;border:1px solid #eef5ef;flex-shrink:0;">';
            });
            imageHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;">' + imagesHtml + '</div>';
        }
        const selectCheckbox = isSelectMode ? '<input type="checkbox" class="lexicon-select-checkbox" data-id="' + item.id + '" ' + (isSelected ? 'checked' : '') + ' style="width:18px;height:18px;accent-color:#4a7a4e;flex-shrink:0;margin-right:8px;">' : '';
        if (isImageType) {
            html += '<div class="lexicon-item" data-id="' + item.id + '" style="display:inline-flex;flex-direction:column;align-items:center;padding:6px;margin:4px;background:#ffffff;border-radius:10px;border:1px solid #eef5ef;cursor:' + (isSelectMode ? 'default' : 'pointer') + ';width:calc(25% - 8px);box-sizing:border-box;vertical-align:top;">' +
    selectCheckbox +
    '<div style="width:100%;">' + imageHtml + '</div>' +
    (!isSelectMode ? '<span style="font-size:10px;color:#999999;margin-top:4px;text-align:center;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">' + (item.group || '默认') + '</span>' : '') +
'</div>';
        } else {
            html += '<div class="lexicon-item" data-id="' + item.id + '" style="display:flex;align-items:center;padding:10px 14px;margin:2px 0;background:#ffffff;border-radius:10px;border-bottom:1px solid var(--theme-lighter, #eef5ef);cursor:' + (isSelectMode ? 'default' : 'pointer') + ';">' +
                selectCheckbox +
                '<div style="flex:1;min-width:0;">' +
                    '<div style="font-size:14px;color:#000000;word-break:break-all;">' + contentDisplay + '</div>' +
                    imageHtml +
                '</div>' +
                (!isSelectMode ? '<span style="font-size:12px;color:#999999;flex-shrink:0;">' + (item.group || '默认') + '</span>' : '') +
            '</div>';
        }
    });
    if (isImageType) {
        html += '</div>';
    }
    container.innerHTML = html;
    container.querySelectorAll('.lexicon-item').forEach(el => {
        const id = el.dataset.id;
        if (isSelectMode) {
            const checkbox = el.querySelector('.lexicon-select-checkbox');
            if (checkbox) {
                checkbox.addEventListener('change', function(e) {
                    e.stopPropagation();
                    if (this.checked) {
                        lexiconState.selectedIds.add(id);
                    } else {
                        lexiconState.selectedIds.delete(id);
                    }
                    updateLexiconSelectAllState();
                    updateLexiconSelectCount();
                    renderLexiconList();
                });
            }
            el.addEventListener('click', function(e) {
                if (e.target.tagName !== 'INPUT') {
                    const cb = this.querySelector('.lexicon-select-checkbox');
                    if (cb) {
                        cb.checked = !cb.checked;
                        cb.dispatchEvent(new Event('change'));
                    }
                }
            });
        } else {
            let pressTimer = null;
            el.addEventListener('touchstart', function(e) {
                pressTimer = setTimeout(() => {
                    enterLexiconSelectMode();
                }, 600);
            });
            el.addEventListener('touchend', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('touchmove', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('mousedown', function(e) {
                pressTimer = setTimeout(() => {
                    enterLexiconSelectMode();
                }, 600);
            });
            el.addEventListener('mouseup', function() {
                clearTimeout(pressTimer);
            });
            el.addEventListener('mouseleave', function() {
                clearTimeout(pressTimer);
            });
        }
    });
    updateLexiconSelectAllState();
    updateLexiconSelectCount();
}

function updateLexiconSelectCount() {
    const countEl = document.getElementById('lexiconSelectCount');
    if (countEl) {
        countEl.textContent = '已选 ' + lexiconState.selectedIds.size + ' 项';
    }
}

function updateLexiconSelectAllState() {
    const container = document.getElementById('lexiconItemList');
    if (!container) return;
    const checkboxes = container.querySelectorAll('.lexicon-select-checkbox');
    if (checkboxes.length === 0) return;
    const checkedCount = container.querySelectorAll('.lexicon-select-checkbox:checked').length;
    const allChecked = (checkedCount === checkboxes.length);
    const selectAllBtn = document.getElementById('lexiconSelectAllBtn');
    if (selectAllBtn) {
        selectAllBtn.textContent = allChecked ? '取消全选' : '全选';
        selectAllBtn.dataset.allChecked = allChecked ? 'true' : 'false';
    }
}

function enterLexiconSelectMode() {
    lexiconState.selectMode = true;
    lexiconState.selectedIds = new Set();
    let bottomBar = document.getElementById('lexiconSelectBottomBar');
    if (!bottomBar) {
        bottomBar = document.createElement('div');
        bottomBar.id = 'lexiconSelectBottomBar';
        bottomBar.style.cssText = 'position:sticky;bottom:0;background:#ffffff;padding:10px 16px;border-top:1px solid #d4e9d6;display:flex;gap:10px;align-items:center;z-index:10;';
        const subContent = document.getElementById('lexiconSubContent');
        if (subContent) subContent.appendChild(bottomBar);
    }
    bottomBar.innerHTML = `
        <button class="btn-icon" onclick="exitLexiconSelectMode()" style="padding:6px 14px;">取消</button>
        <button class="btn-icon" id="lexiconSelectAllBtn" onclick="toggleLexiconSelectAll()" style="padding:6px 14px;">全选</button>
        <span style="flex:1;font-size:13px;color:#888888;" id="lexiconSelectCount">已选 0 项</span>
        <button class="btn-primary" onclick="deleteLexiconSelected()" style="padding:6px 18px;background:#e8a0a0;color:#ffffff;">删除</button>
    `;
    renderLexiconList();
}

function exitLexiconSelectMode() {
    lexiconState.selectMode = false;
    lexiconState.selectedIds = new Set();
    const bottomBar = document.getElementById('lexiconSelectBottomBar');
    if (bottomBar) bottomBar.remove();
    renderLexiconList();
}

function toggleLexiconSelectAll() {
    const container = document.getElementById('lexiconItemList');
    if (!container) return;
    const checkboxes = container.querySelectorAll('.lexicon-select-checkbox');
    if (checkboxes.length === 0) return;
    const btn = document.getElementById('lexiconSelectAllBtn');
    const isAllChecked = btn && btn.dataset.allChecked === 'true';
    if (isAllChecked) {
        lexiconState.selectedIds = new Set();
    } else {
        checkboxes.forEach(cb => {
            lexiconState.selectedIds.add(cb.dataset.id);
        });
    }
    renderLexiconList();
}

function deleteLexiconSelected() {
    const count = lexiconState.selectedIds.size;
    if (count === 0) {
        showToast('请先选择要删除的词条');
        return;
    }
    if (!confirm('确定删除选中的 ' + count + ' 个词条吗？')) return;
    const data = getLexiconData();
    data.items = data.items.filter(item => !lexiconState.selectedIds.has(item.id));
    saveLexiconData(data);
    lexiconState.selectedIds = new Set();
    exitLexiconSelectMode();
    renderLexiconGroups();
    renderLexiconList();
    updateTypeCounts();
    showToast('已删除 ' + count + ' 个词条');
}

function searchLexicon() {
    const input = document.getElementById('lexiconSearchInput');
    if (input) {
        lexiconState.searchKeyword = input.value;
        lexiconState.selectMode = false;
        lexiconState.selectedIds = new Set();
        const bottomBar = document.getElementById('lexiconSelectBottomBar');
        if (bottomBar) bottomBar.remove();
        renderLexiconList();
    }
}

function saveLexiconSingle() {
    const input = document.getElementById('lexiconSingleInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const content = input.value.trim();
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const group = lexiconState.currentGroup;
    const exists = data.items.some(item =>
        item.type === type &&
        item.group === group &&
        item.content === content
    );
    if (exists) {
        showToast('该词条已存在');
        return;
    }
    data.items.push({
        id: 'l' + Date.now() + Math.random().toString(36).substr(2, 4),
        type: type,
        group: group,
        content: content,
        images: [],
        createdAt: Date.now()
    });
    saveLexiconData(data);
    closeModal();
    renderLexiconList();
    renderLexiconGroups();
    showToast('已添加');
}

function saveLexiconBatch() {
    const input = document.getElementById('lexiconBatchInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    const lines = input.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    if (lines.length === 0) {
        showToast('请输入有效内容');
        return;
    }
    const data = getLexiconData();
    const type = lexiconState.currentType;
    const group = lexiconState.currentGroup;
    let addedCount = 0;
    let skippedCount = 0;
    lines.forEach(line => {
        const exists = data.items.some(item =>
            item.type === type &&
            item.group === group &&
            item.content === line
        );
        if (exists) {
            skippedCount++;
            return;
        }
        data.items.push({
            id: 'l' + Date.now() + Math.random().toString(36).substr(2, 6),
            type: type,
            group: group,
            content: line,
            images: [],
            createdAt: Date.now()
        });
        addedCount++;
    });
    saveLexiconData(data);
    closeModal();
    renderLexiconList();
    renderLexiconGroups();
    let msg = '已添加 ' + addedCount + ' 条';
    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 条重复词条';
    showToast(msg);
}

function saveLexiconImages() {
    const fileInput = document.getElementById('lexiconImageInput');
    if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        showToast('请选择图片');
        return;
    }
    const files = Array.from(fileInput.files);
    const data = getLexiconData();
    let loadedCount = 0;
    let skippedCount = 0;
    let totalProcessed = 0;
    files.forEach(async (file) => {
        try {
            const hash = await computeImageHash(file);
            const exists = data.items.some(item =>
                item.type === 'emoji_pack' &&
                item.hash === hash
            );
            if (exists) {
                skippedCount++;
                loadedCount++;
                if (loadedCount === files.length) {
                    closeModal();
                    renderLexiconList();
                    let msg = '已上传 ' + totalProcessed + ' 张';
                    if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                    showToast(msg);
                }
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                compressImage(e.target.result, 80, function(compressedBase64) {
                    data.items.push({
                        id: 'l' + Date.now() + Math.random().toString(36).substr(2, 6),
                        type: 'emoji_pack',
                        group: lexiconState.currentGroup,
                        content: '',
                        images: [compressedBase64],
                        hash: hash,
                        createdAt: Date.now()
                    });
                    totalProcessed++;
                    loadedCount++;
                    if (loadedCount === files.length) {
                        saveLexiconData(data);
                        closeModal();
                        renderLexiconList();
                        let msg = '已上传 ' + totalProcessed + ' 张';
                        if (skippedCount > 0) msg += '，跳过 ' + skippedCount + ' 张重复图片';
                        showToast(msg);
                    }
                });
            };
            reader.readAsDataURL(file);
        } catch (err) {
            console.error('处理图片失败:', err);
            loadedCount++;
            if (loadedCount === files.length) {
                closeModal();
                renderLexiconList();
                showToast('已上传 ' + totalProcessed + ' 张，' + skippedCount + ' 张跳过');
            }
        }
    });
}

async function computeImageHash(file) {
    const buffer = await file.arrayBuffer();
    const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
}

function compressImage(base64, targetSizeKB, callback) {
    const img = new Image();
    img.onload = function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 800;
        if (width > maxSize || height > maxSize) {
            const ratio = Math.min(maxSize / width, maxSize / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let quality = 0.8;
        let result = canvas.toDataURL('image/jpeg', quality);
        while (result.length > targetSizeKB * 1024 && quality > 0.1) {
            quality -= 0.05;
            result = canvas.toDataURL('image/jpeg', quality);
        }
        callback(result);
    };
    img.src = base64;
}

    var main = 'hsl(' + h + ',' + s + '%,' + l + '%)';
    var bright = 'hsl(' + h + ',' + s + '%,' + Math.min(98, l + 8) + '%)';
    var light = 'hsl(' + h + ',' + s + '%,' + Math.min(95, l + 25) + '%)';
    var lighter = 'hsl(' + h + ',' + Math.max(0, s - 10) + '%,' + Math.min(97, l + 35) + '%)';
    var dark = 'hsl(' + h + ',' + s + '%,' + Math.max(5, l - 30) + '%)';

    var root = document.getElementById('app');
if (!root) return;
root.style.setProperty('--theme-main', main);
root.style.setProperty('--theme-bright', bright);
root.style.setProperty('--theme-light', light);
root.style.setProperty('--theme-lighter', lighter);
root.style.setProperty('--theme-dark', dark);
root.style.setProperty('--theme-border', border);
var brightTextColor = (l + 8 >= 60) ? '#000000' : '#ffffff';
root.style.setProperty('--theme-bright-text', brightTextColor);
    var oldStyle = document.getElementById('themeOverrideStyle');
    if (oldStyle) oldStyle.remove();
    var styleEl = document.createElement('style');
    styleEl.id = 'themeOverrideStyle';
    styleEl.textContent =
        '#app .top-bar{border-bottom-color:var(--theme-border);}' +
        '#app .bottom-bar{border-top-color:var(--theme-border);}' +
        '#app .chat-top{border-bottom-color:var(--theme-border);}' +

        '#app .avatar-circle{background:var(--theme-main);}' +
        '#app .chat-top-avatar{background:var(--theme-main);}' +
        '#app .msg-avatar{background:var(--theme-main);}' +
        '#app .msg-avatar-small{background:var(--theme-main);}' +
        '#app .contact-item .avatar-small{background:var(--theme-main);border-color:var(--theme-main);}' +
        '#app .contact-item .avatar-icon{background:var(--theme-main);}' +
        '#app .chat-msg.me{background:var(--theme-main);}' +
        '#app .chat-msg.other{background:var(--theme-light);}' +

function applyGlobalBgColor() {
    var settings = DataHub.get('settings', {});
    var mode = settings.bgMode || 'color';
    var appEl = document.getElementById('app');
    if (!appEl) return;
    var oldLayer = document.getElementById('globalBgLayer');
    if (oldLayer) oldLayer.remove();
    var oldCustom = document.getElementById('customBgStyle');
    if (oldCustom) oldCustom.remove();
    if (mode === 'color') {
        var c = settings.bgColor || '#ffffff';
        appEl.style.background = c;
        appEl.style.backgroundImage = 'none';
    } else if (mode === 'image') {
        var img = settings.bgImage || '';
        var opacity = (settings.bgOpacity !== undefined) ? settings.bgOpacity : 100;
        if (!img) {
            appEl.style.background = settings.bgColor || '#ffffff';
            appEl.style.backgroundImage = 'none';
        } else {
    appEl.style.background = '#ffffff';
    appEl.style.backgroundImage = 'none';
    var layer = document.createElement('div');
layer.id = 'globalBgLayer';
layer.style.cssText = 'position:absolute;top:0;left:0;right:0;bottom:0;background-image:url(' + img + ');background-size:cover;background-position:center;opacity:' + (opacity / 100) + ';z-index:0;pointer-events:none;';

}
}

}

window.saveFlow = function() {
    const type = document.getElementById('flowType');
    const amount = document.getElementById('flowAmount');
    const note = document.getElementById('flowNote');
    if (amount && parseFloat(amount.value)) {
        var wallet = DataHub.get('wallet', { balance: 0, flows: [] });
        if (!wallet.flows) wallet.flows = [];
        const now = new Date();
        const time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
        const amt = parseFloat(amount.value);
        wallet.flows.unshift({
            type: type.value,
            amount: amt,
            note: note ? note.value.trim() : '',
            time: time
        });
        if (type.value === '收入') {
            wallet.balance = (wallet.balance || 0) + amt;
        } else {
            wallet.balance = (wallet.balance || 0) - amt;
        }
        DataHub.set('wallet', wallet);
        closeModal();
        renderAll();
        openSubPage('wallet');
        showToast('流水已添加');
    }
};
