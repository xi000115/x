var momentsViewState = {
    expandedYears: {},
    expandedMonths: {},
    replyTargets: {}
};

function getMomentYearMonth(timeStr) {
    if (!timeStr) return { year: '未知', month: '未知' };
    var parts = timeStr.split(' ')[0].split('.');
    if (parts.length < 2) return { year: '未知', month: '未知' };
    return { year: parts[0] + '年', month: parts[1] + '月' };
}

function getMomentDateFull(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ');
    if (parts.length < 2) return timeStr;
    var dateParts = parts[0].split('.');
    if (dateParts.length < 3) return timeStr;
    var shortDate = parseInt(dateParts[1]) + '.' + parseInt(dateParts[2]);
    var timeParts = parts[1].split(':');
    var shortTime = '';
    if (timeParts.length >= 2) {
        shortTime = timeParts[0] + ':' + timeParts[1];
        if (timeParts.length >= 3) {
            shortTime += ':' + timeParts[2];
        }
    }
    return shortDate + ' ' + shortTime;
}

function getMomentDateShort(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ')[0].split('.');
    if (parts.length < 3) return '';
    return parseInt(parts[1]) + '.' + parseInt(parts[2]);
}

function renderMomentsListContent() {
    var moments = DataHub.get('moments', []);
    var myProfile = DataHub.get('myProfile', { nickname: '我', avatar: '' });
    var myName = myProfile.nickname || '我';
    var groups = {};
    moments.forEach(function(m) {
        var ym = getMomentYearMonth(m.time);
        if (!groups[ym.year]) groups[ym.year] = {};
        if (!groups[ym.year][ym.month]) groups[ym.year][ym.month] = [];
        groups[ym.year][ym.month].push(m);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    var defaultExpandedYear = null;
    var defaultExpandedMonth = null;
    if (years.length > 0) {
        defaultExpandedYear = years[0];
        var months = Object.keys(groups[defaultExpandedYear]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        if (months.length > 0) defaultExpandedMonth = months[0];
    }

    var html = '';
    years.forEach(function(year) {
        var yearKey = year;
        var yearExpanded;
        if (momentsViewState.expandedYears && momentsViewState.expandedYears[yearKey] !== undefined) {
            yearExpanded = momentsViewState.expandedYears[yearKey];
        } else {
            yearExpanded = (year === defaultExpandedYear);
        }
        var arrow = yearExpanded ? '▼' : '▶';
        html += '<div style="font-weight:600;padding:10px 0 6px 0;color:#000000;cursor:pointer;display:flex;align-items:center;gap:6px;" onclick="toggleMomentYear(\'' + yearKey + '\')">' +
    '<span>' + year + '</span>' +
    '<span style="font-size:12px;color:#999999;">' + arrow + '</span>' +
'</div>';

if (!yearExpanded) return;

var months = Object.keys(groups[year]).sort(function(a, b) {

        var remaining = files.length;
        for (var i = 0; i < files.length; i++) {
            (function(file) {

var momentLongPressState = {
    timer: null,
    menuEl: null,
    startX: 0,
    startY: 0,
    moved: false
};

function bindMomentReplyLongPress() {
    var container = document.getElementById('momentsSubContent');
    if (!container) return;
    var replyEls = container.querySelectorAll('.moment-reply[data-reply-id]');
    for (var i = 0; i < replyEls.length; i++) {
        (function(el) {
            var momentId = el.getAttribute('data-moment-id');
            var from = el.getAttribute('data-from');
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                momentLongPressState.startX = p.clientX;
                momentLongPressState.startY = p.clientY;
                momentLongPressState.moved = false;
                clearTimeout(momentLongPressState.timer);
                momentLongPressState.timer = setTimeout(function() {
                    if (!momentLongPressState.moved) {
                        showMomentReplyBubbleMenu(el, momentId, from, p.clientX, p.clientY);
                    }
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - momentLongPressState.startX) > 8 || Math.abs(p.clientY - momentLongPressState.startY) > 8) {
                    momentLongPressState.moved = true;
                    clearTimeout(momentLongPressState.timer);
                }
            }
            function onEnd() {
                clearTimeout(momentLongPressState.timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(replyEls[i]);
    }
}

function scheduleMomentFriendReplies(momentId, round) {
    if (!round || round < 1) round = 1;
    var friends = DataHub.get('friends', []);
    if (friends.length === 0) return;

    var pending = DataHub.get('momentsPendingReplies', []);
    var now = Date.now();

    friends.forEach(function(friend) {
        var exists = pending.some(function(p) {
            return p.momentId === momentId && p.friendId === friend.id && p.round === round;
        });
        if (exists) return;
        var needMs = Math.random() * 30 * 60 * 1000;
        pending.push({
            id: 'mpr' + Date.now() + Math.random().toString(36).substr(2, 4),
            momentId: momentId,
            friendId: friend.id,
            round: round,
            needMs: needMs,
            accumulatedMs: 0,
            lastTickAt: now,
            createdAt: now
        });
    });

    DataHub.set('momentsPendingReplies', pending);
}

function checkMomentsPendingReplies() {
    var pending = DataHub.get('momentsPendingReplies', []);
    if (pending.length === 0) return;
    var now = Date.now();
    var remaining = [];
    var needRender = false;

    pending.forEach(function(p) {
        var elapsed = now - (p.lastTickAt || now);
        if (elapsed < 0) elapsed = 0;
        p.accumulatedMs = (p.accumulatedMs || 0) + elapsed;
        p.lastTickAt = now;

        if (p.accumulatedMs < p.needMs) {
            remaining.push(p);
            return;
        }
        var handled = handleMomentPendingReply(p);
        if (handled) needRender = true;
    });

    DataHub.set('momentsPendingReplies', remaining);

    if (needRender) {
        var container = document.getElementById('momentsSubContent');
        if (container) {
            container.innerHTML = renderMomentsListContent();
        }
        renderAll();
    }
}

function handleMomentPendingReply(p) {
    var moments = DataHub.get('moments', []);
    var moment = moments.find(function(m) { return m.id === p.momentId; });
    if (!moment) return false;

    var friends = DataHub.get('friends', []);
    var friend = friends.find(function(f) { return f.id === p.friendId; });
    if (!friend) return false;

    var results = generateReplyContent(friend.id);
    if (!results || results.length === 0) return false;
    if (results.length === 1 && results[0].skip) return false;

    var first = results[0];
    var text = '';
    if (first.text && first.text.indexOf('<img') === -1) {
        text = first.text;
    }
    if (!text) return false;

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (!moment.replies) moment.replies = [];
    moment.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        to: null,
        text: text,
        time: time,
        round: p.round || 1
    });

    DataHub.set('moments', moments);
    showToast(friend.name + ' 评论了你的朋友圈');
    return true;
}

    if (!text) return false;

    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    if (!d.replies) d.replies = [];
    var maxRound = 0;
    d.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    d.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: friend.id,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('diary', diary);
    showToast(friend.name + ' 回复了你的日记');
    return true;
}

var myDiaryViewState = {
    expandedYears: {},
    expandedMonths: {},
    expandedDays: {},
    selectedId: null,
    replyTargets: {}
};

function getMyDiaryViewState() {
    return myDiaryViewState;
}

function getMyDiaryDateSet() {
    var set = {};
    var diary = DataHub.get('diary', []);
    for (var i = 0; i < diary.length; i++) {
        var d = diary[i];
        if (!d) continue;
        var date = d.date || getDiaryDateFromTime(d.time);
        if (date) set[date] = true;
    }
    return set;
}

function getMyDiaryByDate(date) {
    var diary = DataHub.get('diary', []);
    for (var i = 0; i < diary.length; i++) {
        var d = diary[i];
        if (!d) continue;
        var dd = d.date || getDiaryDateFromTime(d.time);
        if (dd === date) return d;
    }
    return null;
}

function renderMyDiaryDateList() {
    var state = getMyDiaryViewState();

    var diary = DataHub.get('diary', []);
    if (diary.length === 0) return '';

    var groups = {};
    diary.forEach(function(d) {
        if (!d) return;
        var date = d.date || getDiaryDateFromTime(d.time);
        if (!date) return;
        var p = date.split('.');
        if (p.length < 3) return;
        var y = p[0];
        var m = p[1];
        var day = p[2];
        if (!groups[y]) groups[y] = {};
        if (!groups[y][m]) groups[y][m] = {};
        if (!groups[y][m][day]) groups[y][m][day] = [];
        groups[y][m][day].push(d);
    });

    var years = Object.keys(groups).sort(function(a, b) {
        return parseInt(b) - parseInt(a);
    });

    if (years.length === 0) return '';

    var today = getTodayDateStr();
    var todayParts = today.split('.');
    var curYear = todayParts[0];
    var curMonth = todayParts[1];

    var html = '';
    years.forEach(function(year) {
        var yearExpanded;
        if (state.expandedYears[year] !== undefined) {
            yearExpanded = state.expandedYears[year];
        } else {
            yearExpanded = (year === curYear);
        }
        var arrow = yearExpanded ? 'v' : '>';
        html += '<div style="font-size:10px;font-weight:600;color:#000000;padding:4px 4px;cursor:pointer;white-space:nowrap;" onclick="toggleMyDiaryYear(\'' + year + '\')">' +
            year + ' ' + arrow +
        '</div>';

        if (!yearExpanded) return;

        var months = Object.keys(groups[year]).sort(function(a, b) {
            return parseInt(b) - parseInt(a);
        });
        months.forEach(function(month) {
            var monthKey = year + '_' + month;
            var monthExpanded;
            if (state.expandedMonths[monthKey] !== undefined) {
                monthExpanded = state.expandedMonths[monthKey];
            } else {
                monthExpanded = (year === curYear && month === curMonth);
            }
            var mArrow = monthExpanded ? 'v' : '>';
            html += '<div style="font-size:10px;color:#000000;padding:3px 4px 3px 8px;cursor:pointer;white-space:nowrap;" onclick="toggleMyDiaryMonth(\'' + year + '\',\'' + month + '\')">' +
                parseInt(month) + '月 ' + mArrow +
            '</div>';

            if (!monthExpanded) return;

            var days = Object.keys(groups[year][month]).sort(function(a, b) {
                return parseInt(b) - parseInt(a);
            });

            days.forEach(function(day) {
                var dayKey = year + '_' + month + '_' + day;
                var dayExpanded;
                if (state.expandedDays && state.expandedDays[dayKey] !== undefined) {
                    dayExpanded = state.expandedDays[dayKey];
                } else {
                    dayExpanded = true;
                }
                var dArrow = dayExpanded ? 'v' : '>';
                html += '<div onclick="toggleMyDiaryDay(\'' + year + '\',\'' + month + '\',\'' + day + '\')" style="font-size:9px;color:#000000;padding:3px 4px 3px 12px;cursor:pointer;white-space:nowrap;">' +
                    day + ' ' + dArrow +
                '</div>';

                if (!dayExpanded) return;

                var items = groups[year][month][day].slice().sort(function(a, b) {
    return (a.time || '').localeCompare(b.time || '');
});
items.forEach(function(d, idx) {
                    var selected = (state.selectedId === d.id);
                    var bg = selected ? 'background:#eef5ef;' : '';
                    var label = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][idx] || (idx + 1);
                    html += '<div onclick="selectMyDiaryItem(\'' + d.id + '\')" style="font-size:9px;color:#000000;padding:3px 4px 3px 20px;cursor:pointer;white-space:nowrap;' + bg + '">' +
                        label + '则' +
                    '</div>';
                });
            });
        });
    });

    return html;
}

function renderMyDiaryContent(diaryId) {
    var myProfile = DataHub.get('myProfile', { nickname: '我', avatar: '' });
    var myName = myProfile.nickname || '我';
    var friends = DataHub.get('friends', []);

    }

    var p = date.split('.');
    if (p.length >= 3) {
        dateDisplay = p[0] + '年' + parseInt(p[1]) + '月' + parseInt(p[2]) + '日';
    }

    var html = '';

    html += '<div style="font-size:14px;font-weight:600;color:#000000;margin-bottom:10px;">' + dateDisplay + '</div>';

    if (!d.content) {
        html += '<div style="text-align:center;color:#999999;padding:30px 0;font-size:13px;">这天没有日记</div>';

    html += '<div style="background:#f8fbf8;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.7;color:#000000;white-space:pre-wrap;word-break:break-word;">' +

    '</div>';

        html += '<div style="background:#f8fbf8;border-radius:12px;padding:10px 12px;margin-bottom:12px;">';
        replies.forEach(function(r) {
            var fromName = '';
            if (r.from === 'me') {
                fromName = myName;
            } else {
                var f = friends.find(function(x) { return x.id === r.from; });
                fromName = f ? f.name : '好友';
            }
            var prefix = '';
            if (r.to === 'me') {
                prefix = fromName + ' @ ' + myName + '：';
            } else if (r.to) {
                var tf = friends.find(function(x) { return x.id === r.to; });
                var toName = tf ? tf.name : '好友';
                prefix = fromName + ' @ ' + toName + '：';
            } else {
                prefix = fromName + '：';
            }
            var deleteBtn = '';
            if (r.from === 'me') {
                deleteBtn = '<span onclick="event.stopPropagation();deleteMyDiaryReply(\'' + diaryId + '\',\'' + (r.id || '') + '\')" style="flex-shrink:0;margin-left:8px;color:#d4b0b0;cursor:pointer;font-size:14px;user-select:none;">x</span>';
            }
            html += '<div class="my-diary-reply" data-reply-id="' + (r.id || '') + '" data-diary-id="' + diaryId + '" data-from="' + (r.from || '') + '" style="display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;color:#000000;padding:4px 0;cursor:pointer;word-break:break-word;">' +
                '<span style="flex:1;min-width:0;">' + prefix + (r.text || '') + '</span>' +
                deleteBtn +
            '</div>';
        });
        html += '</div>';
    }

    var inputHtml = '';
    var locked = d.locked === true;
    if (locked) {
        inputHtml = '<div style="font-size:12px;color:#999999;margin-bottom:8px;">已上锁，好友无法回复</div>';
    } else {
        inputHtml = '<div style="display:flex;gap:8px;margin-bottom:8px;">' +
            '<input type="text" id="myDiaryMsgInput" placeholder="留言..." style="flex:1;padding:8px 14px;border:1px solid #d4e4d6;border-radius:20px;font-size:14px;outline:none;background:#ffffff;color:#000000;">' +
            '<button onclick="sendMyDiaryMessage(\'' + diaryId + '\')" style="padding:8px 18px;background:var(--theme-main, #d4e9d6);border:none;border-radius:20px;font-size:14px;cursor:pointer;color:#000000;white-space:nowrap;">发送</button>' +
        '</div>';
    }

    html += inputHtml;

    var lockSvg = locked
    ? '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
    : '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#000000" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';
html += '<div style="display:flex;gap:8px;">' +
    '<button class="btn-icon" onclick="toggleDiaryLock(\'' + (d.id || '') + '\')" style="color:#000000;">' + lockSvg + '</button>' +
    '<button class="btn-icon" onclick="deleteMyDiary(\'' + (d.id || '') + '\')">删除</button>' +
'</div>';

    return html;
}

function bindMyDiaryReplyLongPress() {
    var content = document.getElementById('myDiaryContent');
    if (!content) return;
    var els = content.querySelectorAll('.my-diary-reply[data-reply-id]');
    for (var i = 0; i < els.length; i++) {
        (function(el) {
            var diaryId = el.getAttribute('data-diary-id');
            var from = el.getAttribute('data-from');
            var timer = null;
            var startX = 0, startY = 0, moved = false;
            function onStart(e) {
                var p = e.touches ? e.touches[0] : e;
                startX = p.clientX;
                startY = p.clientY;
                moved = false;
                clearTimeout(timer);
                timer = setTimeout(function() {
                    if (moved) return;
                    if (!from || from === 'me') return;
                    openMyDiaryReplyInput(diaryId, from);
                }, 500);
            }
            function onMove(e) {
                var p = e.touches ? e.touches[0] : e;
                if (Math.abs(p.clientX - startX) > 8 || Math.abs(p.clientY - startY) > 8) {
                    moved = true;
                    clearTimeout(timer);
                }
            }
            function onEnd() {
                clearTimeout(timer);
            }
            el.addEventListener('touchstart', onStart, { passive: true });
            el.addEventListener('touchmove', onMove, { passive: true });
            el.addEventListener('touchend', onEnd);
            el.addEventListener('mousedown', onStart);
            el.addEventListener('mousemove', onMove);
            el.addEventListener('mouseup', onEnd);
            el.addEventListener('mouseleave', onEnd);
        })(els[i]);
    }
}

function openMyDiaryReplyInput(diaryId, targetId) {
    var state = getMyDiaryViewState();
    state.replyTargets[diaryId] = targetId;
    var input = document.getElementById('myDiaryMsgInput');
    if (!input) return;
    var myProfile = DataHub.get('myProfile', { nickname: '我' });
    var myName = myProfile.nickname || '我';
    var tf = DataHub.get('friends', []).find(function(x) { return x.id === targetId; });
    var targetName = tf ? tf.name : '好友';
    input.placeholder = myName + ' @ ' + targetName + '：';
    input.focus();
    showToast('已选择回复 ' + targetName);
}

function sendMyDiaryMessage(diaryId) {
    var input = document.getElementById('myDiaryMsgInput');
    if (!input || !input.value.trim()) {
        showToast('请输入内容');
        return;
    }
    var text = input.value.trim();

    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === diaryId; });
    if (!d) return;
    if (!d.replies) d.replies = [];
    if (d.locked === true) {
        showToast('已上锁，无法回复');
        return;
    }

    var now = new Date();
    var time = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate()) + ' ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds());

    var state = getMyDiaryViewState();
    var target = state.replyTargets[diaryId] || null;

    var maxRound = 0;
    d.replies.forEach(function(r) {
        if (r.round && r.round > maxRound) maxRound = r.round;
    });

    d.replies.push({
        id: 'r' + Date.now() + Math.random().toString(36).substr(2, 4),
        from: 'me',
        to: target || null,
        text: text,
        time: time,
        round: maxRound + 1
    });

    DataHub.set('diary', diary);

    input.value = '';
    input.placeholder = '留言...';
    state.replyTargets[diaryId] = null;
    reloadMyDiaryContent();
    showToast('已发送');

    scheduleDiaryFriendReplies(diaryId, maxRound + 2);
}

function deleteMyDiaryReply(diaryId, replyId) {
    if (!diaryId || !replyId) return;
    if (!confirm('确定删除这条留言吗？')) return;
    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === diaryId; });
    if (!d || !d.replies) return;
    d.replies = d.replies.filter(function(r) {
        return !(r.id === replyId && r.from === 'me');
    });
    DataHub.set('diary', diary);
    reloadMyDiaryContent();
    showToast('已删除');
}

        <textarea id="diaryContent" style="width:100%;height:80px;padding:8px;border:1px solid #d4e4d6;border-radius:12px;font-size:14px;" placeholder="今天发生了什么..."></textarea>

window.saveDiary = function() {
    var content = document.getElementById('diaryContent');
    if (!content || !content.value.trim()) return;

    var diary = DataHub.get('diary', []);
    var now = new Date();
    var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
    var today = now.getFullYear() + '.' + pad2(now.getMonth()+1) + '.' + pad2(now.getDate());

    var diaryId = 'd' + Date.now() + Math.random().toString(36).substr(2, 4);
    diary.unshift({
        id: diaryId,
        date: today,
        content: content.value.trim(),
        time: time,
        locked: false,
        replies: []
    });
    DataHub.set('diary', diary);

    var state = getMyDiaryViewState();
    state.selectedId = diaryId;

    closeModal();
    renderAll();
    openSubPage('diary');
    showToast('已保存');

    scheduleDiaryFriendReplies(diaryId, 1);
};

window.toggleDiaryLock = function(id) {
    var diary = DataHub.get('diary', []);
    var d = diary.find(function(x) { return x.id === id; });
    if (!d) return;
    d.locked = (d.locked === true) ? false : true;
    DataHub.set('diary', diary);

    var state = getMyDiaryViewState();
    state.selectedId = id;

    var content = document.getElementById('myDiaryContent');
    if (content) {
        content.innerHTML = renderMyDiaryContent(id);
        bindMyDiaryReplyLongPress();
    }
    showToast(d.locked ? '已上锁' : '已解锁');
};

window.deleteMyDiary = function(id) {
    if (!id) return;
    if (!confirm('确定删除这条日记吗？好友回复也会一起删除。')) return;
    var diary = DataHub.get('diary', []);
    diary = diary.filter(function(x) { return x.id !== id; });
    DataHub.set('diary', diary);

    var pending = DataHub.get('diaryPendingReplies', []);
    pending = pending.filter(function(p) { return p.diaryId !== id; });
    DataHub.set('diaryPendingReplies', pending);

    var state = getMyDiaryViewState();
    if (state.selectedId === id) {
        state.selectedId = diary.length > 0 ? diary[0].id : null;
    }

    renderAll();
    openSubPage('diary');
    showToast('已删除');
};

// ====== 视频通话异常中断检测 ======
function isVideoCallShouldInterruptOnSwitch() {
    return videoCallState.active;
}

window.addEventListener('beforeunload', function() {
    if (videoCallState.active && !videoCallState.minimized) {
        var duration = videoCallState.currentDuration || 0;
        var chatId = videoCallState.chatId;
        try {
            var msgs = DataHub.get('messages', []);
            var now = new Date();
            var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
            msgs.push({
                id: 'm' + genId(),
                chatId: chatId,
                from: 'me',
                text: '和 ' + getVideoCallChatName(chatId) + ' 通话意外中断 ' + formatCallDuration(duration),
                time: time,
                unread: 0
            });
            DataHub.set('messages', msgs);
            DataHub.set('pendingVideoCallInterrupt', { duration: duration, time: Date.now() });
        } catch (e) {}
    }
});

document.addEventListener('visibilitychange', function() {
    if (document.hidden && videoCallState.active && !videoCallState.minimized) {
        var duration = videoCallState.currentDuration || 0;
        var chatId = videoCallState.chatId;
        try {
            var msgs = DataHub.get('messages', []);
            var now = new Date();
            var time = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
            msgs.push({
                id: 'm' + genId(),
                chatId: chatId,
                from: 'me',
                text: '和 ' + getVideoCallChatName(chatId) + ' 通话意外中断 ' + formatCallDuration(duration),
                time: time,
                unread: 0
            });
            DataHub.set('messages', msgs);
            DataHub.set('pendingVideoCallInterrupt', { duration: duration, time: Date.now() });
        } catch (e) {}
        stopVideoCallTimers();
        videoCallState.active = false;
        videoCallState.chatId = null;
        videoCallState.status = 'idle';
        videoCallState.minimized = false;
        videoCallState.currentDuration = 0;
        var container = document.getElementById('videoCallContainer');
        if (container) container.innerHTML = '';
    }
});

function switchPage(pageId) {
    if (isVideoCallShouldInterruptOnSwitch()) {
        checkVideoCallInterrupt();
    }
    document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(pageId);
    if (target) target.classList.add('active');
    document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
    document.querySelector('.tab-item[data-page="' + pageId + '"]')?.classList.add('active');

function showAddFriend() {
    const groups = DataHub.get('groups', ['好友', '亲人', '爱人', '未分组']);
    let options = groups.map(g => '<option value="' + g + '">' + g + '</option>').join('');
    const html = `
        <div class="modal-title">添加好友</div>
        <input type="text" id="newFriendName" placeholder="昵称">
        <select id="newFriendGroup">${options}</select>
        <div class="btn-row">
            <button class="cancel" onclick="closeModal()">取消</button>
            <button class="confirm" onclick="saveFriend()">添加</button>
        </div>
    `;
    showModal(html);
    setTimeout(() => document.getElementById('newFriendName')?.focus(), 100);
}

window.saveFriend = function() {
    const name = document.getElementById('newFriendName');
    const group = document.getElementById('newFriendGroup');
    if (name && name.value.trim()) {
        var friends = DataHub.get('friends', []);
        friends.push({ id: 'f' + genId(), name: name.value.trim(), avatar: '', group: group.value });
        DataHub.set('friends', friends);
        closeModal();
        renderAll();
        showToast('已添加好友');
    }
};

function showAddChatroom() {
    const friends = DataHub.get('friends', []);
    if (friends.length < 2) {
        alert('至少需要2位好友才能创建群聊');
        return;
    }
    let checkboxes = friends.map(f => `
        <label style="display:flex;align-items:center;gap:6px;padding:4px 0;">
            <input type="checkbox" value="${f.id}"> ${f.name}
        </label>
    `).join('');
    const html = `
        <div class="modal-title">创建群聊</div>
        <input type="text" id="newRoomName" placeholder="群聊名称">
        <div style="margin:8px 0;font-size:13px;color:#999999;">选择群成员（至少2人）</div>
        <div style="max-height:150px;overflow-y:auto;">${checkboxes}</div>
        <div class="btn-row">
            <button class="cancel" onclick="closeModal()">取消</button>
            <button class="confirm" onclick="saveChatroom()">创建</button>
        </div>
    `;
    showModal(html);
}

window.saveChatroom = function() {
    const name = document.getElementById('newRoomName');
    const checks = document.querySelectorAll('#modalBox input[type="checkbox"]:checked');
    if (name && name.value.trim() && checks.length >= 2) {
        const members = Array.from(checks).map(c => c.value);
        var chatrooms = DataHub.get('chatrooms', []);
        chatrooms.push({ id: 'c' + genId(), name: name.value.trim(), avatar: '', members: members });
        DataHub.set('chatrooms', chatrooms);
        closeModal();
        renderAll();
        showToast('已创建群聊');
    } else {
        alert('请填写群名称并至少选择2位好友');
    }
};

function initEvents() {
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.addEventListener('click', function() {
            const page = this.dataset.page;
            if (page) switchPage(page);
        });
    });
    document.querySelector('#contactTabs')?.addEventListener('click', function(e) {
        const btn = e.target.closest('button');
        if (!btn) return;
        document.querySelectorAll('#contactTabs button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window._expandedGroups = {};
        renderContacts();
    });
    document.getElementById('addBtn')?.addEventListener('click', function() {

            <div class="modal-title">添加</div>
            <button class="btn-primary" style="width:100%;margin-bottom:8px;" onclick="closeModal();showAddFriend();">添加好友</button>

    });

        switchEmojiLib(btn.dataset.lib);
    });
}

async function init() {
    await getDB();
    const data = await loadData();
    if (data) {
        DataHub.setAll(data);
    } else {
        var fresh = JSON.parse(JSON.stringify(defaultData));
        if (!fresh.groups.includes('未分组')) {
            fresh.groups.push('未分组');
        }
        DataHub.setAll(fresh);
    }

    var current = DataHub.getAll();
    for (let key in defaultData) {
        if (!(key in current)) {
            current[key] = defaultData[key];
        }
        if (key === 'wallet' && !current[key].flows) current[key].flows = [];
        if (key === 'settings') {
            for (let sk in defaultData.settings) {
                if (!(sk in current[key])) current[key][sk] = defaultData.settings[sk];
            }
        }
    }

    var groups = DataHub.get('groups', []);
if (!groups.includes('未分组')) {
    groups.push('未分组');
    DataHub.set('groups', groups);
}

var firstOpenDate = DataHub.get('firstOpenDate', null);
if (!firstOpenDate) {
    var now0 = new Date();
    firstOpenDate = now0.getFullYear() + '.' + String(now0.getMonth()+1).padStart(2,'0') + '.' + String(now0.getDate()).padStart(2,'0');
    DataHub.set('firstOpenDate', firstOpenDate);
}

var dict = DataHub.get('dictionary', null);
if (!dict) {
    dict = JSON.parse(JSON.stringify(defaultData.dictionary));
    DataHub.set('dictionary', dict);
} else {
    if (!dict.groups) dict.groups = { word: ['默认'] };
    if (!dict.groups.word) dict.groups.word = ['默认'];
    if (!dict.items) dict.items = [];
    DataHub.set('dictionary', dict);
}

    var friends = DataHub.get('friends', []);
    for (var fi = 0; fi < friends.length; fi++) {
        var f = friends[fi];
        if (!f.privateAlbum) f.privateAlbum = [];
        if (!f.settings) f.settings = null;
        if (!f.storage) f.storage = null;
    }
    DataHub.set('friends', friends);

    var chatrooms = DataHub.get('chatrooms', []);
    for (var ci = 0; ci < chatrooms.length; ci++) {
        var c = chatrooms[ci];
        if (!c.settings) c.settings = null;
        if (!c.storage) c.storage = null;
    }
    DataHub.set('chatrooms', chatrooms);

    if (!DataHub.get('votes', null)) {
        DataHub.set('votes', []);
    }

    function initFriendAI() {
    var friends = DataHub.get('friends', []);
    friends.forEach(function(friend) {
        if (!friend.diary) friend.diary = [];
        for (var i = 0; i < friend.diary.length; i++) {
            var d = friend.diary[i];
            if (!d) continue;
            if (!d.date) {
                d.date = getDiaryDateFromTime(d.time) || getTodayDateStr();
            }
            if (!d.replies) d.replies = [];
            if (d.content === undefined) d.content = '';
        }
        if (Math.random() * 100 <= 30) {
            generateMomentForFriend(friend);
        }
    });
    DataHub.set('friends', friends);
}
    
    function generateMomentsOnAppUse() {
    var friends = DataHub.get('friends', []);
    friends.forEach(function(friend) {
        if (Math.random() * 100 <= 30) {
            generateMomentForFriendById(friend.id);
        }
    });
}

    function generateMomentForFriend(friend) {
    generateMomentForFriendById(friend.id);
}
